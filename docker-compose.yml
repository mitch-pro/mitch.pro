services:
  # Caddy Reverse Proxy (Main entry point on Port 6800)
  reverse-proxy:
    image: caddy:2.7-alpine
    container_name: mitch-caddy-proxy
    restart: unless-stopped
    ports:
      - "0.0.0.0:6800:6800"
    volumes:
      - ./caddy:/etc/caddy
    depends_on:
      - webserver-blue
      - webserver-green

  # RAM-disk operation is opt-in via MITCH_DB_PATH=/ramdisk/mitchpro.db after
  # a coordinated migration. The default keeps both slots on the current disk DB.
  # Litestream sidecar: replicates mitchpro.db between the shared tmpfs
  # ramdisk (webserver-blue/green read/write it there) and the HDD-backed
  # ./data mount. One shared ramdisk, one replication stream - see
  # sql-sync/entrypoint.sh for why this has to be a standalone sidecar
  # rather than wrapping each webserver process individually.
  sql-sync:
    build: ./sql-sync
    container_name: mitch-sql-sync
    restart: unless-stopped
    volumes:
      - sql_ramdisk:/ramdisk
      - ./data/litestream-replica:/replica
      - ./data:/legacy
    healthcheck:
      test: ["CMD", "test", "-f", "/ramdisk/mitchpro.db"]
      interval: 2s
      timeout: 2s
      retries: 30
      start_period: 5s

  # Production Slot A: Blue Webserver
  webserver-blue:
    build:
      context: ${WEBSERVER_BUILD_CONTEXT:-./rust}
      dockerfile: ${WEBSERVER_DOCKERFILE:-Dockerfile}
    container_name: mitch-webserver-blue
    restart: unless-stopped
    depends_on:
      conduit:
        condition: service_started
      livekit:
        condition: service_started
      mail-rs:
        condition: service_started
      tor-browser:
        condition: service_started
      sql-sync:
        condition: service_healthy
    ports:
      - "127.0.0.1:6811:6800"
    volumes:
      - ./server.js:/app/server.js
      - ./data:/app/data
      - sql_ramdisk:/ramdisk
      - ./mail:/app/mail
      - ./logs:/app/logs
      - ./webserver:/app/webserver
      - ./webvm:/app/webvm
      - /opt/userdata:/opt/userdata
      # Mount the host .env so PVE_SSH_KEY_PATH (and friends) actually
      # reach the container. .env is in .dockerignore so it never gets
      # baked into the image, and without this mount the server starts
      # with process.env.PVE_SSH_KEY_PATH === undefined.
      - ./.env:/app/.env:ro
    environment:
      - MITCH_BASE=/app
      - MITCH_SERVICE=mitch-server
      - MITCH_DB_PATH=${MITCH_DB_PATH:-/app/data/mitchpro.db}
      - PORT=6800
      - TOR_SERVICE_URL=http://tor-browser:6840
      - PIA_USER
      - PIA_PASS
      - PIA_USERNAME
      - PIA_PASSWORD
      - SUPPORT_USER
      - SUPPORT_PASS
      - NOREPLY_USER
      - NOREPLY_PASS
      - MAIL_SMTP_HOST
      - MAIL_IMAP_HOST
      - NTFY_TOPIC
      - NTFY_USER
      - NTFY_PASS
      - SUPPORT_EMAIL
      - GMAIL_USER_ALT
      - GMAIL_USER
      - GMAIL_PASS_ALT
      - GMAIL_PASS
      - VAPID_PUBLIC_KEY
      - VAPID_PRIVATE_KEY
      - GEMINI_API_KEY
      - GROQ_API_KEY
      - DEEPSEEK_API_KEY
      - GIPHY_API_KEY
      - GIPHY_API_KEYS
      - RECAPTCHA_SECRET_KEY
      - SECRET_KEY
      - GOOGLE_ANALYTICS_ID
      - RECAPTCHA_SITE_KEY
      - BLOOKET_BOT_HOST=blooket-bot
      - CONDUIT_HOST=conduit
      - LIVEKIT_HOST=livekit
      - LIVEKIT_PORT=7880
      - LIVEKIT_API_KEY=mitchlivekit
      - LIVEKIT_API_SECRET=mitch-secret-livekit-matrix-key-2026
      - MAIL_RS_HOST=mail-rs
      - NODE_ENV=production
      - SESSION_COOKIE_SECURE=1
      # Proxmox bridge — explicit pass-through so the loader doesn't
      # have to be the only thing standing between the var and the SSH
      # call. If .env is missing the var, Docker still has it here.
      - PVE_SSH_HOST
      - PVE_SSH_USER
      - PVE_SSH_KEY_PATH
      - PVE_SSH_PORT
      - PVE_URL
      - PVE_TOKEN
      - PVE_NODE
      - PVE_TEMPLATE_LINUX
      - PVE_LXC_TEMPLATE
      - PROXMOX_HOST
      - PROXMOX_PORT
      - PROXMOX_NODE
      - PROXMOX_TOKEN_ID
      - PROXMOX_TOKEN_SECRET
      - PROXMOX_VERIFY_TLS
      - PROXMOX_TLS_SERVERNAME
      - PROXMOX_DESKTOP_TEMPLATES
      - PROXMOX_ISO_STORAGE
      - PROXMOX_VM_STORAGE
      - PROXMOX_VM_BRIDGE
      - HIDE_VM_FEATURES

  # Production Slot B: Green Webserver
  webserver-green:
    build:
      context: ${WEBSERVER_BUILD_CONTEXT:-./rust}
      dockerfile: ${WEBSERVER_DOCKERFILE:-Dockerfile}
    container_name: mitch-webserver-green
    restart: unless-stopped
    depends_on:
      conduit:
        condition: service_started
      livekit:
        condition: service_started
      mail-rs:
        condition: service_started
      tor-browser:
        condition: service_started
      sql-sync:
        condition: service_healthy
    ports:
      - "127.0.0.1:6812:6800"
    volumes:
      - ./server.js:/app/server.js
      - ./data:/app/data
      - sql_ramdisk:/ramdisk
      - ./mail:/app/mail
      - ./logs:/app/logs
      - ./webserver:/app/webserver
      - ./webvm:/app/webvm
      - /opt/userdata:/opt/userdata
      - ./.env:/app/.env:ro
    environment:
      - MITCH_BASE=/app
      - MITCH_SERVICE=mitch-server
      - MITCH_DB_PATH=${MITCH_DB_PATH:-/app/data/mitchpro.db}
      - PORT=6800
      - TOR_SERVICE_URL=http://tor-browser:6840
      - PIA_USER
      - PIA_PASS
      - PIA_USERNAME
      - PIA_PASSWORD
      - SUPPORT_USER
      - SUPPORT_PASS
      - NOREPLY_USER
      - NOREPLY_PASS
      - MAIL_SMTP_HOST
      - MAIL_IMAP_HOST
      - NTFY_TOPIC
      - NTFY_USER
      - NTFY_PASS
      - SUPPORT_EMAIL
      - GMAIL_USER_ALT
      - GMAIL_USER
      - GMAIL_PASS_ALT
      - GMAIL_PASS
      - VAPID_PUBLIC_KEY
      - VAPID_PRIVATE_KEY
      - GEMINI_API_KEY
      - GROQ_API_KEY
      - DEEPSEEK_API_KEY
      - GIPHY_API_KEY
      - GIPHY_API_KEYS
      - RECAPTCHA_SECRET_KEY
      - SECRET_KEY
      - GOOGLE_ANALYTICS_ID
      - RECAPTCHA_SITE_KEY
      - BLOOKET_BOT_HOST=blooket-bot
      - CONDUIT_HOST=conduit
      - LIVEKIT_HOST=livekit
      - LIVEKIT_PORT=7880
      - LIVEKIT_API_KEY=mitchlivekit
      - LIVEKIT_API_SECRET=mitch-secret-livekit-matrix-key-2026
      - MAIL_RS_HOST=mail-rs
      - NODE_ENV=production
      - SESSION_COOKIE_SECURE=1
      - PVE_SSH_HOST
      - PVE_SSH_USER
      - PVE_SSH_KEY_PATH
      - PVE_SSH_PORT
      - PVE_URL
      - PVE_TOKEN
      - PVE_NODE
      - PVE_TEMPLATE_LINUX
      - PVE_LXC_TEMPLATE
      - PROXMOX_HOST
      - PROXMOX_PORT
      - PROXMOX_NODE
      - PROXMOX_TOKEN_ID
      - PROXMOX_TOKEN_SECRET
      - PROXMOX_VERIFY_TLS
      - PROXMOX_TLS_SERVERNAME
      - PROXMOX_DESKTOP_TEMPLATES
      - PROXMOX_ISO_STORAGE
      - PROXMOX_VM_STORAGE
      - PROXMOX_VM_BRIDGE
      - HIDE_VM_FEATURES

  # Rust mail pipeline (plan Step 2 of the Rust rewrite, on the rust branch).
  # Replaces the mail/*.js nodemailer CLIs + imap_watcher; the JS scripts
  # forward here and fall back to nodemailer when this service is down.
  mail-rs:
    build:
      context: ./rust
      dockerfile: Dockerfile
    container_name: mitch-mail-rs
    restart: unless-stopped
    depends_on:
      sql-sync:
        condition: service_healthy
    expose:
      - "6902"
    volumes:
      - ./data:/app/data
      - sql_ramdisk:/ramdisk
      - ./.env:/app/.env:ro
    environment:
      - MITCH_SERVICE=mitch-mail
      - MITCH_BASE=/app
      - MITCH_DB_PATH=${MITCH_DB_PATH:-/app/data/mitchpro.db}
      - MAIL_RS_PORT=6902
      - PIA_USER
      - PIA_PASS
      - PIA_USERNAME
      - PIA_PASSWORD
      - SUPPORT_USER
      - SUPPORT_PASS
      - NOREPLY_USER
      - NOREPLY_PASS
      - MAIL_SMTP_HOST
      - MAIL_IMAP_HOST
      - NTFY_TOPIC
      - NTFY_USER
      - NTFY_PASS
      - SUPPORT_EMAIL
      - GMAIL_USER_ALT
      - GMAIL_USER
      - GMAIL_PASS_ALT
      - GMAIL_PASS

  # Node.js + Xvfb Stream Proxy (Port 8081)
  proxy:
    build:
      context: ./proxy
      dockerfile: Dockerfile.proxy
    container_name: mitch-stream-proxy
    restart: unless-stopped
    ports:
      - "127.0.0.1:8081:8081"
    volumes:
      - ./logs:/app/logs

  # Python 3 IP Server
  ipserver:
    image: python:3.10-alpine
    container_name: mitch-ipserver
    restart: unless-stopped
    volumes:
      - ./tools:/app/tools
      - ./logs:/app/logs
      - ./data:/root/tailscale/chatroom/data
      - /home/mitch/server/fullchain.pem:/root/tailscale/fullchain.pem:ro
      - /home/mitch/server/privkey.pem:/root/tailscale/privkey.pem:ro
    command: python3 /app/tools/ipserver.py

  # Blooket Bot Headless Browser Automation Service
  blooket-bot:
    build:
      context: ./blooket-bot
      dockerfile: Dockerfile
    container_name: mitch-blooket-bot
    restart: unless-stopped
    ports:
      - "127.0.0.1:8082:8082"
    volumes:
      - ./blooket-bot/join_blooket.py:/app/join_blooket.py
      - ./blooket-bot/cheats:/app/cheats
      - ./blooket-bot/bookmarks_7_26_26.html:/app/bookmarks_7_26_26.html
      - ./blooket-bot/server.js:/app/server.js
      - ./blooket-bot/cheat-blooket-gui.bookmarklet.js:/app/cheat-blooket-gui.bookmarklet.js
    environment:
      - PYTHONUNBUFFERED=1
      - FLARESOLVERR_URL=http://flaresolverr:8191/v1

  # FlareSolverr Service for Bypassing Cloudflare
  flaresolverr:
    image: ghcr.io/flaresolverr/flaresolverr:latest
    container_name: mitch-flaresolverr
    restart: unless-stopped
    ports:
      - "127.0.0.1:8191:8191"
    environment:
      - LOG_LEVEL=info

  # Matrix Conduit Homeserver (Ultra-lightweight Rust backend)
  conduit:
    image: matrixconduit/matrix-conduit:latest
    container_name: mitch-matrix-conduit
    restart: unless-stopped
    ports:
      - "127.0.0.1:6167:6167"
    volumes:
      - ./conduit.toml:/etc/conduit.toml:ro
      - ./data/conduit:/var/lib/matrix-conduit
    environment:
      - CONDUIT_CONFIG=/etc/conduit.toml
      - CONDUIT_ALLOW_FEDERATION=true
      - CONDUIT_TRUSTED_SERVERS=["matrix.org"]

  # LiveKit SFU for Matrix Voice & Video Calling (MSC3401 / MSC4143 MatrixRTC)
  livekit:
    image: livekit/livekit-server:latest
    container_name: mitch-livekit
    restart: unless-stopped
    # Only ports 443/80 are forwarded on the router (home DMZ, dynamic IP) —
    # 7881 (TCP) and 7882 (UDP) below are NOT reachable from outside the LAN,
    # and even on-LAN they can fail (VPNs, restrictive wifi). Direct UDP/TCP
    # is still attempted first (free, lower latency when it works), but
    # turn_servers below gives every client a TURN-over-TLS:443 fallback —
    # the Open Relay Project's free, public, no-signup static-auth TURN
    # relay (the same host/secret documented for self-hosted Matrix/Synapse
    # deployments — https://www.metered.ca/tools/openrelay/), which rides
    # over the same port already used for HTTPS and gets through almost any
    # network, including school wifi. Override via TURN_RELAY_HOST/
    # TURN_RELAY_SECRET (e.g. a private dynamic-credential relay) if the
    # shared public pool ever isn't enough; the defaults work with nothing
    # else configured.
    environment:
      LIVEKIT_CONFIG: |
        port: 7880
        bind_addresses:
          - "0.0.0.0"
        keys:
          mitchlivekit: mitch-secret-livekit-matrix-key-2026
        rtc:
          udp_port: 7882
          tcp_port: 7881
          use_external_ip: true
          turn_servers:
            - host: ${TURN_RELAY_HOST:-staticauth.openrelay.metered.ca}
              port: 443
              protocol: tls
              secret: ${TURN_RELAY_SECRET:-openrelayprojectsecret}
    ports:
      - "127.0.0.1:7880:7880"
      - "7881:7881"
      - "7882:7882/udp"

  # Dedicated Tor Browser & Onion Gateway Service
  tor-browser:
    build:
      context: ./tor-service
      dockerfile: Dockerfile
    container_name: mitch-tor-browser
    restart: unless-stopped
    cap_add:
      - NET_ADMIN
    ports:
      - "127.0.0.1:6840:6840"
    volumes:
      - ./data/tor_users:/var/lib/tor_users
    environment:
      - TOR_INTERFACE=${TOR_INTERFACE:-eth1}
      - PORT=6840

volumes:
  # Shared, tmpfs-backed named volume holding only mitchpro.db - created
  # automatically by `docker compose up`, no host-level mount command.
  # webserver-blue/green and mail-rs all mount this same volume (not
  # independent per-container tmpfs, which Compose's own `tmpfs:` option
  # would give each of them - a named volume with the tmpfs driver is what
  # actually lets multiple containers share one memory-backed filesystem).
  # sql-sync is the only thing that persists it to the HDD-backed
  # ./data/litestream-replica directory.
  sql_ramdisk:
    driver: local
    driver_opts:
      type: tmpfs
      device: tmpfs
      o: "size=4g"



