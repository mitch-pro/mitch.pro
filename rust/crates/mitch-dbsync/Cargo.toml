[package]
name = "mitch-dbsync"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "mitch-dbsync"
path = "src/main.rs"

[dependencies]
mitch-lib = { path = "../mitch-lib" }
rusqlite = { workspace = true }
reqwest = { workspace = true, features = ["blocking"] }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }
unwrap_used = "warn"
expect_used = "warn"
