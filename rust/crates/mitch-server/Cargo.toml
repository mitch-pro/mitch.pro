[package]
name = "mitch-server"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "mitch-server"
path = "src/main.rs"

[dependencies]
mitch-lib = { path = "../mitch-lib" }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
indexmap = { workspace = true }
axum = { workspace = true }
hyper = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
chrono = { workspace = true }
url = { workspace = true }
regex = "1"
form_urlencoded = "1"
# Multipart/form-data parsing for /api/dm/attachment/upload (the JS uses
# WHATWG req.formData(); multer is the same parser axum's multipart feature
# is built on).
multer = "3"
futures-util = { version = "0.3", default-features = false, features = ["std"] }
# WS-client bridges: /ssh/ws → the gateway, /livekit/rtc → the SFU, and the
# blooket-bot microservice pipe (server.js uses Bun's WebSocket client).
tokio-tungstenite = { version = "0.29", features = ["rustls-tls-webpki-roots"] }
rustls = { version = "0.23", default-features = false, features = ["ring"] }
rustls-pki-types = "1"
# /livekit JWT base64url segments (JS Buffer.toString('base64url')).
base64 = { workspace = true }
reqwest = { workspace = true }
aes-gcm = { workspace = true }
web-push = "0.10"
rand = { workspace = true }
# /api/e2e/join mints a per-session ECDH P-256 server keypair (the JS
# genServerKeypair uses WebCrypto); the SecretKey type lives in AppState.
p256 = { workspace = true }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }
unwrap_used = "warn"
expect_used = "warn"