version: '3.8'

services:
  # Development Webserver (Direct port 6800 access with hot-reloading)
  webserver:
    image: oven/bun:1.3.13-alpine
    container_name: mitch-webserver-dev
    depends_on:
      - conduit
      - livekit
    ports:
      - "6800:6800"
    environment:
      - PIA_USER
      - PIA_PASS
      - PIA_USERNAME
      - PIA_PASSWORD
      - CONDUIT_HOST=conduit
      - LIVEKIT_HOST=livekit
      - LIVEKIT_PORT=7880
      - LIVEKIT_API_KEY=mitchlivekit
      - LIVEKIT_API_SECRET=mitch-secret-livekit-matrix-key-2026
    volumes:
      - .:/app
    working_dir: /app
    command: bun --watch server.js

  # Matrix Conduit Homeserver
  conduit:
    image: matrixconduit/matrix-conduit:latest
    container_name: mitch-matrix-conduit-dev
    restart: unless-stopped
    ports:
      - "6167:6167"
    volumes:
      - ./conduit.toml:/etc/conduit.toml:ro
      - ./data/conduit:/var/lib/matrix-conduit
    environment:
      - CONDUIT_CONFIG=/etc/conduit.toml

  # LiveKit SFU for Matrix Voice & Video Calling
  livekit:
    image: livekit/livekit-server:latest
    container_name: mitch-livekit-dev
    restart: unless-stopped
    command:
      - --keys
      - "mitchlivekit: mitch-secret-livekit-matrix-key-2026"
      - --bind
      - 0.0.0.0
      - --udp-port
      - "7882"
    ports:
      - "7880:7880"
      - "7882:7882/udp"


