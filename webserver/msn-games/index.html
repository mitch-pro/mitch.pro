<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="refresh" content="0;url=https://www.msn.com/en-us/play">
  <title>Opening MSN Play — mitch.pro</title>
  <link rel="stylesheet" href="/app.css">
  <style>
    .redirect-card { width: min(26rem, 100%); margin: 18vh auto 0; padding: 1.4rem 1.5rem; background: var(--t-bg2); border: 1px solid var(--t-bd); border-radius: var(--t-radius); text-align: center; }
    .redirect-card h1 { margin: 0 0 0.4rem; font-size: 1.25rem; font-weight: 700; }
    .redirect-card p { margin: 0 0 1rem; color: var(--t-fg2); font-size: 0.9rem; }
    .redirect-card a { color: var(--t-ac); font-weight: 600; }
  </style>
</head>
<body class="app-shell">
  <main class="app-main">
    <div class="redirect-card">
      <h1>Opening MSN Play</h1>
      <p>Loading the game interface in this tab.</p>
      <a href="https://www.msn.com/en-us/play">Continue to MSN Play</a>
    </div>
  </main>
  <script>location.replace('https://www.msn.com/en-us/play');</script>
</body>
</html>
