<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Manage Friends — mitch.pro</title>
<link rel="stylesheet" href="/app.css">
<script src="/api.js"></script>
<script src="/app-shell.js" defer></script>
<script src="/sync.js"></script>
<style>
  .friends-page {
    position: relative;
    isolation: isolate;
  }

  .friends-page::before {
    content: '';
    position: fixed;
    inset: 0;
    z-index: -1;
    pointer-events: none;
    background:
      radial-gradient(ellipse 65% 45% at 50% -8%, color-mix(in srgb, var(--t-ac) 14%, transparent), transparent 70%),
      radial-gradient(ellipse 40% 35% at 100% 100%, color-mix(in srgb, var(--t-ac2, var(--t-ac)) 7%, transparent), transparent 65%);
  }

  .friends-shell {
    width: min(48rem, 100%);
    max-width: 48rem;
  }

  .page-head {
    margin-bottom: 1.15rem;
    animation: app-fade-in 0.45s ease both;
  }

  .page-title {
    margin: 0;
    font-size: clamp(1.85rem, 4vw, 2.4rem);
    font-weight: 800;
    letter-spacing: -0.035em;
    color: var(--t-fg);
  }

  .page-sub {
    margin: 0.5rem 0 0;
    font-size: 0.9rem;
    color: var(--t-fg2);
    line-height: 1.55;
  }

  .card {
    padding: 1.25rem 1.2rem;
    border: 1px solid var(--t-bd);
    border-radius: calc(var(--t-radius, 8px) + 2px);
    background:
      linear-gradient(160deg, color-mix(in srgb, var(--t-bg2) 92%, transparent), color-mix(in srgb, var(--t-bg3) 80%, transparent));
    box-shadow: 0 1px 0 color-mix(in srgb, #fff 6%, transparent) inset;
    animation: app-fade-in 0.55s ease 0.06s both;
  }

  .section-title {
    font-family: Outfit, system-ui, sans-serif;
    font-size: 1rem;
    font-weight: 750;
    color: var(--t-fg);
    margin: 0 0 0.75rem;
    display: flex;
    align-items: center;
    justify-content: space-between;
    border-bottom: 1px solid var(--t-bd);
    padding-bottom: 0.45rem;
    letter-spacing: -0.02em;
  }

  .friend-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
    gap: 0.65rem;
    margin-bottom: 0.25rem;
  }

  .friend-item {
    background: color-mix(in srgb, var(--t-bg3) 55%, transparent);
    border: 1px solid var(--t-bd);
    border-radius: var(--t-radius, 8px);
    padding: 0.75rem 0.9rem;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 0.5rem;
    transition:
      background-color var(--t-motion, 0.15s) ease,
      border-color var(--t-motion, 0.15s) ease,
      transform var(--t-motion, 0.15s) ease;
  }

  .friend-item:hover {
    background: color-mix(in srgb, var(--t-bg3) 80%, transparent);
    border-color: color-mix(in srgb, var(--t-bd) 70%, var(--t-ac) 30%);
    transform: translateY(-1px);
  }

  .friend-info {
    display: flex;
    flex-direction: column;
    min-width: 0;
    flex: 1;
  }

  .friend-email {
    font-size: 0.9rem;
    font-weight: 650;
    color: var(--t-fg);
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .friend-status {
    font-size: 0.75rem;
    margin-top: 0.2rem;
    display: flex;
    align-items: center;
    gap: 0.3rem;
    font-weight: 500;
  }

  .status-dot {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    display: inline-block;
  }

  .online .status-dot { background-color: #d8b4fe; box-shadow: 0 0 8px rgba(74, 222, 128, 0.45); }
  .online { color: #d8b4fe; }
  .offline .status-dot { background-color: color-mix(in srgb, var(--t-fg2) 55%, transparent); }
  .offline { color: var(--t-fg2); }

  .add-box {
    display: flex;
    gap: 0.5rem;
    margin-bottom: 1.5rem;
  }

  .add-input {
    flex: 1;
    background: var(--t-bg2);
    border: 1px solid var(--t-bd);
    border-radius: var(--t-radius, 8px);
    padding: 0.65rem 0.9rem;
    color: var(--t-fg);
    font-size: 0.9rem;
    font-family: inherit;
    outline: none;
    transition:
      border-color var(--t-motion, 0.15s) ease,
      box-shadow var(--t-motion, 0.15s) ease;
  }

  .add-input:focus {
    border-color: var(--t-ac);
    box-shadow: 0 0 0 3px var(--t-gls, transparent);
  }

  .btn {
    appearance: none;
    padding: 0.65rem 1.15rem;
    border-radius: var(--t-radius, 8px);
    border: 1px solid transparent;
    font-size: 0.88rem;
    font-weight: 650;
    font-family: inherit;
    cursor: pointer;
    transition:
      background-color var(--t-motion, 0.15s) ease,
      box-shadow var(--t-motion, 0.15s) ease,
      transform 0.12s ease;
  }

  .btn:active { transform: scale(0.97); }

  .btn-primary {
    background: color-mix(in srgb, var(--t-ac) 88%, #000 12%);
    color: #fff;
    border-color: var(--t-bda, transparent);
  }

  .btn-primary:hover { background: var(--t-ac); box-shadow: 0 0 0 3px var(--t-gls, transparent); }
  .btn-primary:disabled { opacity: 0.5; cursor: not-allowed; transform: none; box-shadow: none; }

  .btn-action {
    padding: 0.3rem 0.65rem;
    font-size: 0.76rem;
    border-radius: calc(var(--t-radius, 8px) - 2px);
    border: none;
    font-weight: 700;
    font-family: inherit;
    cursor: pointer;
  }

  .btn-accept { background: #a855f7; color: white; }
  .btn-accept:hover { background: #16a34a; }
  .btn-deny { background: #ef4444; color: white; margin-left: 0.25rem; }
  .btn-deny:hover { background: #dc2626; }

  .btn-remove {
    background: transparent;
    border: none;
    color: #ef4444;
    font-size: 1rem;
    cursor: pointer;
    opacity: 0.45;
    padding: 0.25rem;
    transition: opacity var(--t-motion, 0.15s) ease, transform var(--t-motion, 0.15s) ease;
  }

  .btn-remove:hover { opacity: 1; transform: scale(1.1); }

  .requests-section {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
    gap: 1.1rem;
    margin-bottom: 1.5rem;
  }

  .request-list {
    background: color-mix(in srgb, var(--t-bg3) 40%, transparent);
    border: 1px solid var(--t-bd);
    border-radius: var(--t-radius, 8px);
    padding: 0.7rem;
    min-height: 5rem;
  }

  .request-item {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0.55rem 0.7rem;
    background: color-mix(in srgb, var(--t-bg2) 70%, transparent);
    border: 1px solid color-mix(in srgb, var(--t-bd) 80%, transparent);
    border-radius: calc(var(--t-radius, 8px) - 2px);
    margin-bottom: 0.4rem;
    font-size: 0.85rem;
    gap: 0.5rem;
  }

  .request-item:last-child { margin-bottom: 0; }

  .empty-state {
    color: var(--t-fg2);
    font-size: 0.82rem;
    text-align: center;
    padding: 1rem 0;
  }

  #autocomplete-list {
    position: absolute;
    top: 100%;
    left: 0;
    right: 0;
    background: var(--t-bg2);
    border: 1px solid var(--t-bd);
    border-radius: var(--t-radius, 8px);
    margin-top: 0.25rem;
    max-height: 200px;
    overflow-y: auto;
    z-index: 1000;
    display: none;
    box-shadow: 0 14px 36px rgba(0, 0, 0, 0.35);
  }

  .autocomplete-item {
    padding: 0.65rem 0.85rem;
    cursor: pointer;
    font-size: 0.85rem;
    border-bottom: 1px solid color-mix(in srgb, var(--t-bd) 70%, transparent);
    transition: background var(--t-motion, 0.15s) ease;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 0.5rem;
  }

  .autocomplete-item:last-child { border-bottom: none; }
  .autocomplete-item:hover { background: color-mix(in srgb, var(--t-ac) 12%, transparent); }
  .autocomplete-item .item-name { font-weight: 650; color: var(--t-fg); }
  .autocomplete-item .item-email { font-size: 0.75rem; color: var(--t-fg2); }

  @media (max-width: 640px) {
    .friend-grid, .requests-section { grid-template-columns: 1fr; }
    .add-box > div:first-child { flex-direction: column; }
    .btn, .add-input { width: 100%; min-height: 44px; }
  }

  @media (prefers-reduced-motion: reduce) {
    .page-head, .card { animation: none !important; }
    .friend-item, .btn, .btn-remove, .add-input, .autocomplete-item { transition: none !important; }
  }

  .theme-no-motion .page-head,
  .theme-no-motion .card,
  .theme-no-motion .friend-item,
  .theme-no-motion .btn {
    animation: none !important;
    transition: none !important;
  }

  .friends-shell { width: min(70rem, 100%); max-width: 70rem; }
  .friends-page .page-head { display: flex; align-items: end; justify-content: space-between; gap: 1rem; }
  .friends-summary { display: flex; gap: .55rem; flex-wrap: wrap; }
  .friends-summary span { min-width: 84px; padding: .5rem .75rem; border: 1px solid var(--t-bd); border-radius: 12px; background: color-mix(in srgb, var(--t-bg2) 88%, transparent); color: var(--t-fg2); font-size: .75rem; font-weight: 700; }
  .friends-summary b { display: block; color: var(--t-fg); font-size: 1.05rem; line-height: 1; margin-bottom: .2rem; }
  .friends-hub { padding: 1rem; }
  .friend-search-label { display: flex; align-items: center; justify-content: space-between; gap: 1rem; margin-bottom: .65rem; }
  .friend-search-label .section-title { border: 0; padding: 0; margin: 0; }
  .friend-search-label small { color: var(--t-fg2); font-size: .75rem; }
  .requests-section { margin: 1rem 0 1.25rem; gap: .75rem; }
  .requests-section > div { padding: .8rem; border: 1px solid var(--t-bd); border-radius: 14px; background: color-mix(in srgb, var(--t-bg3) 42%, transparent); }
  .requests-section .section-title { border: 0; padding: 0; margin-bottom: .55rem; font-size: .86rem; }
  .request-list { padding: 0; border: 0; background: transparent; min-height: 3.5rem; }
  .request-item { min-height: 52px; margin-bottom: .45rem; padding: .55rem; }
  .friend-grid { grid-template-columns: repeat(auto-fill, minmax(145px, 1fr)); gap: .75rem; }
  .friend-item { position: relative; min-height: 218px; padding: .8rem; display: grid; grid-template-columns: 1fr auto; grid-template-rows: auto 1fr auto; align-items: start; gap: .55rem; background: color-mix(in srgb, var(--t-bg2) 86%, transparent); border-radius: 16px; overflow: hidden; }
  .friend-item:hover { transform: translateY(-2px); border-color: color-mix(in srgb, var(--t-ac) 55%, var(--t-bd)); }
  .friend-avatar { grid-column: 1 / -1; position: relative; width: 100%; aspect-ratio: 1.55; display: grid; place-items: center; overflow: hidden; border-radius: 12px; background: linear-gradient(145deg, color-mix(in srgb, var(--t-ac) 22%, var(--t-bg3)), var(--t-bg3)); color: var(--t-fg); font-size: 2rem; font-weight: 800; }
  .friend-avatar img { width: 100%; height: 100%; object-fit: cover; }
  .friend-avatar .avatar-fallback { display: grid; place-items: center; position: absolute; inset: 0; }
  .friend-avatar img + .avatar-fallback { display: none; }
  .friend-avatar img.is-broken { display: none; }
  .friend-avatar img.is-broken + .avatar-fallback { display: grid; }
  .friend-info { gap: .05rem; }
  .friend-name { color: var(--t-fg); font-size: .92rem; font-weight: 800; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .friend-email { color: var(--t-fg2); font-size: .72rem; font-weight: 550; }
  .friend-status { font-size: .72rem; }
  .friend-actions { grid-column: 1 / -1; display: grid; grid-template-columns: 1fr 34px; gap: .45rem; }
  .friend-message { min-height: 34px; display: grid; place-items: center; color: var(--t-bg); background: var(--t-ac); border-radius: 9px; }
  .friend-message:hover { color: var(--t-bg); filter: brightness(1.08); }
  .btn-remove { width: 34px; min-height: 34px; border: 1px solid var(--t-bd); border-radius: 9px; color: var(--t-fg2); opacity: 1; }
  .btn-remove:hover { color: #fff; background: #dc2626; border-color: #dc2626; transform: none; }
  .online .status-dot { background: #22c55e; box-shadow: 0 0 8px rgba(34,197,94,.45); }
  .online { color: #4ade80; }

  @media (min-width: 761px) and (max-height: 800px) {
    .friends-page .app-main { padding-top: .85rem !important; }
    .friends-page .page-head { margin-bottom: .7rem; }
    .friends-page .page-title { font-size: 1.65rem !important; }
    .friends-page .page-sub { margin-top: .2rem; }
    .friends-hub { padding: .8rem; }
    .add-box { margin-bottom: 1rem !important; }
    #addStatusMsg { margin-top: -.65rem !important; margin-bottom: .75rem !important; }
    .requests-section { margin: .7rem 0 1rem; }
    .friend-grid { grid-template-columns: repeat(auto-fill, minmax(132px, 1fr)); }
    .friend-item { min-height: 195px; }
  }
  @media (max-width: 640px) {
    .friends-page .page-head { align-items: start; flex-direction: column; }
    .friends-summary { width: 100%; }
    .friends-summary span { flex: 1; }
    .friend-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .friend-item { min-height: 205px; }
    .friend-search-label small { display: none; }
  }
  @media (max-width: 380px) { .friend-grid { grid-template-columns: 1fr; } }
</style>
</head>
<body class="friends-page">
<main class="app-main friends-shell">
  <header class="page-head">
    <div>
      <h1 class="page-title">Friends</h1>
      <p class="page-sub">Find people, see who is playing, and jump into chat.</p>
    </div>
    <div class="friends-summary" aria-label="Friend activity">
      <span><b id="friendCount">0</b>Friends</span>
      <span><b id="onlineCount">0</b>Online</span>
    </div>
  </header>

  <div class="card friends-hub">
    <div class="friend-search-label"><div class="section-title"><span>Add Friend</span></div><small>Search by display name or school email</small></div>
    <div class="add-box" style="position: relative; flex-direction: column; gap: 0; margin-bottom: 2rem;">
      <div style="display: flex; gap: 0.5rem; width: 100%;">
        <input type="text" id="friendEmailInput" class="add-input" placeholder="Type display name or email to search..." autocomplete="off" oninput="onSearchInput()" />
        <button id="friendSubmitBtn" class="btn btn-primary" onclick="sendRequest()">Add Friend</button>
      </div>
      <div id="autocomplete-list"></div>
    </div>
    <div id="addStatusMsg" style="font-size: 0.85rem; margin-top: -1.5rem; margin-bottom: 1.5rem; display: none; font-weight: 600;"></div>

    <div class="requests-section">
      <div>
        <div class="section-title"><span>Incoming Requests</span></div>
        <div id="incomingList" class="request-list">
          <div class="empty-state">No incoming requests</div>
        </div>
      </div>
      <div>
        <div class="section-title"><span>Outgoing Requests</span></div>
        <div id="outgoingList" class="request-list">
          <div class="empty-state">No outgoing requests</div>
        </div>
      </div>
    </div>

    <div class="section-title"><span>Connections</span></div>
    <div id="friendsGrid" class="friend-grid">
      <div class="empty-state" style="grid-column: 1/-1;">No friends added yet</div>
    </div>
  </div>
</main>

<script>
let allMembers = [];

function escText(t) {
  if (!t) return '';
  return String(t)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#039;');
}

function safeFriendImage(value) {
  const raw = String(value || '').trim();
  if (/^\/(?![\/\\])/.test(raw)) return raw;
  if (/^https?:\/\//i.test(raw)) return raw;
  if (/^data:image\/(?:png|jpe?g|webp|gif);base64,[a-z0-9+/=]+$/i.test(raw) && raw.length <= 140000) return raw;
  return '';
}

function friendInitials(value) {
  return (String(value || '?').trim().split(/[\s._-]+/).slice(0, 2).map(function(part) {
    return part.charAt(0);
  }).join('') || '?').toUpperCase();
}

async function fetchAllMembers() {
  try {
    const r = await fetch('/api/members?t=' + Date.now(), { credentials: 'include' });
    if (r.ok) {
      const d = await r.json();
      allMembers = d.members || [];
    }
  } catch(e) {}
}

function onSearchInput() {
  const input = document.getElementById('friendEmailInput');
  const listEl = document.getElementById('autocomplete-list');
  if (!input || !listEl) return;
  const q = input.value.trim().toLowerCase();
  if (!q) {
    listEl.style.display = 'none';
    return;
  }

  // De-duplicate members, preferring those with display names
  const sortedMembers = [...allMembers].sort((a, b) => {
    const hasA = !!a.displayName;
    const hasB = !!b.displayName;
    if (hasA && !hasB) return -1;
    if (!hasA && hasB) return 1;
    return 0;
  });

  const matches = [];
  const seenEmails = new Set();

  for (const m of sortedMembers) {
    const email = (m.email || '').toLowerCase();
    const name = (m.displayName || '').toLowerCase();
    
    if (seenEmails.has(email)) continue;

    let score = 0;
    
    // exact matches / startsWith get priority
    if (name === q || email === q) {
      score += 1000;
    } else if (name.startsWith(q) || email.startsWith(q)) {
      score += 500;
    } else if (name.includes(q)) {
      score += 200;
    } else if (email.includes(q)) {
      score += 100;
    }
    
    if (score > 0) {
      matches.push({ member: m, score });
      seenEmails.add(email);
    }
  }

  // Sort by score descending
  matches.sort((a, b) => b.score - a.score);

  if (matches.length === 0) {
    listEl.style.display = 'none';
    return;
  }

  listEl.style.display = 'block';
  listEl.innerHTML = matches.slice(0, 6).map(item => {
    const m = item.member;
    const nameStr = escText(m.displayName || m.email || 'member');
    const emailStr = escText(m.email);
    // Click calls selectMember with the target identifier (m.email)
    return `
      <div class="autocomplete-item" onclick="selectMember('${escText(m.email)}')">
        <span class="item-name">${nameStr}</span>
        <span class="item-email">${emailStr}</span>
      </div>
    `;
  }).join('');
}

function selectMember(email) {
  const input = document.getElementById('friendEmailInput');
  const listEl = document.getElementById('autocomplete-list');
  if (input) input.value = email;
  if (listEl) listEl.style.display = 'none';
}

// Close list on clicking outside
document.addEventListener('click', function(e) {
  const listEl = document.getElementById('autocomplete-list');
  const input = document.getElementById('friendEmailInput');
  if (listEl && e.target !== input && !listEl.contains(e.target)) {
    listEl.style.display = 'none';
  }
});

async function loadFriends() {
  const grid = document.getElementById('friendsGrid');
  try {
    const r = await fetch('/api/friends/list?t=' + Date.now(), { credentials: 'include' });
    if (!r.ok) {
      grid.innerHTML = '<div class="empty-state">Please sign in to view friends</div>';
      return;
    }
    const d = await r.json();
    const list = d.friends || [];
    document.getElementById('friendCount').textContent = String(list.length);
    document.getElementById('onlineCount').textContent = String(list.filter(function(friend) { return friend.online; }).length);
    if (list.length === 0) {
      grid.innerHTML = '<div class="empty-state" style="grid-column: 1/-1;">No friends added yet. Search a member above to add someone!</div>';
      return;
    }
    grid.innerHTML = list.map(f => {
      const email = f.email;
      const masked = f.handle ? '@' + f.handle : f.maskedEmail;
      const name = f.displayName || f.handle || f.maskedEmail;
      const pfp = safeFriendImage(f.pfp);
      const profileUrl = f.profileUrl || '/profile/?u=' + encodeURIComponent(f.handle || email);
      const isOnline = f.online;
      const playing = f.playing ? ` (playing ${f.playing})` : '';
      
      const statusClass = isOnline ? 'online' : 'offline';
      const statusText = isOnline ? `Online${playing}` : 'Offline';
      
      return `
        <article class="friend-item">
          <a class="friend-avatar" href="${escText(profileUrl)}">${pfp ? `<img src="${escText(pfp)}" alt="" loading="lazy" decoding="async" onerror="this.classList.add('is-broken')"><span class="avatar-fallback">${escText(friendInitials(name))}</span>` : `<span class="avatar-fallback">${escText(friendInitials(name))}</span>`}</a>
          <div class="friend-info">
            <a class="friend-name" href="${escText(profileUrl)}">${escText(name)}</a>
            <span class="friend-email">${escText(masked)}</span>
            <span class="friend-status ${statusClass}">
              <span class="status-dot"></span>
              ${escText(statusText)}
            </span>
          </div>
          <div class="friend-actions">
            <a class="btn-action friend-message" href="/matrix/">Chat</a>
            <button onclick="removeFriend('${escText(email)}')" class="btn-remove" title="Remove friend" aria-label="Remove ${escText(name)}">&times;</button>
          </div>
        </article>
      `;
    }).join('');
  } catch(e) {
    grid.innerHTML = '<div class="empty-state">Error loading friends list</div>';
  }
}

async function loadPending() {
  const incList = document.getElementById('incomingList');
  const outList = document.getElementById('outgoingList');
  try {
    const r = await fetch('/api/friends/requests/pending?t=' + Date.now(), { credentials: 'include' });
    if (!r.ok) return;
    const d = await r.json();
    
    const incoming = d.incoming || [];
    const outgoing = d.outgoing || [];
    
    if (incoming.length === 0) {
      incList.innerHTML = '<div class="empty-state">No incoming requests</div>';
    } else {
      incList.innerHTML = incoming.map(req => `
        <div class="request-item">
          <span style="font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1; margin-right: 10px;">${escText(req.maskedFrom)}</span>
          <div style="shrink: 0;">
            <button onclick="respond('${escText(req.from)}', 'accept')" class="btn-action btn-accept">Accept</button>
            <button onclick="respond('${escText(req.from)}', 'reject')" class="btn-action btn-deny">Reject</button>
          </div>
        </div>
      `).join('');
    }
    
    if (outgoing.length === 0) {
      outList.innerHTML = '<div class="empty-state">No outgoing requests</div>';
    } else {
      outList.innerHTML = outgoing.map(req => `
        <div class="request-item">
          <span style="color: var(--t-fg2); opacity: 0.8; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1; margin-right: 10px;">${escText(req.maskedTo)}</span>
          <button onclick="cancelRequest('${escText(req.to)}')" class="btn-action btn-deny" style="shrink: 0;">Cancel</button>
        </div>
      `).join('');
    }
  } catch(e) {}
}

async function getFriendsCaptchaToken(action) {
  for (let i = 0; i < 50; i++) {
    if (window.getCaptchaToken && window.grecaptcha) break;
    await new Promise(r => setTimeout(r, 100));
  }
  if (window.getCaptchaToken) {
    return await window.getCaptchaToken(action) || '';
  }
  return '';
}

async function sendRequest() {
  const input = document.getElementById('friendEmailInput');
  const btn = document.getElementById('friendSubmitBtn');
  const msg = document.getElementById('addStatusMsg');
  const email = input.value.trim();
  if (!email) return;
  
  btn.disabled = true;
  msg.style.display = 'block';
  msg.style.color = 'var(--t-ac, #3b82f6)';
  msg.innerText = 'Sending request...';
  
  const recaptcha_token = await getFriendsCaptchaToken('friend_request');
  try {
    const r = await fetch('/api/friends/request', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ email, recaptcha_token })
    });
    const d = await r.json();
    if (r.ok) {
      msg.style.color = '#d8b4fe';
      msg.innerText = d.status === 'accepted' ? 'Friend request accepted (already mutual)!' : 'Friend request sent!';
      input.value = '';
      loadFriends();
      loadPending();
    } else {
      msg.style.color = '#ef4444';
      msg.innerText = d.error || 'Failed to send request';
    }
  } catch(e) {
    msg.style.color = '#ef4444';
    msg.innerText = 'Connection error';
  } finally {
    btn.disabled = false;
    setTimeout(() => { msg.style.display = 'none'; }, 6000);
  }
}

async function respond(friendEmail, action) {
  try {
    const r = await fetch('/api/friends/request/respond', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ email: friendEmail, action })
    });
    if (r.ok) {
      loadFriends();
      loadPending();
    }
  } catch(e) {}
}

async function cancelRequest(friendEmail) {
  try {
    const r = await fetch('/api/friends/request/cancel', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ email: friendEmail })
    });
    if (r.ok) {
      loadFriends();
      loadPending();
    }
  } catch(e) {}
}

async function removeFriend(friendEmail) {
  if (!(await customConfirm('Remove Friend', 'Are you sure you want to remove this friend?'))) return;
  try {
    const r = await fetch('/api/friends/remove', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ email: friendEmail })
    });
    if (r.ok) {
      loadFriends();
      loadPending();
    }
  } catch(e) {}
}

// Heartbeat reporting
async function sendHeartbeat() {
  try {
    await fetch('/api/presence/heartbeat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ playing: 'Friends Manager' })
    });
  } catch(e) {}
}

function init() {
  loadFriends();
  loadPending();
  fetchAllMembers();
  sendHeartbeat();
  
  setInterval(loadFriends, 15000);
  setInterval(loadPending, 15000);
  setInterval(sendHeartbeat, 30000);
  
  document.getElementById('friendEmailInput').onkeydown = function(e) {
    if (e.key === 'Enter') sendRequest();
  };
}

document.addEventListener('DOMContentLoaded', init, { once: true });
</script>
