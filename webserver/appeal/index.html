<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Appeal a ban — mitch.pro</title>
<link rel="canonical" href="https://mitchdog.com/appeal/">
<style>
:root{color-scheme:light;font-family:Arial,Helvetica,sans-serif;color:#24262a;background:#f2f3f5}
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:flex;flex-direction:column}
header{padding:19px 28px;background:#fff;border-bottom:1px solid #d8dadd;font-size:21px;font-weight:800;letter-spacing:-.7px}
main{width:min(620px,calc(100% - 32px));margin:48px auto;flex:1}
.panel{background:#fff;border:1px solid #d4d6d9;border-radius:4px;padding:32px}
h1{font-size:30px;margin:0 0 18px;letter-spacing:-.6px}p{font-size:15px;line-height:1.6;color:#555960}
label{display:block;font-size:14px;font-weight:700;margin:24px 0 8px}
input,textarea{display:block;width:100%;padding:12px;font-family:inherit;font-size:15px;line-height:1.5;color:#24262a;background:#fafafb;border:1px solid #bfc2c7;border-radius:4px}
textarea{resize:vertical;min-height:150px}button{margin-top:22px;min-height:44px;padding:11px 22px;border:1px solid #303238;border-radius:5px;background:#303238;color:white;font:700 14px Arial,sans-serif;cursor:pointer}
button:hover{background:#45484e}button:disabled{opacity:.6;cursor:wait}
:is(input,textarea,button,a):focus-visible{outline:3px solid #3276d2;outline-offset:3px}
#message{font-size:14px;overflow-wrap:anywhere}#message:empty{display:none}#message[data-error=true]{color:#a62536}
.back{display:inline-block;margin-top:24px;color:#555960;font-size:14px}
@media(max-width:520px){header{padding-inline:20px}main{margin:28px auto}.panel{padding:24px 20px}}
</style>
</head>
<body data-presentation="account-notice">
<header>mitch.pro</header>
<main><section class="panel" aria-labelledby="appeal-title">
<h1 id="appeal-title">Appeal a ban</h1>
<p>Explain why you think your ban should be reviewed. Staff will review your appeal before making a decision.</p>
<form id="appeal-form">
<label for="email">Account email</label><input id="email" name="email" type="email" maxlength="254" autocomplete="email" required>
<label for="reason">Your appeal</label><textarea id="reason" name="reason" maxlength="2000" required></textarea>
<button type="submit" id="submit-appeal">Submit appeal</button>
<p id="message" role="status"></p>
</form>
<a class="back" href="/">Back to account status</a>
</section></main>
<script>
document.getElementById('appeal-form').addEventListener('submit',async event=>{
  event.preventDefault();
  const email=document.getElementById('email').value.trim(),reason=document.getElementById('reason').value.trim();
  const button=document.getElementById('submit-appeal'),message=document.getElementById('message');
  if(!reason){message.textContent='Please explain why your ban should be reviewed.';message.dataset.error='true';return;}
  button.disabled=true;message.textContent='Submitting…';message.dataset.error='false';
  try{
    const recaptcha_token=window.getCaptchaToken?await window.getCaptchaToken('submit_appeal') || '':'';
    const response=await fetch('/api/appeal',{method:'POST',headers:{'Content-Type':'application/json','X-Mitch-Requested-With':'1'},body:JSON.stringify({email,reason,recaptcha_token})});
    const data=await response.json();
    if(!response.ok)throw new Error(data.error || 'Could not submit your appeal. Please try again.');
    message.textContent='Your appeal has been submitted for staff review.';
    button.textContent='Appeal submitted';
  }catch(error){message.textContent=error.message;message.dataset.error='true';button.disabled=false;}
});
</script>
</body>
</html>
