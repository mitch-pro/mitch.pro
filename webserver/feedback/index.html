<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Feedback — mitch.pro</title>
<link rel="stylesheet" href="/app.css">
<script src="/api.js"></script>
<script src="/app-shell.js" defer></script>
<style>
  .feedback-shell { max-width: 40rem; }
  h1 { margin: 0 0 1rem; font-size: 1.75rem; font-weight: 700; letter-spacing: -0.03em; color: var(--t-fg); }
  .panel {
    border: 1px solid var(--t-bd);
    border-radius: var(--t-radius);
    background: var(--t-bg2);
    padding: 1.25rem 1.2rem;
  }

  .field { margin-bottom: 1rem; }

  label {
    display: flex;
    justify-content: space-between;
    gap: 0.65rem;
    color: var(--t-fg2);
    font-size: 0.78rem;
    font-weight: 600;
    letter-spacing: 0.01em;
    margin-bottom: 0.4rem;
  }

  label span {
    color: color-mix(in srgb, var(--t-fg2) 80%, transparent);
    font-weight: 500;
  }

  .chips {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 0.45rem;
  }

  .chip {
    min-height: 2.55rem;
    border-radius: var(--t-radius);
    border: 1px solid var(--t-bd);
    background: var(--t-bg3);
    color: var(--t-fg2);
    font-family: inherit;
    font-size: 0.84rem;
    font-weight: 700;
    cursor: pointer;
    transition:
      border-color var(--t-motion, 0.15s) ease,
      background var(--t-motion, 0.15s) ease,
      color var(--t-motion, 0.15s) ease;
  }

  .chip:hover {
    border-color: color-mix(in srgb, var(--t-bd) 70%, var(--t-ac) 30%);
    color: var(--t-fg);
  }

  .chip.active {
    background: color-mix(in srgb, var(--t-ac) 14%, transparent);
    border-color: color-mix(in srgb, var(--t-ac) 55%, var(--t-bd));
    color: var(--t-fg);
  }

  textarea,
  input {
    width: 100%;
    background: var(--t-bg2);
    color: var(--t-fg);
    border: 1px solid var(--t-bd);
    border-radius: var(--t-radius);
    padding: 0.7rem 0.85rem;
    font-family: inherit;
    font-size: 0.92rem;
    outline: none;
    transition:
      border-color var(--t-motion, 0.15s) ease,
      box-shadow var(--t-motion, 0.15s) ease;
  }

  textarea {
    min-height: 11rem;
    resize: vertical;
    line-height: 1.55;
  }

  textarea:focus,
  input:focus {
    border-color: var(--t-ac);
    box-shadow: 0 0 0 3px var(--t-gls, transparent);
  }

  .row {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 0.75rem;
  }

  .actions {
    display: flex;
    align-items: center;
    gap: 0.75rem;
    margin-top: 0.85rem;
    flex-wrap: wrap;
  }

  #submitBtn {
    min-height: 2.5rem;
    border-radius: var(--t-radius);
    border: 1px solid var(--t-bda, transparent);
    background: var(--t-ac);
    color: var(--t-ac-ink);
    padding: 0 1.15rem;
    font-family: inherit;
    font-weight: 700;
    font-size: 0.9rem;
    cursor: pointer;
    transition:
      background var(--t-motion, 0.15s) ease,
      box-shadow var(--t-motion, 0.15s) ease,
      transform 0.12s ease;
  }

  #submitBtn:hover {
    background: var(--t-ac);
    box-shadow: 0 0 0 3px var(--t-gls, transparent);
  }

  #submitBtn:active { transform: scale(0.97); }
  #submitBtn:disabled { opacity: 0.5; cursor: default; transform: none; box-shadow: none; }

  #status {
    color: var(--t-fg2);
    font-size: 0.82rem;
    min-height: 1.3em;
  }

  #status.ok { color: var(--t-ac); }
  #status.err { color: #f87171; }
  html.theme-light #status.err { color: #b91c1c; }

  .recaptcha-wrap { margin-top: 0.75rem; transform-origin: left top; }

  @media (max-width: 860px) {
    .row, .chips { grid-template-columns: 1fr; }
  }

  @media (prefers-reduced-motion: reduce) {
    .chip, #submitBtn { transition: none !important; }
  }

    .theme-no-motion .chip,
  .theme-no-motion #submitBtn {
    animation: none !important;
    transition: none !important;
  }
</style>
</head>
<body class="app-shell">
<main class="app-main feedback-shell">
  <h1>Feedback</h1>
    <section class="panel">
      <form id="feedbackForm">
        <div class="field">
          <label id="typeLabel">Type</label>
          <div class="chips" id="typeChips" role="group" aria-labelledby="typeLabel">
            <button class="chip active" type="button" aria-pressed="true" data-type="feedback">General feedback</button>
            <button class="chip" type="button" aria-pressed="false" data-type="broken_game">Something is broken</button>
            <button class="chip" type="button" aria-pressed="false" data-type="add_page">Add a page/game</button>
            <button class="chip" type="button" aria-pressed="false" data-type="general">Other idea</button>
          </div>
        </div>

        <div class="row">
          <div class="field">
            <label for="pageField">Page <span>optional</span></label>
            <input id="pageField" placeholder="/matrix/ or homepage">
          </div>
          <div class="field">
            <label for="moodField">Mood <span>optional</span></label>
            <input id="moodField" placeholder="bug, idea, urgent, nice">
          </div>
        </div>

        <div class="field">
          <label for="site">Message <span id="count">0 / 2000</span></label>
          <textarea id="site" maxlength="2000" placeholder="What should we fix or build? Add details like device, browser, page, and what you expected."></textarea>
        </div>

        <div class="actions">
          <button id="submitBtn" type="submit">Send feedback</button>
          <div id="status" role="status" aria-live="polite"></div>
        </div>
      </form>
    </section>
</main>

<script>
var selectedType = 'feedback';
var _SUG_LIMIT = 3, _SUG_WIN = 60000;

function _sugAttempts() {
  var m = {};
  document.cookie.split(';').forEach(function(c) {
    var p = c.trim().split('=');
    if (p.length >= 2) m[p[0]] = p[1];
  });
  return (m['_sug_rl'] || '').split(',').map(Number).filter(Boolean);
}
function _saveSugAttempts(arr) {
  document.cookie = '_sug_rl=' + arr.join(',') + ';expires=' + new Date(Date.now() + _SUG_WIN).toUTCString() + ';path=/';
}
function _sugSpam() {
  var now = Date.now();
  var arr = _sugAttempts().filter(function(t) { return now - t < _SUG_WIN; });
  arr.push(now);
  _saveSugAttempts(arr);
  return arr.length > _SUG_LIMIT;
}
function setStatus(text, cls) {
  var status = document.getElementById('status');
  status.textContent = text || '';
  status.className = cls || '';
}
function studentId() {
  return new URLSearchParams(document.cookie.replaceAll('; ', '&')).get('id')
    || new URLSearchParams(document.cookie.replaceAll('; ', '&')).get('studentId')
    || '';
}
document.querySelectorAll('.chip').forEach(function(btn) {
  btn.addEventListener('click', function() {
    selectedType = btn.dataset.type;
    document.querySelectorAll('.chip').forEach(function(b) { b.classList.toggle('active', b === btn); b.setAttribute('aria-pressed', b === btn ? 'true' : 'false'); });
  });
});
document.getElementById('site').addEventListener('input', function() {
  document.getElementById('count').textContent = this.value.length + ' / 2000';
});
document.getElementById('feedbackForm').addEventListener('submit', submitSite);

async function submitSite(e) {
  e.preventDefault();
  var text = document.getElementById('site').value.trim();
  var page = document.getElementById('pageField').value.trim();
  var mood = document.getElementById('moodField').value.trim();
  if (!text) { setStatus('Write a little feedback first.', 'err'); document.getElementById('site').focus(); return; }
  if (_sugSpam()) return setStatus('Slow down a little before sending more.', 'err');
  var btn = document.getElementById('submitBtn');
  btn.disabled = true;
  btn.textContent = 'Sending…';
  setStatus('', '');
  var details = text;
  if (page) details += '\n\nPage: ' + page;
  if (mood) details += '\nMood: ' + mood;

  var recaptcha_token = '';
  if (window.getCaptchaToken) {
    recaptcha_token = await window.getCaptchaToken('feedback') || '';
  }

  try {
    var resp = await fetch('/api/suggest', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({
        id: studentId(),
        type: selectedType,
        text: details,
        recaptcha_token: recaptcha_token
      })
    });
    var r = await resp.json().catch(function() { return {}; });
    if (r.success) {
      setStatus('Submitted. Thank you.', 'ok');
      document.getElementById('site').value = '';
      document.getElementById('pageField').value = '';
      document.getElementById('moodField').value = '';
      document.getElementById('count').textContent = '0 / 2000';
    } else {
      setStatus(r.message || (resp.status === 429 ? 'Too many submissions. Wait a minute and try again.' : 'Could not send feedback. Your message is still here; try again.'), 'err');
    }
  } catch (err) {
    setStatus('Could not reach the server. Your message is still here; try again.', 'err');
  }
  btn.disabled = false;
  btn.textContent = 'Send feedback';
}
</script>
<script src="/cookie-consent.js" defer></script>
</body>
</html>
