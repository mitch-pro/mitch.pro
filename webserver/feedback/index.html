<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Feedback — mitch.pro</title>
<link rel="stylesheet" href="/app.css">
<script src="/api.js"></script>
<script src="/app-shell.js" defer></script>
<style>
  .feedback-shell { max-width: 40rem; }
  h1 { margin: 0 0 1rem; font-size: 1.75rem; font-weight: 700; letter-spacing: -0.03em; color: var(--t-fg); }
  .panel {
    border: 1px solid var(--t-bd);
    border-radius: var(--t-radius);
    background: var(--t-bg2);
    padding: 1.25rem 1.2rem;
  }

  .field { margin-bottom: 1rem; }

  label {
    display: flex;
    justify-content: space-between;
    gap: 0.65rem;
    color: var(--t-fg2);
    font-size: 0.78rem;
    font-weight: 600;
    letter-spacing: 0.01em;
    margin-bottom: 0.4rem;
  }

  label span {
    color: color-mix(in srgb, var(--t-fg2) 80%, transparent);
    font-weight: 500;
  }

  .chips {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 0.45rem;
  }

  .chip {
    min-height: 2.55rem;
    border-radius: var(--t-radius);
    border: 1px solid var(--t-bd);
    background: var(--t-bg3);
    color: var(--t-fg2);
    font-family: inherit;
    font-size: 0.84rem;
    font-weight: 700;
    cursor: pointer;
    transition:
      border-color var(--t-motion, 0.15s) ease,
      background var(--t-motion, 0.15s) ease,
      color var(--t-motion, 0.15s) ease;
  }

  .chip:hover {
    border-color: color-mix(in srgb, var(--t-bd) 70%, var(--t-ac) 30%);
    color: var(--t-fg);
  }

  .chip.active {
    background: color-mix(in srgb, var(--t-ac) 14%, transparent);
    border-color: color-mix(in srgb, var(--t-ac) 55%, var(--t-bd));
    color: var(--t-fg);
  }

  textarea,
  input {
    width: 100%;
    background: var(--t-bg2);
    color: var(--t-fg);
    border: 1px solid var(--t-bd);
    border-radius: var(--t-radius);
    padding: 0.7rem 0.85rem;
    font-family: inherit;
    font-size: 0.92rem;
    outline: none;
    transition:
      border-color var(--t-motion, 0.15s) ease,
      box-shadow var(--t-motion, 0.15s) ease;
  }

  textarea {
    min-height: 11rem;
    resize: vertical;
    line-height: 1.55;
  }

  textarea:focus,
  input:focus {
    border-color: var(--t-ac);
    box-shadow: 0 0 0 3px var(--t-gls, transparent);
  }

  .tabs { display: flex; gap: 0.4rem; margin-bottom: 1rem; border-bottom: 1px solid var(--t-bd); }
  .tab {
    appearance: none; background: none; border: 0; border-bottom: 2px solid transparent;
    margin-bottom: -1px; padding: 0.55rem 0.9rem; font: inherit; font-size: 0.9rem; font-weight: 700;
    color: var(--t-fg2); cursor: pointer;
  }
  .tab:hover { color: var(--t-fg); }
  .tab[aria-selected="true"] { color: var(--t-fg); border-bottom-color: var(--t-ac); }
  .tab:focus-visible { outline: 2px solid var(--t-ac); outline-offset: 2px; }
  .intro { margin: 0 0 1rem; color: var(--t-fg2); font-size: 0.88rem; line-height: 1.55; }
  select { width: 100%; background: var(--t-bg2); color: var(--t-fg); border: 1px solid var(--t-bd); border-radius: var(--t-radius); padding: 0.7rem 0.85rem; font-family: inherit; font-size: 0.92rem; }
  textarea.short { min-height: 5rem; }
  textarea.mid { min-height: 7rem; }
  .success-state { display: none; text-align: center; padding: 1rem 0; }
  .success-state h2 { margin: 0 0 0.4rem; font-size: 1.2rem; }
  .success-state p { margin: 0; color: var(--t-fg2); font-size: 0.88rem; }

  .actions {
    display: flex;
    align-items: center;
    gap: 0.75rem;
    margin-top: 0.85rem;
    flex-wrap: wrap;
  }

  #submitBtn, #applyBtn {
    min-height: 2.5rem;
    border-radius: var(--t-radius);
    border: 1px solid var(--t-bda, transparent);
    background: var(--t-ac);
    color: var(--t-ac-ink);
    padding: 0 1.15rem;
    font-family: inherit;
    font-weight: 700;
    font-size: 0.9rem;
    cursor: pointer;
    transition:
      background var(--t-motion, 0.15s) ease,
      box-shadow var(--t-motion, 0.15s) ease,
      transform 0.12s ease;
  }

  #submitBtn:hover, #applyBtn:hover {
    background: var(--t-ac);
    box-shadow: 0 0 0 3px var(--t-gls, transparent);
  }

  #submitBtn:active, #applyBtn:active { transform: scale(0.97); }
  #submitBtn:disabled, #applyBtn:disabled { opacity: 0.5; cursor: default; transform: none; box-shadow: none; }

  #status, #applyStatus {
    color: var(--t-fg2);
    font-size: 0.82rem;
    min-height: 1.3em;
  }

  #status.ok, #applyStatus.ok { color: var(--t-ac); }
  #status.err, #applyStatus.err { color: #f87171; }
  html.theme-light #status.err, html.theme-light #applyStatus.err { color: #b91c1c; }

  .recaptcha-wrap { margin-top: 0.75rem; transform-origin: left top; }

  @media (max-width: 860px) {
    .chips { grid-template-columns: 1fr; }
  }

  @media (prefers-reduced-motion: reduce) {
    .chip, #submitBtn, #applyBtn { transition: none !important; }
  }

    .theme-no-motion .chip,
  .theme-no-motion #submitBtn, .theme-no-motion #applyBtn {
    animation: none !important;
    transition: none !important;
  }
</style>
</head>
<body class="app-shell">
<main class="app-main feedback-shell">
  <h1>Feedback</h1>
  <div class="tabs" role="tablist" aria-label="Feedback sections">
    <button class="tab" role="tab" id="tab-feedback" aria-controls="pane-feedback" aria-selected="true" data-pane="feedback">Send feedback</button>
    <button class="tab" role="tab" id="tab-team" aria-controls="pane-team" aria-selected="false" data-pane="team">Join the team</button>
  </div>

  <section class="panel" id="pane-feedback" role="tabpanel" aria-labelledby="tab-feedback">
    <form id="feedbackForm">
      <div class="field">
        <label id="typeLabel">What is this about?</label>
        <div class="chips" id="typeChips" role="group" aria-labelledby="typeLabel">
          <button class="chip active" type="button" aria-pressed="true" data-type="feedback">General feedback</button>
          <button class="chip" type="button" aria-pressed="false" data-type="broken_game">Something is broken</button>
          <button class="chip" type="button" aria-pressed="false" data-type="add_page">Add a page or game</button>
          <button class="chip" type="button" aria-pressed="false" data-type="general">Other idea</button>
        </div>
      </div>
      <div class="field">
        <label for="site">Message <span id="count">0 / 2000</span></label>
        <textarea id="site" maxlength="2000" placeholder="Include the page and what you expected if something is broken."></textarea>
      </div>
      <div class="actions">
        <button id="submitBtn" type="submit">Send</button>
        <div id="status" role="status" aria-live="polite"></div>
      </div>
    </form>
  </section>

  <section class="panel" id="pane-team" role="tabpanel" aria-labelledby="tab-team" hidden>
    <form id="applyForm">
      <div class="field">
        <label for="role">Role</label>
        <select id="role">
          <option value="tester">Beta tester: test games and VMs, report bugs</option>
          <option value="moderator">Moderator: keep Matrix chat safe, review reports</option>
          <option value="developer">Developer: web apps, games, backend, tooling</option>
          <option value="designer">Designer: art, badges, themes, UI</option>
        </select>
      </div>
      <div class="field"><label for="name">Name</label><input id="name" type="text" autocomplete="name" required></div>
      <div class="field"><label for="email">Email</label><input id="email" type="email" autocomplete="email" required></div>
      <div class="field"><label for="discord">Discord or Matrix username</label><input id="discord" type="text" required></div>
      <div class="field">
        <label for="availability">Availability</label>
        <select id="availability">
          <option value="1-3 hours/week">1–3 hours / week</option>
          <option value="3-5 hours/week" selected>3–5 hours / week</option>
          <option value="5-10 hours/week">5–10 hours / week</option>
          <option value="10+ hours/week">10+ hours / week</option>
        </select>
      </div>
      <div class="field"><label for="why">Why do you want to join?</label><textarea id="why" class="mid" required></textarea></div>
      <div class="field"><label for="skills">Skills and experience</label><textarea id="skills" class="short" required></textarea></div>
      <div class="field"><label for="portfolio">Links <span>optional</span></label><input id="portfolio" type="text"></div>
      <div class="field"><label for="extra">Anything else <span>optional</span></label><textarea id="extra" class="short"></textarea></div>
      <div class="actions">
        <button id="applyBtn" type="submit">Submit application</button>
        <div id="applyStatus" role="status" aria-live="polite"></div>
      </div>
    </form>
    <div class="success-state" id="applySuccess">
      <h2>Application received</h2>
      <p>We'll contact you by email or Discord/Matrix.</p>
    </div>
  </section>
</main>

<script>
var selectedType = 'feedback';
var _SUG_LIMIT = 3, _SUG_WIN = 60000;

function _sugAttempts() {
  var m = {};
  document.cookie.split(';').forEach(function(c) {
    var p = c.trim().split('=');
    if (p.length >= 2) m[p[0]] = p[1];
  });
  return (m['_sug_rl'] || '').split(',').map(Number).filter(Boolean);
}
function _saveSugAttempts(arr) {
  document.cookie = '_sug_rl=' + arr.join(',') + ';expires=' + new Date(Date.now() + _SUG_WIN).toUTCString() + ';path=/';
}
function _sugSpam() {
  var now = Date.now();
  var arr = _sugAttempts().filter(function(t) { return now - t < _SUG_WIN; });
  arr.push(now);
  _saveSugAttempts(arr);
  return arr.length > _SUG_LIMIT;
}
function setStatus(text, cls) {
  var status = document.getElementById('status');
  status.textContent = text || '';
  status.className = cls || '';
}
function studentId() {
  return new URLSearchParams(document.cookie.replaceAll('; ', '&')).get('id')
    || new URLSearchParams(document.cookie.replaceAll('; ', '&')).get('studentId')
    || '';
}
document.querySelectorAll('.chip').forEach(function(btn) {
  btn.addEventListener('click', function() {
    selectedType = btn.dataset.type;
    document.querySelectorAll('.chip').forEach(function(b) { b.classList.toggle('active', b === btn); b.setAttribute('aria-pressed', b === btn ? 'true' : 'false'); });
  });
});
document.getElementById('site').addEventListener('input', function() {
  document.getElementById('count').textContent = this.value.length + ' / 2000';
});
document.getElementById('feedbackForm').addEventListener('submit', submitSite);

async function submitSite(e) {
  e.preventDefault();
  var text = document.getElementById('site').value.trim();
  if (!text) { setStatus('Write a message first.', 'err'); document.getElementById('site').focus(); return; }
  if (_sugSpam()) return setStatus('Slow down a little before sending more.', 'err');
  var btn = document.getElementById('submitBtn');
  btn.disabled = true;
  btn.textContent = 'Sending…';
  setStatus('', '');
  var details = text;

  var recaptcha_token = '';
  if (window.getCaptchaToken) {
    recaptcha_token = await window.getCaptchaToken('feedback') || '';
  }

  try {
    var resp = await fetch('/api/suggest', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({
        id: studentId(),
        type: selectedType,
        text: details,
        recaptcha_token: recaptcha_token
      })
    });
    var r = await resp.json().catch(function() { return {}; });
    if (r.success) {
      setStatus('Submitted. Thank you.', 'ok');
      document.getElementById('site').value = '';
      document.getElementById('count').textContent = '0 / 2000';
    } else {
      setStatus(r.message || (resp.status === 429 ? 'Too many submissions. Wait a minute and try again.' : 'Could not send feedback. Your message is still here; try again.'), 'err');
    }
  } catch (err) {
    setStatus('Could not reach the server. Your message is still here; try again.', 'err');
  }
  btn.disabled = false;
  btn.textContent = 'Send';
}

function showPane(name) {
  document.querySelectorAll('.tab').forEach(function(t) { t.setAttribute('aria-selected', t.dataset.pane === name ? 'true' : 'false'); });
  document.getElementById('pane-feedback').hidden = name !== 'feedback';
  document.getElementById('pane-team').hidden = name !== 'team';
  document.title = (name === 'team' ? 'Join the team' : 'Feedback') + ' — mitch.pro';
  if (location.hash.slice(1) !== (name === 'team' ? 'team' : '')) history.replaceState(null, '', name === 'team' ? '#team' : location.pathname);
}
document.querySelectorAll('.tab').forEach(function(t) { t.addEventListener('click', function() { showPane(t.dataset.pane); }); });
showPane(location.hash === '#team' ? 'team' : 'feedback');
window.addEventListener('hashchange', function() { showPane(location.hash === '#team' ? 'team' : 'feedback'); });

function setApplyStatus(text, cls) {
  var el = document.getElementById('applyStatus');
  el.textContent = text || '';
  el.className = cls || '';
}
document.getElementById('applyForm').addEventListener('submit', async function(e) {
  e.preventDefault();
  var btn = document.getElementById('applyBtn');
  var v = function(id) { return document.getElementById(id).value.trim(); };
  btn.disabled = true;
  btn.textContent = 'Submitting…';
  setApplyStatus('', '');
  var payload = {
    role: document.getElementById('role').value, name: v('name'), email: v('email'), discord: v('discord'),
    availability: document.getElementById('availability').value, why: v('why'), skills: v('skills'),
    portfolio: v('portfolio'), extra: v('extra'), recaptcha_token: ''
  };
  try {
    if (window.getCaptchaToken) payload.recaptcha_token = await window.getCaptchaToken('submit_application') || '';
    var r = await fetch('/api/apply', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload) });
    var d = await r.json().catch(function() { return {}; });
    if (!r.ok) throw new Error(d.error || d.message || 'Could not submit. Your answers are still here; try again.');
    document.getElementById('applyForm').style.display = 'none';
    document.getElementById('applySuccess').style.display = 'block';
  } catch (err) {
    setApplyStatus(err instanceof TypeError ? 'Could not reach the server. Your answers are still here; try again.' : err.message, 'err');
    btn.disabled = false;
    btn.textContent = 'Submit application';
  }
});
</script>
<script src="/cookie-consent.js" defer></script>
</body>
</html>
