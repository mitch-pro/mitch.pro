<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tyler's Tabs — mitch.pro</title>
  <link rel="stylesheet" href="/app.css">
  <script src="/api.js"></script>
  <script src="/app-shell.js" defer></script>
  <style>
    html, body {
      height: 100%;
      overflow: hidden;
    }
    body.app-shell {
      display: flex;
      flex-direction: column;
    }
    .tabs-chrome {
      display: flex;
      align-items: center;
      gap: 0.65rem;
      min-height: 3rem;
      padding: 0.45rem clamp(0.75rem, 2vw, 1.25rem);
      border-bottom: 1px solid var(--t-bd);
      background:
        linear-gradient(180deg, color-mix(in srgb, var(--t-bg) 88%, transparent), color-mix(in srgb, var(--t-bg2) 78%, transparent));
      backdrop-filter: blur(14px) saturate(150%);
      -webkit-backdrop-filter: blur(14px) saturate(150%);
      flex-shrink: 0;
      z-index: 50;
    }
    .tabs-brand {
      font-family: 'Outfit', system-ui, sans-serif;
      font-weight: 800;
      font-size: 0.95rem;
      letter-spacing: -0.03em;
      color: var(--t-fg);
      text-decoration: none;
      white-space: nowrap;
      margin-right: 0.25rem;
    }
    .tabs-brand:hover { color: var(--t-fg); opacity: 0.88; }
    .tab-controls {
      display: flex;
      gap: 0.4rem;
      flex-grow: 1;
      overflow-x: auto;
      padding-bottom: 2px;
      -ms-overflow-style: none;
      scrollbar-width: none;
    }
    .tab-controls::-webkit-scrollbar { display: none; }
    .tab-btn {
      background: var(--t-bg2);
      border: 1px solid var(--t-bd);
      color: var(--t-fg2);
      padding: 0.35rem 0.7rem;
      border-radius: calc(var(--t-radius, 8px) - 1px);
      font-size: 0.82rem;
      font-weight: 600;
      font-family: inherit;
      cursor: pointer;
      white-space: nowrap;
      display: flex;
      align-items: center;
      gap: 0.45rem;
      transition:
        color var(--t-motion, .15s),
        background var(--t-motion, .15s),
        border-color var(--t-motion, .15s);
    }
    .tab-btn.active {
      background: color-mix(in srgb, var(--t-ac) 16%, transparent);
      border-color: color-mix(in srgb, var(--t-ac) 45%, var(--t-bd));
      color: var(--t-fg);
      box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--t-ac) 20%, transparent);
    }
    .tab-btn:hover:not(.active) {
      color: var(--t-fg);
      border-color: color-mix(in srgb, var(--t-bd) 70%, var(--t-ac) 30%);
      background: var(--t-bg3);
    }
    .close-tab {
      opacity: 0.5;
      font-size: 0.85rem;
      transition: opacity var(--t-motion, .15s);
    }
    .close-tab:hover { opacity: 1; }
    .add-tab-btn {
      background: color-mix(in srgb, var(--t-ac) 88%, #000 12%);
      color: #fff;
      border: 1px solid var(--t-bda, transparent);
      width: 2rem;
      height: 2rem;
      border-radius: var(--t-radius, 8px);
      font-weight: 800;
      font-size: 1.05rem;
      cursor: pointer;
      flex-shrink: 0;
      line-height: 1;
      transition: background var(--t-motion, .15s), transform .12s;
    }
    .add-tab-btn:hover { background: var(--t-ac); }
    .add-tab-btn:active { transform: scale(0.96); }
    .actions { display: flex; gap: 0.4rem; flex-shrink: 0; }
    .action-btn {
      background: var(--t-bg2);
      border: 1px solid var(--t-bd);
      color: var(--t-fg);
      padding: 0.35rem 0.7rem;
      border-radius: var(--t-radius, 8px);
      font-size: 0.78rem;
      font-weight: 700;
      font-family: inherit;
      cursor: pointer;
      transition:
        border-color var(--t-motion, .15s),
        background var(--t-motion, .15s),
        color var(--t-motion, .15s);
    }
    .action-btn:hover { border-color: color-mix(in srgb, var(--t-bd) 60%, var(--t-ac) 40%); }
    .action-btn.split-active {
      background: color-mix(in srgb, #4ade80 18%, transparent);
      color: #86efac;
      border-color: rgba(74, 222, 128, 0.45);
    }
    #view-container {
      flex: 1 1 auto;
      display: flex;
      position: relative;
      min-height: 0;
      background: var(--t-bg);
    }
    iframe {
      width: 100%;
      height: 100%;
      border: none;
      display: none;
      background: #fff;
      max-width: none;
    }
    iframe.active { display: block; }
    .view-split {
      display: flex !important;
      width: 100% !important;
      height: 100% !important;
    }
    .view-split iframe {
      display: block;
      flex: 1;
      border-left: 1px solid var(--t-bd);
    }
    .view-split iframe:first-child { border-left: none; }
    #modal-overlay {
      position: fixed; inset: 0;
      background: rgba(0, 0, 0, 0.72);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 500;
      backdrop-filter: blur(8px);
    }
    .modal {
      background: var(--t-bg2);
      border: 1px solid var(--t-bd);
      border-radius: calc(var(--t-radius, 8px) + 6px);
      padding: 1.5rem;
      width: min(500px, 92%);
      box-shadow: 0 24px 60px rgba(0, 0, 0, 0.45);
      animation: app-fade-in 0.35s ease both;
    }
    .modal h3 {
      margin: 0 0 1rem;
      font-family: 'Outfit', system-ui, sans-serif;
      font-size: 1.25rem;
      letter-spacing: -0.02em;
    }
    .modal label {
      font-size: 0.7rem;
      color: var(--t-fg2);
      text-transform: uppercase;
      letter-spacing: 0.06em;
      font-weight: 700;
      display: block;
      margin-bottom: 0.45rem;
    }
    .modal input {
      width: 100%;
      background: var(--t-bg);
      border: 1px solid var(--t-bd);
      color: var(--t-fg);
      padding: 0.7rem 0.9rem;
      border-radius: var(--t-radius, 8px);
      margin-bottom: 1rem;
      outline: none;
      font-family: inherit;
      font-size: 0.92rem;
      transition: border-color var(--t-motion, .15s), box-shadow var(--t-motion, .15s);
    }
    .modal input:focus {
      border-color: var(--t-ac);
      box-shadow: 0 0 0 3px var(--t-gls);
    }
    .presets {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0.5rem;
      margin-bottom: 1.1rem;
    }
    .preset-btn {
      background: var(--t-bg);
      border: 1px solid var(--t-bd);
      color: var(--t-fg);
      padding: 0.65rem 0.75rem;
      border-radius: var(--t-radius, 8px);
      cursor: pointer;
      text-align: left;
      font-size: 0.82rem;
      font-weight: 600;
      font-family: inherit;
      transition: border-color var(--t-motion, .15s), background var(--t-motion, .15s);
    }
    .preset-btn:hover {
      border-color: color-mix(in srgb, var(--t-bd) 55%, var(--t-ac) 45%);
      background: color-mix(in srgb, var(--t-ac) 8%, transparent);
    }
    .modal-actions {
      display: flex;
      justify-content: flex-end;
      gap: 0.5rem;
    }
    .btn {
      padding: 0.55rem 1rem;
      border-radius: var(--t-radius, 8px);
      font-weight: 700;
      font-family: inherit;
      font-size: 0.88rem;
      cursor: pointer;
      border: 1px solid transparent;
      transition: background var(--t-motion, .15s), transform .12s;
    }
    .btn:active { transform: scale(0.97); }
    .btn-cancel {
      background: var(--t-bg);
      color: var(--t-fg);
      border-color: var(--t-bd);
    }
    .btn-create {
      background: color-mix(in srgb, var(--t-ac) 88%, #000 12%);
      color: #fff;
      border-color: var(--t-bda, transparent);
    }
    .btn-create:hover { background: var(--t-ac); }
    @media (max-width: 719px) {
      .tabs-chrome { flex-wrap: wrap; gap: 0.45rem; }
      .actions { width: 100%; justify-content: flex-end; }
      .presets { grid-template-columns: 1fr; }
    }
    @media (prefers-reduced-motion: reduce) {
      .tab-btn, .action-btn, .preset-btn, .modal input, .btn, .add-tab-btn { transition: none !important; }
      .modal { animation: none !important; }
    }
  </style>
</head>
<body>
  <header class="tabs-chrome" role="navigation" aria-label="Tab controls">
    <a href="/" class="tabs-brand">Tyler's Tabs</a>
    <div class="tab-controls" id="tab-list"></div>
    <button class="add-tab-btn" onclick="openModal()" aria-label="Add tab">+</button>
    <div class="actions">
      <button class="action-btn" id="split-btn" onclick="toggleSplit()">Split Screen</button>
      <button class="action-btn" onclick="refreshTab()">Refresh</button>
    </div>
  </header>

  <main id="view-container">
  </main>

  <div id="modal-overlay">
    <div class="modal">
      <h3>New Tab</h3>
      <label for="url-input">Custom URL</label>
      <input type="text" id="url-input" placeholder="https://..." onkeydown="if(event.key==='Enter') createTab()">

      <label>Presets</label>
      <div class="presets">
        <button class="preset-btn" onclick="setURL(location.origin)">🏠 mitch.pro (Home)</button>
        <button class="preset-btn" onclick="setURL('https://www.google.com/search?igu=1')">🔍 Google Search</button>
        <button class="preset-btn" onclick="setURL('https://www.bing.com')">🔎 Bing</button>
        <button class="preset-btn" onclick="setURL('https://mitchdog.com/games/')">🎮 Arcade Hub</button>
        <button class="preset-btn" onclick="setURL('https://en.wikipedia.org/wiki/Main_Page')">📖 Wikipedia</button>
        <button class="preset-btn" onclick="setURL('https://puzzles.mitch.pro')">🧩 Chess Puzzles</button>
      </div>

      <div class="modal-actions">
        <button class="btn btn-cancel" onclick="closeModal()">Cancel</button>
        <button class="btn btn-create" onclick="createTab()">Open Tab</button>
      </div>
    </div>
  </div>

  <script>
    let tabs = [];
    let activeTabId = null;
    let isSplit = false;

    function openModal() {
      document.getElementById('modal-overlay').style.display = 'flex';
      document.getElementById('url-input').focus();
    }

    function closeModal() {
      document.getElementById('modal-overlay').style.display = 'none';
      document.getElementById('url-input').value = '';
    }

    function setURL(url) {
      document.getElementById('url-input').value = url;
      createTab();
    }

    function createTab() {
      let url = document.getElementById('url-input').value;
      if (!url) return;
      if (!url.startsWith('http')) url = 'https://' + url;

      const id = Date.now();
      const title = new URL(url).hostname.replace('www.', '');

      const tab = { id, url, title };
      tabs.push(tab);

      const iframe = document.createElement('iframe');
      iframe.id = 'frame-' + id;
      iframe.src = url;
      document.getElementById('view-container').appendChild(iframe);

      closeModal();
      setActiveTab(id);
      renderTabs();
    }

    function setActiveTab(id) {
      activeTabId = id;
      document.querySelectorAll('iframe').forEach(f => f.classList.remove('active'));
      const activeFrame = document.getElementById('frame-' + id);
      if (activeFrame) activeFrame.classList.add('active');

      if (isSplit) updateSplitView();
      renderTabs();
    }

    function renderTabs() {
      const list = document.getElementById('tab-list');
      list.innerHTML = '';
      tabs.forEach(t => {
        const btn = document.createElement('div');
        btn.className = 'tab-btn' + (t.id === activeTabId ? ' active' : '');
        btn.onclick = () => setActiveTab(t.id);
        btn.innerHTML = `
          <span>${t.title}</span>
          <span class="close-tab" onclick="event.stopPropagation(); closeTab(${t.id})">✕</span>
        `;
        list.appendChild(btn);
      });
    }

    function closeTab(id) {
      tabs = tabs.filter(t => t.id !== id);
      const frame = document.getElementById('frame-' + id);
      if (frame) frame.remove();

      if (activeTabId === id) {
        if (tabs.length > 0) setActiveTab(tabs[tabs.length - 1].id);
        else activeTabId = null;
      }

      if (isSplit) updateSplitView();
      renderTabs();
    }

    function toggleSplit() {
      isSplit = !isSplit;
      const btn = document.getElementById('split-btn');
      btn.classList.toggle('split-active', isSplit);
      updateSplitView();
    }

    function updateSplitView() {
      const container = document.getElementById('view-container');
      if (isSplit && tabs.length >= 2) {
        container.classList.add('view-split');
        document.querySelectorAll('iframe').forEach(f => f.classList.remove('active'));
        // In split mode, we show the active tab and the previous one
        const activeIdx = tabs.findIndex(t => t.id === activeTabId);
        const prevIdx = activeIdx > 0 ? activeIdx - 1 : activeIdx + 1;

        document.querySelectorAll('iframe').forEach(f => f.style.display = 'none');
        document.getElementById('frame-' + tabs[activeIdx].id).style.display = 'block';
        document.getElementById('frame-' + tabs[prevIdx].id).style.display = 'block';
      } else {
        container.classList.remove('view-split');
        document.querySelectorAll('iframe').forEach(f => {
          f.style.display = '';
          f.classList.toggle('active', f.id === 'frame-' + activeTabId);
        });
      }
    }

    function refreshTab() {
      const frame = document.getElementById('frame-' + activeTabId);
      if (frame) frame.src = frame.src;
    }

    // Initial tab
    document.addEventListener('DOMContentLoaded', () => {
      document.getElementById('url-input').value = location.origin;
      createTab();
    });
  </script>
</body>
</html>
