<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Retro Player</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: #000;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      color: #fff;
    }
    #game {
      width: 100%;
      height: 100%;
    }
    #status-msg {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      text-align: center;
      color: #94a3b8;
      font-size: 1rem;
      pointer-events: none;
    }
    .spinner {
      width: 36px;
      height: 36px;
      border: 3px solid rgba(255, 255, 255, 0.15);
      border-top-color: #f75383;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 12px;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div id="game"></div>
  <div id="status-msg">
    <div class="spinner"></div>
    <div id="status-text">Loading emulator…</div>
  </div>

  <script>
    (() => {
      const hashStr = window.location.hash.startsWith('#') ? window.location.hash.slice(1) : '';
      const params = new URLSearchParams(hashStr || window.location.search);
      const core = params.get('core') || 'nes';
      const gameUrl = params.get('url');
      const gameName = params.get('name') || 'Retro Game';
      const biosUrl = params.get('bios');

      if (!gameUrl) {
        document.getElementById('status-msg').innerHTML = '<p>No ROM file loaded.</p>';
        return;
      }

      window.EJS_player = '#game';
      window.EJS_core = core;
      window.EJS_gameUrl = gameUrl;
      window.EJS_gameName = gameName;
      if (biosUrl) {
        window.EJS_biosUrl = biosUrl;
      }
      window.EJS_pathtodata = 'https://cdn.emulatorjs.org/stable/data/';
      window.EJS_startOnLoaded = true;
      window.EJS_color = '#f75383';
      window.EJS_alignStartButton = 'center';

      window.EJS_onGameStart = () => {
        const msg = document.getElementById('status-msg');
        if (msg) msg.remove();
      };

      const loader = document.createElement('script');
      loader.src = 'https://cdn.emulatorjs.org/stable/data/loader.js';
      loader.async = true;
      loader.onerror = () => {
        const text = document.getElementById('status-text');
        if (text) text.textContent = 'Failed to load emulator core.';
      };
      document.body.appendChild(loader);
    })();
  </script>
</body>
</html>
