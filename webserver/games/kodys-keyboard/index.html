<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Kody's Keyboard — mitch.pro</title>
  <link rel="stylesheet" href="/app.css">
  <script src="/api.js"></script>
  <style>
    :root {
      --ac: #3b82f6;
      --panel: var(--t-bg2, rgba(255, 255, 255, 0.03));
      --line: var(--t-bd, rgba(255, 255, 255, 0.08));
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Plus Jakarta Sans', system-ui, sans-serif;
      background-color: var(--t-bg, #060608);
      background-image: var(--t-bg-img-layer, var(--t-bgr, none));
      background-attachment: fixed;
      color: var(--t-fg, #fff);
      min-height: 100vh;
      display: flex; flex-direction: column; align-items: center;
      padding: 60px 20px;
    }

    .container { width: min(800px, 100%); text-align: center; }

    .stats {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: clamp(12px, 3vw, 40px);
      margin-bottom: 40px;
    }
    .stat-box {
      background: var(--panel);
      border: 1px solid var(--line);
      padding: 20px;
      border-radius: var(--t-radius, 14px);
      min-width: 140px;
      flex: 1 1 120px;
      max-width: 200px;
    }
    .stat-val {
      font-family: 'Outfit', system-ui, sans-serif;
      font-size: clamp(1.8rem, 5vw, 2.5rem);
      font-weight: 800;
      color: var(--ac);
      line-height: 1;
    }
    .stat-lbl {
      font-size: 0.78rem;
      font-weight: 700;
      text-transform: uppercase;
      margin-top: 5px;
      color: var(--t-fg2);
    }

    #target-text {
      font-size: clamp(1.1rem, 2.8vw, 1.5rem);
      line-height: 1.65;
      margin-bottom: 30px;
      text-align: left;
      padding: clamp(18px, 3vw, 30px);
      background: var(--t-bg3, rgba(255,255,255,0.02));
      border-radius: var(--t-radius, 14px);
      border: 1px solid var(--line);
      font-weight: 500;
    }
    .correct { color: #4ade80; }
    .incorrect { color: #f87171; text-decoration: underline; }
    .current { border-bottom: 2px solid var(--ac); }

    textarea {
      width: 100%;
      height: 120px;
      background: var(--panel);
      border: 2px solid var(--line);
      border-radius: var(--t-radius, 14px);
      color: var(--t-fg);
      padding: 20px;
      font-size: 1.15rem;
      outline: none;
      font-family: 'Plus Jakarta Sans', system-ui, sans-serif;
      resize: none;
      transition: border-color var(--t-motion, 0.2s);
    }
    textarea:focus { border-color: var(--ac); }

    .rewards {
      margin-top: 40px;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 15px;
    }
    .reward-tier {
      background: var(--panel);
      padding: 15px;
      border-radius: var(--t-radius, 12px);
      border: 1px solid var(--line);
      color: var(--t-fg);
    }
    .reward-tier.active {
      border-color: #f59e0b;
      background: color-mix(in srgb, #f59e0b 8%, transparent);
    }

    #back-btn {
      position: fixed;
      top: 20px;
      left: 20px;
      background: var(--panel);
      border: 1px solid var(--line);
      color: var(--t-fg);
      padding: 8px 16px;
      border-radius: var(--t-radius, 10px);
      text-decoration: none;
      font-weight: 700;
      font-size: 0.88rem;
      z-index: 100;
      transition: border-color var(--t-motion, 0.15s), background var(--t-motion, 0.15s);
    }
    #back-btn:hover {
      border-color: var(--t-bda, var(--ac));
      background: color-mix(in srgb, var(--t-ac) 10%, transparent);
      color: var(--t-fg);
    }

    h1 {
      font-family: 'Outfit', system-ui, sans-serif;
      margin-bottom: 10px;
      font-weight: 800;
      letter-spacing: -0.02em;
    }

    @media (max-width: 640px) {
      body { padding: 72px 14px 28px; }
      .rewards { grid-template-columns: 1fr; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
      }
    }
  </style>
<script src="/mitch-coins.js?v=1" defer></script>
</head>
<body data-shell="off">
  <a href="/games/" id="back-btn">← Back</a>

  <div class="container">
    <h1>Kody's Keyboard</h1>
    <p style="opacity:0.6; margin-bottom: 20px; font-weight: 600;">Type the sentence as fast as you can. No bots allowed.</p>
    <div id="friend-bonus-banner" style="display:none; border: 1px dashed var(--t-bd, rgba(255,255,255,0.1)); border-radius: 12px; padding: 12px; margin-bottom: 24px; font-size: 0.85rem; text-align: center;"></div>

    <div class="stats">
      <div class="stat-box"><div class="stat-val" id="wpm-display">0</div><div class="stat-lbl">WPM</div></div>
      <div class="stat-box"><div class="stat-val" id="accuracy-display">100%</div><div class="stat-lbl">Accuracy</div></div>
      <div class="stat-box"><div class="stat-val" id="timer-display">0.0s</div><div class="stat-lbl">Time</div></div>
    </div>

    <div id="target-text"></div>
    <textarea id="input-area" placeholder="Type here to start..." spellcheck="false"></textarea>

    <div class="rewards">
      <div class="reward-tier"><strong>50+ WPM</strong><br><span style="color:#f59e0b">5 Coins</span></div>
      <div class="reward-tier"><strong>80+ WPM</strong><br><span style="color:#f59e0b">10 Coins</span></div>
      <div class="reward-tier"><strong>120+ WPM</strong><br><span style="color:#f59e0b">20 Coins</span></div>
    </div>
    <p id="remaining-races" style="margin-top: 20px; font-weight: 700; color: var(--t-fg2);"></p>
  </div>

  <script>
    const sentences = [
      "mitch.pro is the fastest unblocked gaming community in the world.",
      "Security is our first priority and privacy is a fundamental human right.",
      "High performance tools for the next generation of players and developers.",
      "The community driven economy ensures everyone can win with MitchCoins.",
      "Tristan's Tower and Adrian Clicker are the keys to massive wealth.",
      "End to end encryption keeps your conversations truly private and secure."
    ];

    let currentSentence = "";
    let startTime = null;
    let timerInt = null;
    let finished = false;

    function init() {
      currentSentence = sentences[Math.floor(Math.random() * sentences.length)];
      document.getElementById('target-text').innerText = currentSentence;
      document.getElementById('input-area').value = "";
      document.getElementById('input-area').disabled = false;
      document.getElementById('wpm-display').innerText = "0";
      document.getElementById('accuracy-display').innerText = "100%";
      document.getElementById('timer-display').innerText = "0.0s";
      startTime = null;
      finished = false;
      checkLimits();
      checkFriendBonus();
    }

    async function checkLimits() {
      const res = await fetch('/api/me');
      const me = await res.json();
      // We'll just show the daily remaining if we can fetch it, otherwise handled on payout
    }

    async function checkFriendBonus() {
      try {
        const res = await fetch('/api/friends/list');
        const data = await res.json();
        const anyFriendOnline = data.friends && data.friends.some(f => f.online);
        const banner = document.getElementById('friend-bonus-banner');
        if (banner) {
          if (anyFriendOnline) {
            banner.style.display = 'block';
            banner.style.borderColor = '#4ade80';
            banner.style.color = '#4ade80';
            banner.style.background = 'rgba(74, 222, 128, 0.05)';
            banner.innerHTML = '👥 <strong>Friend Bonus Active (1.5x)!</strong> A friend is currently online. Play now to get extra coins!';
          } else {
            banner.style.display = 'block';
            banner.style.borderColor = 'var(--t-bd, rgba(255,255,255,0.08))';
            banner.style.color = 'var(--t-fg2, rgba(255,255,255,0.4))';
            banner.style.background = 'transparent';
            banner.innerHTML = '👥 <strong>Friend Play Bonus</strong>: Play while friends are online to earn a <strong>1.5x MitchCoin bonus</strong>!';
          }
        }
      } catch (e) {}
    }

    document.getElementById('input-area').oninput = function() {
      if (finished) return;
      if (!startTime) {
        startTime = Date.now();
        timerInt = setInterval(updateTimer, 100);
      }

      const input = this.value;
      const target = currentSentence;
      let html = "";
      let matches = true;

      for (let i = 0; i < target.length; i++) {
        const char = target[i];
        let cls = "";
        if (i < input.length) {
          if (input[i] === char) cls = "correct";
          else { cls = "incorrect"; matches = false; }
        } else if (i === input.length) {
          cls = "current";
        }
        html += `<span class="${cls}">${char}</span>`;
      }

      document.getElementById('target-text').innerHTML = html;

      if (input === target) finish();
    };

    function updateTimer() {
      const ms = Date.now() - startTime;
      document.getElementById('timer-display').innerText = (ms / 1000).toFixed(1) + "s";
      
      const words = document.getElementById('input-area').value.trim().split(/\s+/).length;
      const wpm = Math.round((words / (ms / 1000)) * 60);
      document.getElementById('wpm-display').innerText = wpm;
    }

    async function finish() {
      finished = true;
      clearInterval(timerInt);
      document.getElementById('input-area').disabled = true;
      
      const ms = Date.now() - startTime;
      const words = currentSentence.split(/\s+/).length;
      const wpm = Math.round((words / (ms / 1000)) * 60);

      try {
        const res = await fetch('/api/games/kodys-keyboard/payout', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ wpm, ms })
        });
        const data = await res.json();
        if (data.success) {
          let msgText = `Great job! You earned ${data.coinsEarned} MitchCoins.`;
          if (data.friendBonusActive) {
            msgText += ` 👥 (Includes 1.5x Friend Bonus!)`;
          }
          alert(`${msgText} Races left today: ${data.dailyRemaining}`);
          init();
        } else {
          alert(data.error || "Failed to process payout.");
          init();
        }
      } catch (e) { alert("Error connecting to server."); }
    }

    init();
  </script>
</body>
</html>
