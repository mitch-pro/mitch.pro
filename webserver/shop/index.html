<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>The Market - mitch.pro</title>
<script src="/theme.js?v=11"></script>
<link rel="stylesheet" href="/app.css">
<script src="/api.js"></script>
<script src="/app-shell.js" defer></script>
<style>
  .page-head {
    display: grid;
    grid-template-columns: 1fr auto;
    gap: 1.25rem;
    align-items: end;
    margin-bottom: 1.25rem;
  }
  .page-head h1 {
    margin: 0;
    font-size: clamp(1.85rem, 4vw, 2.75rem);
    letter-spacing: -0.03em;
  }
  .subline {
    margin: 0.55rem 0 0;
    color: var(--t-fg2);
    font-size: 0.88rem;
    max-width: 40rem;
    line-height: 1.55;
  }
  .balance-panel { min-width: 15rem; }
  .balance-label {
    color: var(--t-fg2);
    font-size: 0.72rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.08em;
  }
  .balance-value {
    color: var(--t-ac);
    font-family: var(--t-display, Fraunces, Georgia, serif);
    font-size: 1.45rem;
    font-weight: 800;
    margin-top: 0.2rem;
  }
  .state-row { display: flex; gap: 0.45rem; flex-wrap: wrap; margin-top: 0.65rem; }
  .pill {
    display: inline-flex;
    align-items: center;
    min-height: 1.5rem;
    padding: 0.2rem 0.55rem;
    border-radius: 999px;
    background: var(--t-bg3);
    border: 1px solid var(--t-bd);
    color: var(--t-fg2);
    font-size: 0.68rem;
    font-weight: 700;
  }
  .pill.good { color: #c084fc; border-color: rgba(192,132,252,.35); background: rgba(192,132,252,.08); }
  .pill.gold { color: #f59e0b; border-color: rgba(245,158,11,.35); background: rgba(245,158,11,.08); }
  .pill.rare { color: #60a5fa; border-color: rgba(96,165,250,.35); background: rgba(96,165,250,.08); }
  .pill.elite { color: #c084fc; border-color: rgba(192,132,252,.4); background: rgba(192,132,252,.1); }
  .pill.legendary { color: #facc15; border-color: rgba(250,204,21,.45); background: rgba(250,204,21,.1); }
  .tabs {
    display: flex;
    gap: 0.45rem;
    margin: 0.85rem 0 1.25rem;
    overflow-x: auto;
    padding-bottom: 0.35rem;
  }
  .tab-btn, .mini-btn {
    background: var(--t-bg2);
    border: 1px solid var(--t-bd);
    border-radius: var(--t-radius, 8px);
    color: var(--t-fg2);
    cursor: pointer;
    font-family: inherit;
    font-weight: 700;
    font-size: 0.82rem;
    transition: border-color var(--t-motion, .15s), background var(--t-motion, .15s), color var(--t-motion, .15s);
    white-space: nowrap;
  }
  .tab-btn { padding: 0.55rem 0.85rem; }
  .tab-btn:hover, .mini-btn:hover { border-color: var(--t-ac); color: var(--t-fg); }
  .tab-btn.active {
    background: color-mix(in srgb, var(--t-ac) 88%, #000 12%);
    color: #fff;
    border-color: var(--t-bda, transparent);
  }
  .section { margin: 0.85rem 0 1.1rem; }
  details.section {
    background: color-mix(in srgb, var(--t-bg2) 70%, transparent);
    border: 1px solid var(--t-bd);
    border-radius: var(--t-radius, 8px);
    overflow: hidden;
  }
  .section-head {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 0.75rem;
    border-bottom: 1px solid var(--t-bd);
    padding: 0.75rem 0.9rem;
    cursor: pointer;
    list-style: none;
  }
  .section-head::-webkit-details-marker { display: none; }
  .section-head::after { content: '+'; color: var(--t-ac); font-weight: 800; }
  details[open] > .section-head::after { content: '−'; }
  .section-title {
    font-family: var(--t-display, Fraunces, Georgia, serif);
    font-size: 1rem;
    font-weight: 750;
    color: var(--t-fg);
  }
  .section-count { color: var(--t-fg2); font-size: 0.72rem; }
  .market-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(190px, 1fr));
    gap: 0.75rem;
    padding: 0.9rem;
  }
  .card {
    background: var(--t-bg2);
    border: 1px solid var(--t-bd);
    border-radius: var(--t-radius, 8px);
    padding: 1rem;
    min-height: 13rem;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
  }
  .card.owned { border-color: rgba(192,132,252,.38); }
  .card.active {
    border-color: color-mix(in srgb, var(--t-ac) 70%, var(--t-bd));
    box-shadow: 0 0 0 1px color-mix(in srgb, var(--t-ac) 25%, transparent);
  }
  .item-kicker { display: flex; gap: 0.35rem; flex-wrap: wrap; margin-bottom: 0.6rem; min-height: 1.5rem; }
  .item-title {
    font-family: var(--t-display, Fraunces, Georgia, serif);
    font-size: 1.05rem;
    font-weight: 750;
    color: var(--t-fg);
    line-height: 1.2;
  }
  .item-desc { font-size: 0.78rem; color: var(--t-fg2); line-height: 1.48; margin-top: 0.5rem; }
  .item-perk {
    margin-top: 0.6rem;
    padding: 0.5rem 0.65rem;
    border-radius: var(--t-radius, 8px);
    background: color-mix(in srgb, var(--t-ac) 8%, transparent);
    border: 1px solid color-mix(in srgb, var(--t-ac) 22%, transparent);
    color: var(--t-ac);
    font-size: 0.72rem;
    line-height: 1.42;
  }
  .price-row {
    display: flex;
    align-items: end;
    justify-content: space-between;
    gap: 0.65rem;
    margin-top: 1rem;
  }
  .price {
    color: var(--t-ac);
    font-family: var(--t-display, Fraunces, Georgia, serif);
    font-size: 1.1rem;
    font-weight: 800;
    white-space: nowrap;
  }
  .price del { color: var(--t-fg2); font-size: 0.78rem; margin-right: 0.3rem; opacity: .75; }
  .btn-buy {
    background: var(--t-bg3);
    color: var(--t-fg);
    border: 1px solid var(--t-bd);
    border-radius: var(--t-radius, 8px);
    min-height: 2.5rem;
    padding: 0.5rem 0.7rem;
    font-family: inherit;
    font-size: 0.86rem;
    font-weight: 700;
    cursor: pointer;
    transition: border-color var(--t-motion, .15s), background var(--t-motion, .15s), transform .12s;
    width: 100%;
    margin-top: 0.75rem;
  }
  .btn-buy:hover:not(:disabled) { border-color: var(--t-ac); transform: translateY(-1px); }
  .btn-buy:disabled { opacity: .45; cursor: default; }
  .btn-buy.primary {
    background: color-mix(in srgb, var(--t-ac) 88%, #000 12%);
    border-color: var(--t-bda, transparent);
    color: #fff;
  }
  .btn-buy.active {
    background: color-mix(in srgb, var(--t-ac) 16%, transparent);
    border-color: color-mix(in srgb, var(--t-ac) 55%, var(--t-bd));
  }
  .gift-box {
    margin-top: 0.9rem;
    border-top: 1px solid var(--t-bd);
    padding-top: 0.75rem;
  }
  .gift-box .gift-label {
    font-size: 0.72rem;
    font-weight: 700;
    color: var(--t-ac);
    margin-bottom: 0.4rem;
    text-transform: uppercase;
    letter-spacing: 0.05em;
  }
  .gift-box .gift-row { display: flex; gap: 0.4rem; }
  .gift-box input {
    flex: 1;
    min-width: 0;
    min-height: 2.2rem;
    padding: 0.4rem 0.55rem;
    font-size: 0.8rem;
    border-radius: var(--t-radius, 8px);
    border: 1px solid var(--t-bd);
    background: var(--t-bg);
    color: var(--t-fg);
    font-family: inherit;
  }
  .gift-box button {
    padding: 0.4rem 0.75rem;
    font-size: 0.8rem;
    border-radius: var(--t-radius, 8px);
    font-weight: 700;
    background: color-mix(in srgb, var(--t-ac) 88%, #000 12%);
    color: #fff;
    border: 1px solid var(--t-bda, transparent);
    cursor: pointer;
    white-space: nowrap;
    font-family: inherit;
  }
  .admin-box {
    display: none;
    margin-top: 1.75rem;
  }
  .admin-grid {
    display: grid;
    grid-template-columns: 1fr 7.5rem auto;
    gap: 0.6rem;
    margin-top: 0.75rem;
  }
  .admin-domains { display: flex; flex-wrap: wrap; gap: 0.4rem; margin-top: 0.55rem; }
  .admin-domains button {
    width: auto;
    min-height: 1.75rem;
    padding: 0.3rem 0.55rem;
    border-radius: 999px;
    font-size: 0.68rem;
    font-family: inherit;
    background: var(--t-bg3);
    border: 1px solid var(--t-bd);
    color: var(--t-fg2);
    cursor: pointer;
  }
  .admin-domains button:first-child {
    color: #fbbf24;
    border-color: rgba(251,191,36,.4);
    background: rgba(251,191,36,.08);
  }
  .admin-box input {
    background: var(--t-bg);
    border: 1px solid var(--t-bd);
    border-radius: var(--t-radius, 8px);
    color: var(--t-fg);
    min-height: 2.5rem;
    padding: 0.5rem 0.65rem;
    font-family: inherit;
  }
  .mini-btn { padding: 0 0.9rem; min-height: 2.5rem; color: var(--t-fg); display: inline-flex; align-items: center; text-decoration: none; }
  .empty {
    color: var(--t-fg2);
    border: 1px dashed var(--t-bd);
    border-radius: var(--t-radius, 8px);
    padding: 1.5rem;
    text-align: center;
  }
  #status-msg {
    position: fixed;
    right: 1.1rem;
    bottom: 1.1rem;
    padding: 0.75rem 1rem;
    border-radius: var(--t-radius, 8px);
    font-weight: 700;
    z-index: 1000;
    display: none;
    max-width: min(26rem, calc(100vw - 2.25rem));
    box-shadow: 0 12px 40px rgba(0,0,0,.35);
  }
  #status-msg.ok { background: #16a34a; color: #fff; display: block; }
  #status-msg.err { background: #dc2626; color: #fff; display: block; }
  .modal-backdrop {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.72);
    backdrop-filter: blur(8px);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 10000;
    opacity: 0;
    transition: opacity 0.25s ease;
  }
  .modal-backdrop.show { opacity: 1; }
  .modal-content {
    background: var(--t-bg2);
    border: 1px solid var(--t-bd);
    border-radius: calc(var(--t-radius, 8px) + 4px);
    width: 95%;
    max-width: 31rem;
    padding: 1.75rem;
    position: relative;
    box-shadow: 0 24px 64px rgba(0,0,0,0.5);
    transform: scale(0.96);
    transition: transform 0.25s ease;
  }
  .modal-backdrop.show .modal-content { transform: scale(1); }
  .modal-close-btn {
    position: absolute;
    top: 0.65rem;
    right: 0.9rem;
    background: transparent;
    border: none;
    color: var(--t-fg2);
    font-size: 1.8rem;
    cursor: pointer;
    line-height: 1;
  }
  .modal-close-btn:hover { color: var(--t-ac); }
  .modal-header { margin-bottom: 1rem; }
  .modal-tags { display: flex; gap: 0.35rem; flex-wrap: wrap; margin-bottom: 0.7rem; }
  .modal-title {
    font-family: var(--t-display, Fraunces, Georgia, serif);
    font-size: 1.55rem;
    font-weight: 800;
    color: var(--t-fg);
  }
  .modal-desc {
    font-size: 0.9rem;
    color: var(--t-fg2);
    line-height: 1.6;
    margin-bottom: 1.25rem;
  }
  .modal-explain {
    background: color-mix(in srgb, var(--t-bg3) 80%, transparent);
    border: 1px solid var(--t-bd);
    border-radius: var(--t-radius, 8px);
    padding: 1rem;
    font-size: 0.82rem;
    line-height: 1.6;
    color: var(--t-fg2);
    margin-bottom: 1.25rem;
  }
  .modal-explain strong {
    color: var(--t-ac);
    font-family: var(--t-display, Fraunces, Georgia, serif);
  }
  .modal-explain .how {
    font-weight: 700;
    margin-bottom: 0.5rem;
    color: var(--t-ac);
    font-family: var(--t-display, Fraunces, Georgia, serif);
  }
  .modal-actions {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 1.25rem;
    border-top: 1px solid var(--t-bd);
    padding-top: 1.15rem;
  }
  @media (max-width: 760px) {
    .page-head { grid-template-columns: 1fr; }
    .balance-panel { min-width: 0; }
    .admin-grid { grid-template-columns: 1fr; }
    .market-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 0.6rem; padding: 0.65rem; }
    .card { padding: 0.75rem; min-height: 0; }
    .item-title { font-size: 0.94rem; }
    .item-desc { font-size: 0.72rem; }
    .price { font-size: 0.95rem; }
  }
</style>

<body class="shop-page">
<main class="app-main" id="market-page">
  <header class="page-head">
    <div>
      <h1>Market</h1>
      <p class="subline" id="shop-note">Loading catalog…</p>
    </div>
    <div class="panel balance-panel">
      <div class="balance-label">Your Balance</div>
      <div class="balance-value mitch-coin-amount"><span id="balance">...</span> <small>MitchCoins</small></div>
      <div class="state-row">
        <span class="pill" id="premium-pill">checking premium</span>
        <span class="pill" id="admin-pill" style="display:none;">admin owns all</span>
        <span class="pill" id="discount-pill" style="display:none;"></span>
      </div>
      <div class="panel-actions" style="margin-top:0.75rem;display:flex;gap:0.45rem;flex-wrap:wrap;">
        <a class="mini-btn btn" href="/inventory/">Open Inventory</a>
        <a class="mini-btn btn" href="/vms/#upgrades" style="border-color:color-mix(in srgb,var(--t-ac) 45%,var(--t-bd));color:var(--t-ac)">🖥 Cloud PC Upgrades</a>
      </div>
    </div>
  </header>

  <div id="active-buffs-bar" class="panel" style="display:none;margin-bottom:1.15rem;background:rgba(192,132,252,0.06);border:1px solid rgba(192,132,252,0.25);border-radius:var(--t-radius, 8px);padding:0.85rem 1.15rem;">
    <div style="display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:0.5rem;margin-bottom:0.5rem;">
      <strong style="font-size:0.85rem;color:var(--t-ac);text-transform:uppercase;letter-spacing:0.06em;display:flex;align-items:center;gap:0.4rem;">
        ⚡ Active Boosts & Casino Exploits
      </strong>
      <span id="active-buffs-count" class="pill good">0 Active</span>
    </div>
    <div id="active-buffs-list" style="display:flex;flex-wrap:wrap;gap:0.5rem;"></div>
  </div>

  <div class="shop-tools"><label><span>⌕</span><input id="shop-search" type="search" placeholder="Search cosmetics, perks, and passes" autocomplete="off"></label><span class="shop-stock"><i></i><b id="shop-stock-count">0</b> items in stock</span></div>
  <div id="tabs" class="tabs"></div>
  <div id="market"></div>

  <div id="admin-section" class="admin-box panel">
    <div class="section-title">Admin Coin Gift</div>
    <p class="subline">Admins already own every shop item. This tool is only for sending coins to a user.</p>
    <div class="admin-grid">
      <input id="admin-email" type="email" placeholder="user@email.com" autocomplete="off">
      <input id="admin-amt" type="number" min="1" step="1" placeholder="Coins">
      <button class="mini-btn btn-primary" id="gift-btn" type="button">Gift</button>

    <div class="admin-domains">

      <button type="button" onclick="setAdminGiftDomain('student.rjuhsd.us')">@student.rjuhsd.us</button>
      <button type="button" onclick="setAdminGiftDomain('gmail.com')">@gmail.com</button>
      <button type="button" onclick="setAdminGiftDomain('outlook.com')">@outlook.com</button>
      <button type="button" onclick="setAdminGiftDomain('hotmail.com')">@hotmail.com</button>
      <button type="button" onclick="setAdminGiftDomain('linux.com')">@linux.com</button>

</main>

     transform on it, which would turn this fixed-position overlay into

  <div class="modal-content">
    <button class="modal-close-btn" type="button">&times;</button>
    <div id="modal-details"></div>
  </div>
</div>

<div id="status-msg"></div>

<script>
  const typeToActive = {
    name_color: 'activeColor',
    chat_badge: 'activeBadge',
    chat_effect: 'activeChatEffect',
    profile_effect: 'activeProfileEffect',
    site_theme: 'activeTheme',
    canvas_tool: 'activeTool',
    ai_personality: 'activeAi'
  };
  const typeToBucket = {
    name_color: 'colors',
    chat_badge: 'badges',
    chat_effect: 'chatEffects',
    profile_effect: 'profileEffects',
    site_theme: 'themes',
    canvas_tool: 'tools'
  };

  const badgeIcons = {
    verified_badge: '✔',
    og_badge: '📜',
    artist_badge: '🎨',
    chess_badge: '♟',
    builder_badge: '🛠',
    lucky_badge: '🍀',
    premium_star_badge: '⭐',
    owner_fan_badge: '👑',
    loaded_dice: '🎲',
    casino_glitch_chip: '💥',
    infinite_luck_charm: '⚡'
  };

  let coins = 0;
  let isPremium = false;
  let isAdmin = false;
  let vipUntil = 0;
  let activeTab = 'all';
  let items = [];
  let inventory = defaultInventory();
  let premiumDiscountPct = 0;
  let shopQuery = '';

  function defaultInventory() {
    return {
      cosmetics: {
        colors: [],
        badges: [],
        chatEffects: [],
        profileEffects: [],
        themes: [],
        tools: [],
        activeColor: '',
        activeBadge: '',
        activeChatEffect: '',
        activeProfileEffect: '',
        activeTheme: '',
        activeTool: '',
        activeAi: ''
      },
      ai: []
    };
  }

  function esc(value) {
    return String(value ?? '').replace(/[&<>"']/g, ch => ({
      '&': '&amp;',
      '<': '&lt;',
      '>': '&gt;',
      '"': '&quot;',
      "'": '&#39;'
    }[ch]));
  }

  function slug(value) {
    return String(value || '').toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '');
  }

  function showStatus(text, ok) {
    const el = document.getElementById('status-msg');
    el.textContent = text;
    el.className = ok ? 'ok' : 'err';
    el.style.display = 'block';
    clearTimeout(showStatus.timer);
    showStatus.timer = setTimeout(() => { el.style.display = 'none'; }, 3200);
  }

  function sections() {
    return [...new Set(items.map(item => item.section || 'Other'))];
  }

  function setTab(tab) {
    activeTab = tab;
    renderTabs();
    render();
  }

  function owns(item) {
    if (item.type === 'premium') return isPremium;
    if (item.costType === 'vip_casino_pass') return vipUntil > Date.now();
    if (item.costType === 'ai_personality') return (inventory.ai || []).includes(item.id);
    const bucket = typeToBucket[item.costType];
    return !!bucket && (inventory.cosmetics[bucket] || []).includes(item.id);
  }

  function activeFor(item) {
    const activeKey = typeToActive[item.costType];
    if (!activeKey) return false;
    return inventory.cosmetics[activeKey] === item.id;
  }

  function toggleable(item) {
    return !!typeToActive[item.costType];
  }

  function locked(item) {
    return item.premiumOnly && !isPremium;
  }

  function canAfford(item) {
    return coins >= Number(item.cost || 0);
  }

  function priceHtml(item) {
    const original = Number(item.originalCost || item.cost || 0);
    const cost = Number(item.cost || 0);
    if (original > cost) return `<del>${original}</del>${cost}`;
    return String(cost);
  }

  function renderTabs() {
    const tabs = document.getElementById('tabs');
    const entries = [{ key: 'all', label: 'All Items' }].concat(sections().map(section => ({ key: slug(section), label: section })));
    tabs.innerHTML = entries.map(tab => (
      `<button class="tab-btn ${activeTab === tab.key ? 'active' : ''}" data-tab="${esc(tab.key)}">${esc(tab.label)}</button>`
    )).join('');
    tabs.querySelectorAll('button').forEach(btn => btn.addEventListener('click', () => setTab(btn.dataset.tab)));
  }

  function isBuffActive(item) {
    if (!inventory?.status) return false;
    const now = Date.now();
    const s = inventory.status;
    if (item.costType === 'loaded_dice') return (s.loadedDiceUntil || 0) > now;
    if (item.costType === 'casino_glitch_chip') return (s.casinoGlitchUntil || 0) > now;
    if (item.costType === 'infinite_luck_charm') return (s.infiniteLuckUntil || 0) > now;
    if (item.costType === 'vip_casino_pass') return (s.vipUntil || 0) > now || vipUntil > now;
    if (item.costType === 'bad_beat_insurance') return (s.badBeatInsuranceUntil || 0) > now;
    if (item.costType === 'double_down_ticket') return (s.doubleDownUntil || 0) > now;
    if (item.costType === 'happy_hour_ticket') return (s.happyHourUntil || 0) > now;
    return false;
  }

  function buttonLabel(item, owned, active) {
    if (locked(item)) return 'Premium Only';
    if (isBuffActive(item)) return 'Active (Extend)';
    if (item.costType === 'vip_casino_pass' && owned) return 'Active (Extend)';
    if (active) return 'Turn Off';
    if (owned && toggleable(item)) return 'Turn On';
    if (owned) return 'Owned';
    if (!canAfford(item)) return 'Need More Coins';
    return item.type === 'premium' ? 'Buy Premium' : 'Buy';
  }

  function renderItem(item) {
    const owned = owns(item);
    const active = activeFor(item);
    const disabled = locked(item) || (!owned && !canAfford(item)) || (owned && !toggleable(item));
    const classes = ['card'];
    if (owned) classes.push('owned');
    if (active) classes.push('active');
    const tags = [];
    if (item.tier) tags.push(`<span class="pill ${esc(item.tier)}">${esc(item.tier)}</span>`);
    if (item.premiumOnly) tags.push('<span class="pill gold">premium only</span>');
    if (owned) tags.push('<span class="pill good">owned</span>');
    if (active) tags.push('<span class="pill">active</span>');
    if (item.discountPct) tags.push(`<span class="pill gold">${item.discountPct}% off</span>`);
    const primary = item.type === 'premium' || (!owned && !locked(item));
    return `
      <article class="${classes.join(' ')}" data-id="${esc(item.id)}">
        <div>
          <div class="item-kicker">${tags.join('')}</div>
          <div class="item-title">${badgeIcons[item.id] ? `<span style="margin-right:8px; opacity:0.8;">${badgeIcons[item.id]}</span>` : ''}${esc(item.name)}</div>
          <div class="item-desc">${esc(item.desc)}</div>
          ${item.perk ? `<div class="item-perk">${esc(item.perk)}</div>` : ''}
        </div>
        <div>
          <div class="price-row">
            <div class="price mitch-coin-price">${priceHtml(item)} <small>MitchCoins</small></div>
            <button class="item-info" type="button" data-info="${esc(item.id)}" aria-label="Details for ${esc(item.name)}">Details</button>
          </div>
          <button class="btn-buy ${primary ? 'primary' : ''} ${active ? 'active' : ''}" data-item="${esc(item.id)}" ${disabled ? 'disabled' : ''}>
            ${buttonLabel(item, owned, active)}
          </button>
          ${item.id === 'premium' ? `
          <div class="gift-box">
            <div class="gift-label">Gift Premium (Limit 1 ever)</div>
            <div class="gift-row">
              <input type="email" id="gift-target-email" placeholder="friend@school.com">
              <button type="button" onclick="giftPremium()">Gift</button>
            </div>
          </div>
          ` : ''}
        </div>
      </article>
    `;
  }

  function render() {
    renderTabs();
    const market = document.getElementById('market');
    let filtered = activeTab === 'all' ? items : items.filter(item => slug(item.section) === activeTab);
    if (shopQuery) filtered = filtered.filter(item => [item.name,item.desc,item.perk,item.section,item.tier].some(value => String(value || '').toLowerCase().includes(shopQuery)));
    document.getElementById('shop-stock-count').textContent = filtered.length;
    if (!filtered.length) {
      market.innerHTML = '<div class="empty">No items in this section yet.</div>';
      return;
    }
    const grouped = {};
    filtered.forEach(item => {
      const section = item.section || 'Other';
      if (!grouped[section]) grouped[section] = [];
      grouped[section].push(item);
    });
    market.innerHTML = Object.entries(grouped).map(([section, sectionItems]) => `
      <section class="section" aria-label="${esc(section)}">
        <header class="section-head">
          <h2 class="section-title">${esc(section)}</h2>
          <div class="section-count">${sectionItems.length} item${sectionItems.length === 1 ? '' : 's'}</div>
        </header>
        <div class="market-grid">${sectionItems.map(renderItem).join('')}</div>
      </section>
    `).join('');
    market.querySelectorAll('.btn-buy[data-item]').forEach(btn => {
      btn.addEventListener('click', () => handleItem(btn.dataset.item));
    });
    market.querySelectorAll('[data-info]').forEach(button => {
      button.addEventListener('click', () => openModal(button.dataset.info));
    });
  }

  async function handleItem(itemId) {
    const item = items.find(entry => entry.id === itemId);
    if (!item) return;
    if (item.type === 'premium') return buyPremium();
    if (owns(item) && toggleable(item)) {
      return toggleItem(item, activeFor(item) ? '' : item.id);
    }
    return buyItem(item);
  }

  async function getShopCaptchaToken(action) {
    for (let i = 0; i < 50; i++) {
      if (window.getCaptchaToken && window.grecaptcha) break;
      await new Promise(r => setTimeout(r, 100));
    }
    if (window.getCaptchaToken) {
      return await window.getCaptchaToken(action) || '';
    }
    return '';
  }

  async function buyItem(item) {
    const recaptcha_token = await getShopCaptchaToken('buy_shop_item');
    try {
      const r = await fetch('/api/shop/buy', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ itemId: item.id, recaptcha_token })
      });
      const data = await r.json().catch(() => ({}));
      if (!r.ok) return showStatus(data.error || 'Purchase failed', false);
      showStatus(data.message || 'Purchase successful', true);
      await load();
    } catch {
      showStatus('Network error while buying item', false);
    }
  }

  async function toggleItem(item, itemId) {
    try {
      const r = await fetch('/api/me/cosmetics/equip', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ itemId, type: item.costType })
      });
      const data = await r.json().catch(() => ({}));
      if (!r.ok) return showStatus(data.error || 'Could not update item', false);
      showStatus(itemId ? 'Turned on' : 'Turned off', true);
      await load();
    } catch {
      showStatus('Network error while updating item', false);
    }
  }

  async function buyPremium() {
    const recaptcha_token = await getShopCaptchaToken('buy_premium');
    try {
      const r = await fetch('/api/coins/buy-premium', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ recaptcha_token })
      });
      const data = await r.json().catch(() => ({}));
      if (!r.ok) return showStatus(data.error || 'Premium purchase failed', false);
      showStatus(data.message || 'Welcome to Premium', true);
      setTimeout(() => load(), 800);
    } catch {
      showStatus('Network error while buying premium', false);
    }
  }

  async function giftPremium() {
    const targetEmail = document.getElementById('gift-target-email').value.trim();
    if (!targetEmail) return showStatus('Please enter a friend\'s email address', false);
    if (!(await customConfirm('Gift Premium', `Are you sure you want to gift Lifetime Premium to ${targetEmail}? This costs 5,000 coins and is limited to one gift ever.`))) return;
    const recaptcha_token = await getShopCaptchaToken('gift_premium');
    try {
      const r = await fetch('/api/coins/gift-premium', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ targetEmail, recaptcha_token })
      });
      const data = await r.json().catch(() => ({}));
      if (!r.ok) return showStatus(data.error || 'Gifting premium failed', false);
      showStatus(data.message || 'Premium gifted successfully!', true);
      const input = document.getElementById('gift-target-email');
      if (input) input.value = '';
      setTimeout(() => load(), 800);
    } catch {
      showStatus('Network error while gifting premium', false);
    }
  }

  async function adminGift() {
    const targetEmail = document.getElementById('admin-email').value.trim();
    const amount = Number(document.getElementById('admin-amt').value);
    if (!targetEmail || !amount) return showStatus('Enter an email and coin amount', false);
    try {
      const r = await fetch('/api/admin/gift-coins', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ targetEmail, amount, reason: 'Admin manual shop gift' })
      });
      const data = await r.json().catch(() => ({}));
      if (!r.ok) return showStatus(data.error || 'Gift failed', false);
      showStatus('Coins gifted', true);
      document.getElementById('admin-email').value = '';
      document.getElementById('admin-amt').value = '';
      await load();
    } catch {
      showStatus('Network error while gifting coins', false);
    }
  }

  function setAdminGiftDomain(domain) {
    const input = document.getElementById('admin-email');
    const local = (input.value || '').split('@')[0].trim() || 'user';
    input.value = local + '@' + domain;
    input.focus();
    input.setSelectionRange(0, input.value.indexOf('@'));
  }

  async function load() {
    try {
      const [rMe, rCoins, rInv, rItems] = await Promise.all([
        fetch('/api/me'),
        fetch('/api/me/coins'),
        fetch('/api/me/inventory'),
        fetch('/api/shop/items')
      ]);
      const me = await rMe.json();
      const coinData = await rCoins.json();
      const invData = await rInv.json();
      const itemData = await rItems.json();
      coins = Number(coinData.coins || 0);
      isPremium = !!me.isPremium;
      isAdmin = !!me.isAdmin;
      vipUntil = Number(me.vipUntil || 0);
      inventory = Object.assign(defaultInventory(), invData || {});
      inventory.cosmetics = Object.assign(defaultInventory().cosmetics, inventory.cosmetics || {});
      items = Array.isArray(itemData.items) ? itemData.items : [];
      premiumDiscountPct = Number(itemData.premiumDiscountPct || 0);
      document.getElementById('balance').textContent = coins.toFixed(2);
      document.getElementById('premium-pill').textContent = isPremium ? 'premium active' : 'standard member';
      document.getElementById('premium-pill').className = isPremium ? 'pill good' : 'pill';
      document.getElementById('admin-pill').style.display = isAdmin ? '' : 'none';
      document.getElementById('admin-section').style.display = isAdmin ? 'block' : 'none';
      const discount = document.getElementById('discount-pill');
      discount.style.display = isPremium ? '' : 'none';
      discount.textContent = isPremium ? (itemData.premiumDiscountNote || 'premium discounts vary by item') : '';
      document.getElementById('shop-note').textContent = isAdmin
        ? 'Admin accounts automatically own every shop item and can toggle supported items on or off.'
        : 'Prices now scale by rarity and usefulness. Premium discounts vary per item, so cooler perks keep their own special pricing.';

      const status = inventory.status || {};
      const activeBuffs = [];
      const now = Date.now();
      if ((status.infiniteLuckUntil || 0) > now) {
        const mins = Math.max(1, Math.ceil((status.infiniteLuckUntil - now) / 60000));
        activeBuffs.push(`<span class="pill legendary">⚡ Infinite Luck Exploit (${mins}m left: 10X + Auto-Win + VIP)</span>`);
      }
      if ((status.loadedDiceUntil || 0) > now) {
        const mins = Math.max(1, Math.ceil((status.loadedDiceUntil - now) / 60000));
        activeBuffs.push(`<span class="pill gold">🎲 Loaded Dice (${mins}m left: Auto-Win Rig)</span>`);
      }
      if ((status.casinoGlitchUntil || 0) > now) {
        const mins = Math.max(1, Math.ceil((status.casinoGlitchUntil - now) / 60000));
        activeBuffs.push(`<span class="pill elite">💥 5X Glitch Multiplier (${mins}m left)</span>`);
      }
      if ((status.vipUntil || 0) > now || vipUntil > now) {
        const maxVip = Math.max(status.vipUntil || 0, vipUntil || 0);
        const mins = Math.max(1, Math.ceil((maxVip - now) / 60000));
        activeBuffs.push(`<span class="pill gold">👑 VIP Casino Pass (${mins}m left: Unlimited Bet)</span>`);
      }
      if ((status.doubleDownUntil || 0) > now) {
        const mins = Math.max(1, Math.ceil((status.doubleDownUntil - now) / 60000));
        activeBuffs.push(`<span class="pill rare">🎯 Double Down (${mins}m left: 2X Win)</span>`);
      }
      if ((status.badBeatInsuranceUntil || 0) > now) {
        const mins = Math.max(1, Math.ceil((status.badBeatInsuranceUntil - now) / 60000));
        activeBuffs.push(`<span class="pill good">🛡️ Bad Beat Insurance (${mins}m left: 100% Refund)</span>`);
      }
      if ((status.happyHourUntil || 0) > now) {
        const mins = Math.max(1, Math.ceil((status.happyHourUntil - now) / 60000));
        activeBuffs.push(`<span class="pill good">🔥 Personal Happy Hour (${mins}m left: 2X Coins)</span>`);
      }
      if ((status.slotsFreeSpins || 0) > 0) {
        activeBuffs.push(`<span class="pill good">🎰 ${status.slotsFreeSpins} Free Spins Available</span>`);
      }

      const bar = document.getElementById('active-buffs-bar');
      const list = document.getElementById('active-buffs-list');
      const count = document.getElementById('active-buffs-count');
      if (bar && list && count) {
        if (activeBuffs.length > 0) {
          bar.style.display = 'block';
          list.innerHTML = activeBuffs.join('');
          count.textContent = `${activeBuffs.length} Active`;
        } else {
          bar.style.display = 'none';
        }
      }

      render();
    } catch (err) {
      console.error(err);
      document.getElementById('market').innerHTML = '<div class="empty">Failed to load the shop. Try refreshing.</div>';
      showStatus('Failed to load shop data', false);
    }
  }

  const modal = document.getElementById('info-modal');
  const modalClose = modal.querySelector('.modal-close-btn');

  function openModal(itemId) {
    const item = items.find(entry => entry.id === itemId);
    if (!item) return;
    const owned = owns(item);
    const active = activeFor(item);
    const disabled = locked(item) || (!owned && !canAfford(item)) || (owned && !toggleable(item));
    const details = document.getElementById('modal-details');

    const tags = [];
    if (item.tier) tags.push(`<span class="pill ${esc(item.tier)}">${esc(item.tier)}</span>`);
    if (item.premiumOnly) tags.push('<span class="pill gold">premium only</span>');
    if (owned) tags.push('<span class="pill good">owned</span>');
    if (active) tags.push('<span class="pill">active</span>');
    if (item.discountPct) tags.push(`<span class="pill gold">${item.discountPct}% off</span>`);

    const expl = itemExplanations[item.id] || "No additional information is available for this item.";

    details.innerHTML = `
      <div class="modal-header">
        <div class="modal-tags">${tags.join('')}</div>
        <div class="modal-title">${badgeIcons[item.id] ? `<span style="margin-right:8px; opacity:0.8;">${badgeIcons[item.id]}</span>` : ''}${esc(item.name)}</div>
      </div>
      <div class="modal-desc">${esc(item.desc)}</div>
      <div class="modal-explain">
        <div class="how">How it works</div>
        <div>${expl}</div>
      </div>
      <div class="modal-actions">
        <div class="price mitch-coin-price" style="font-size: 1.35rem;">${priceHtml(item)} <small>MitchCoins</small></div>
        <div style="flex-grow: 1; max-width: 12.5rem;">
          <button class="btn-buy ${item.type === 'premium' || (!owned && !locked(item)) ? 'primary' : ''} ${active ? 'active' : ''}" 
                  onclick="handleModalBuy('${esc(item.id)}')" 
                  ${disabled ? 'disabled' : ''}
                  style="margin-top: 0;">
            ${buttonLabel(item, owned, active)}
          </button>
        </div>
      </div>
    `;

    modal.style.display = 'flex';
    // Trigger reflow
    modal.offsetHeight;
    modal.classList.add('show');
  }

  function closeModal() {
    modal.classList.remove('show');
    setTimeout(() => {
      if (!modal.classList.contains('show')) {
        modal.style.display = 'none';
      }
    }, 300);
  }

  modalClose.addEventListener('click', closeModal);
  modal.addEventListener('click', (event) => {
    if (event.target === modal) closeModal();
  });
