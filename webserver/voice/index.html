<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Voice — mitch.pro</title>
<link rel="stylesheet" href="/app.css">
<script src="/api.js"></script>
<script src="/app-shell.js" defer></script>
<style>
  .voice-shell { width: min(44rem, 100%); max-width: 44rem; margin: 0 auto; padding: 1.5rem 1rem 3rem; box-sizing: border-box; }
  .page-title {
    margin: 0 0 1rem;
    font-size: clamp(1.85rem, 4vw, 2.4rem);
    font-weight: 800;
    letter-spacing: -0.035em;
    color: var(--t-fg);
  }
  .channels { display: grid; gap: 0.75rem; }
  .channel {
    padding: 1rem 1.1rem;
    border: 1px solid var(--t-bd);
    border-radius: var(--t-radius, 10px);
    background: var(--t-bg2);
  }
  .channel.live { border-color: var(--t-ac); }
  .channel-head { display: flex; align-items: center; gap: 0.75rem; }
  .channel-name { flex: 1; margin: 0; font-size: 1.05rem; font-weight: 700; color: var(--t-fg); }
  .channel-count { font-size: 0.85rem; color: var(--t-fg2); }
  .btn {
    font: inherit;
    font-size: 0.9rem;
    font-weight: 600;
    padding: 0.45rem 0.95rem;
    border-radius: var(--t-radius-sm, 7px);
    border: 1px solid var(--t-bd);
    background: var(--t-bg3);
    color: var(--t-fg);
    cursor: pointer;
  }
  .btn:hover:not(:disabled) { border-color: var(--t-bda); }
  .btn:disabled { opacity: 0.5; cursor: default; }
  .btn.primary { background: var(--t-ac); border-color: var(--t-ac); color: var(--t-ac-ink); }
  .btn.danger { border-color: #c0392b; color: #c0392b; }
  .people { list-style: none; margin: 0.7rem 0 0; padding: 0; display: grid; gap: 0.35rem; }
  .people li {
    display: flex; align-items: center; gap: 0.55rem;
    font-size: 0.92rem; color: var(--t-fg);
  }
  .dot {
    width: 0.6rem; height: 0.6rem; border-radius: 50%;
    background: var(--t-bd); flex: none;
  }
  .speaking .dot { background: #2ecc71; box-shadow: 0 0 0 3px rgba(46, 204, 113, 0.25); }
  .muted-tag { font-size: 0.78rem; color: var(--t-fg3); }
  .controls { display: flex; gap: 0.5rem; margin-top: 0.8rem; }
  .status { margin: 1rem 0 0; font-size: 0.88rem; color: var(--t-fg2); min-height: 1.3em; }
  .status.error { color: #c0392b; }
  html.theme-light .status.error, html.theme-light .btn.danger { color: #a93226; }
</style>
</head>
<body class="app-shell">
<main class="app-main">
  <div class="voice-shell">
    <h1 class="page-title">Voice</h1>
    <div id="channels" class="channels" aria-live="polite"></div>
    <p id="status" class="status" role="status"></p>
    <div id="audio-sink" hidden></div>
  </div>
</main>
<script>
(function () {
  'use strict';
  // Audio is 16 kHz mono signed 16-bit PCM in 20 ms frames, relayed by the
  // server over a WebSocket (see docs/voice-channels.md).
  var RATE = 16000, FRAME = 320;
  var SEND_RMS = 0.012, HANGOVER_FRAMES = 10;   // send ~200 ms past the last loud frame

  var listEl = document.getElementById('channels');
  var statusEl = document.getElementById('status');
  var channels = [];
  var session = null;      // { id, ws, ctx, stream, capture, players, roster, myId, ... }
  var connecting = '';
  var speakingAt = {};     // sender id -> last time audio arrived (ms)
  var speakingNow = '';    // key of the speaking set last drawn

  // Mic: downsample to 16 kHz, cut into frames, report each frame's loudness.
  // Speaker: one jitter-buffered player per remote speaker.
  var WORKLET = [
    'class Capture extends AudioWorkletProcessor {',
    '  constructor(){ super(); this.step = sampleRate / ' + RATE + '; this.pos = 0; this.acc = 0; this.n = 0;',
    '    this.buf = new Int16Array(' + FRAME + '); this.i = 0; this.sq = 0; }',
    '  process(inputs){ var ch = inputs[0] && inputs[0][0]; if(!ch) return true;',
    '    for (var k = 0; k < ch.length; k++){ this.acc += ch[k]; this.n++; this.pos++;',
    '      if (this.pos >= this.step){ this.pos -= this.step; var v = this.acc / this.n; this.acc = 0; this.n = 0;',
    '        v = Math.max(-1, Math.min(1, v)); this.sq += v*v; this.buf[this.i++] = v < 0 ? v*32768 : v*32767;',
    '        if (this.i === ' + FRAME + '){ this.port.postMessage({ pcm: this.buf.buffer, rms: Math.sqrt(this.sq/' + FRAME + ') }, [this.buf.buffer]);',
    '          this.buf = new Int16Array(' + FRAME + '); this.i = 0; this.sq = 0; } } }',
    '    return true; }',
    '}',
    'registerProcessor("capture", Capture);',
    'class Player extends AudioWorkletProcessor {',
    '  constructor(){ super(); this.q = []; this.cur = null; this.ci = 0; this.queued = 0; this.playing = false;',
    '    this.step = ' + RATE + ' / sampleRate; this.frac = 0; this.last = 0;',
    '    this.port.onmessage = (e) => { this.q.push(e.data); this.queued += e.data.length;',
    '      while (this.queued > ' + (RATE * 0.4) + '){ this.queued -= this.q.shift().length; } }; }',
    '  next(){ if (!this.cur || this.ci >= this.cur.length){ this.cur = this.q.shift() || null; this.ci = 0;',
    '      if (this.cur) this.queued -= this.cur.length; } return this.cur ? this.cur[this.ci++] : null; }',
    '  process(inputs, outputs){ var out = outputs[0][0];',
    '    if (!this.playing){ if (this.queued < ' + (RATE * 0.06) + ') return true; this.playing = true; }',
    '    for (var k = 0; k < out.length; k++){ this.frac += this.step;',
    '      while (this.frac >= 1){ this.frac -= 1; var s = this.next(); if (s === null){ this.playing = false; this.frac = 0; out.fill(0, k); return true; } this.prev = this.last; this.last = s; }',
    '      var p = this.prev === undefined ? this.last : this.prev; out[k] = p + (this.last - p) * this.frac; }',
    '    return true; }',
    '}',
    'registerProcessor("player", Player);'
  ].join('\n');

  function setStatus(msg, isError) {
    statusEl.textContent = msg || '';
    statusEl.className = 'status' + (isError ? ' error' : '');
  }
  function el(tag, cls, text) {
    var n = document.createElement(tag);
    if (cls) n.className = cls;
    if (text != null) n.textContent = text;
    return n;
  }
  function speakingKey() {
    var now = Date.now();
    return Object.keys(speakingAt).filter(function (k) { return now - speakingAt[k] < 350; }).join(',');
  }

  function render() {
    listEl.textContent = '';
    speakingNow = speakingKey();
    var now = Date.now();
    channels.forEach(function (ch) {
      var joined = session && session.id === ch.id && session.ready;
      var card = el('section', 'channel' + (joined ? ' live' : ''));
      var head = el('div', 'channel-head');
      head.appendChild(el('h2', 'channel-name', ch.name));
      var people = joined ? session.roster : ch.participants.map(function (n) { return { name: n }; });
      head.appendChild(el('span', 'channel-count', people.length ? people.length + ' in call' : ''));
      if (!joined) {
        var join = el('button', 'btn primary', connecting === ch.id ? 'Joining…' : 'Join');
        join.type = 'button';
        join.disabled = !!connecting;
        join.addEventListener('click', function () { joinChannel(ch.id); });
        head.appendChild(join);
      }
      card.appendChild(head);
      if (people.length) {
        var ul = el('ul', 'people');
        people.forEach(function (p) {
          var me = joined && p.id === session.myId;
          var talking = joined && (me ? session.talking : now - (speakingAt[p.id] || 0) < 350);
          var li = el('li', talking && !p.muted ? 'speaking' : '');
          li.appendChild(el('span', 'dot'));
          li.appendChild(el('span', '', p.name + (me ? ' (you)' : '')));
          if (p.muted && joined) li.appendChild(el('span', 'muted-tag', 'muted'));
          ul.appendChild(li);
        });
        card.appendChild(ul);
      }
      if (joined) {
        var bar = el('div', 'controls');
        var mute = el('button', 'btn', session.muted ? 'Unmute' : 'Mute');
        mute.type = 'button';
        mute.addEventListener('click', toggleMute);
        var leave = el('button', 'btn danger', 'Leave');
        leave.type = 'button';
        leave.addEventListener('click', function () { leaveChannel(); });
        bar.appendChild(mute);
        bar.appendChild(leave);
        card.appendChild(bar);
      }
      listEl.appendChild(card);
    });
  }

  async function refresh() {
    if (session || connecting) return;
    try {
      var r = await fetch('/api/voice/channels?t=' + Date.now(), { credentials: 'include' });
      if (r.status === 401) { setStatus('Sign in to use voice.', true); channels = []; return render(); }
      var data = await r.json();
      if (!r.ok) throw new Error(data.error || 'Could not load channels');
      channels = data.channels || [];
      render();
    } catch (e) {
      setStatus(e.message || 'Could not load channels', true);
    }
  }

  function playerFor(s, id) {
    var p = s.players[id];
    if (!p) {
      var node = new AudioWorkletNode(s.ctx, 'player', { numberOfInputs: 0, outputChannelCount: [1] });
      node.connect(s.ctx.destination);
      p = s.players[id] = node;
    }
    return p;
  }

  function onMessage(s, ev) {
    if (typeof ev.data === 'string') {
      var m = JSON.parse(ev.data);
      if (m.type === 'hello') { s.myId = m.id; }
      else if (m.type === 'roster') {
        s.roster = m.people;
        var live = {};
        m.people.forEach(function (p) { live[p.id] = 1; });
        Object.keys(s.players).forEach(function (id) {
          if (!live[id]) { s.players[id].disconnect(); delete s.players[id]; delete speakingAt[id]; }
        });
        s.ready = true;
        render();
      }
      return;
    }
    var dv = new DataView(ev.data);
    if (dv.byteLength <= 4) return;
    var id = dv.getUint32(0);
    var n = (dv.byteLength - 4) >> 1;
    var f = new Float32Array(n);
    for (var i = 0; i < n; i++) f[i] = dv.getInt16(4 + i * 2, true) / 32768;
    speakingAt[id] = Date.now();
    playerFor(s, id).port.postMessage(f);
  }

  async function joinChannel(id) {
    if (connecting) return;
    if (session) await leaveChannel(true);
    connecting = id;
    setStatus('Connecting…');
    render();
    var s = { id: id, ready: false, muted: false, roster: [], players: {}, myId: 0, talking: false, hang: 0 };
    try {
      s.stream = await navigator.mediaDevices.getUserMedia({
        audio: { channelCount: 1, echoCancellation: true, noiseSuppression: true, autoGainControl: true }
      });
      s.ctx = new (window.AudioContext || window.webkitAudioContext)({ latencyHint: 'interactive' });
      var url = URL.createObjectURL(new Blob([WORKLET], { type: 'text/javascript' }));
      await s.ctx.audioWorklet.addModule(url);
      URL.revokeObjectURL(url);
      await s.ctx.resume();
      var scheme = location.protocol === 'https:' ? 'wss://' : 'ws://';
      s.ws = new WebSocket(scheme + location.host + '/api/voice/ws?channel=' + encodeURIComponent(id));
      s.ws.binaryType = 'arraybuffer';
      await new Promise(function (resolve, reject) {
        s.ws.onopen = resolve;
        s.ws.onerror = function () { reject(new Error('Could not reach the voice server.')); };
      });
      session = s;
      s.capture = new AudioWorkletNode(s.ctx, 'capture', { numberOfOutputs: 0 });
      s.ctx.createMediaStreamSource(s.stream).connect(s.capture);
      s.capture.port.onmessage = function (e) {
        var loud = e.data.rms > SEND_RMS;
        s.hang = loud ? HANGOVER_FRAMES : Math.max(0, s.hang - 1);
        var talking = !s.muted && s.hang > 0;
        if (talking !== s.talking) { s.talking = talking; render(); }
        if (!talking || s.ws.readyState !== 1 || s.ws.bufferedAmount > 65536) return;
        s.ws.send(e.data.pcm);
      };
      s.ws.onmessage = function (ev) { onMessage(s, ev); };
      s.ws.onclose = function (ev) {
        if (session !== s) return;
        teardown();
        setStatus(ev.reason ? ev.reason + '.' : 'Disconnected from the call.', true);
        refresh();
      };
      connecting = '';
      setStatus('');
    } catch (e) {
      session = null;
      connecting = '';
      teardownSession(s);
      var msg = e && e.name === 'NotAllowedError' ? 'Microphone access was blocked. Allow it in your browser and try again.'
        : e && e.name === 'NotFoundError' ? 'No microphone found.'
        : (e && e.message) || 'Could not connect';
      setStatus(msg, true);
      refresh();
    }
  }

  function teardownSession(s) {
    try { if (s.ws) { s.ws.onclose = null; s.ws.close(); } } catch (_) {}
    try { if (s.stream) s.stream.getTracks().forEach(function (t) { t.stop(); }); } catch (_) {}
    try { if (s.ctx) s.ctx.close(); } catch (_) {}
  }
  function teardown() {
    var s = session;
    session = null;
    speakingAt = {};
    if (s) teardownSession(s);
  }

  async function leaveChannel(silent) {
    teardown();
    if (!silent) setStatus('');
    refresh();
  }

  function toggleMute() {
    if (!session) return;
    session.muted = !session.muted;
    if (session.muted) { session.talking = false; session.hang = 0; }
    session.ws.send(JSON.stringify({ muted: session.muted }));
    render();
  }

  window.addEventListener('beforeunload', teardown);

  if (!window.AudioWorkletNode || !navigator.mediaDevices || !window.WebSocket) {
    setStatus('This browser does not support voice calls.', true);
  } else {
    refresh();
    setInterval(refresh, 10000);
    // Redraw the speaking dots when who is talking changes.
    setInterval(function () { if (session && speakingKey() !== speakingNow) render(); }, 150);
  }
})();
</script>
</body>
</html>
