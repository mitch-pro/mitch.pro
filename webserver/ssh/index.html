<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Secure SSH Client - mitch.pro</title>
  <link rel="stylesheet" href="xterm.css" />
  <style>

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: var(--bgr, radial-gradient(circle at 50% 50%, #13141F 0%, #0A0B10 100%));
      color: var(--fg, #E2E8F0);
      font-family: 'Outfit', sans-serif;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
    }

    /* Connection Card container */
    .connect-container {
      width: 100%;
      max-width: 480px;
      padding: 24px;
      z-index: 10;
      transition: all 0.5s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .card {
      background: var(--bg2, rgba(20, 22, 37, 0.7));
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--bd, rgba(255, 255, 255, 0.08));
      border-radius: 16px;
      padding: 32px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
    }

    h2 {
      font-weight: 600;
      font-size: 1.8rem;
      margin-bottom: 8px;
      background: var(--gr, linear-gradient(135deg, #6366F1 0%, #A855F7 100%));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-align: center;
    }

    .subtitle {
      color: var(--fg2, #94A3B8);
      font-size: 0.9rem;
      text-align: center;
      margin-bottom: 28px;
    }

    .form-group {
      margin-bottom: 18px;
    }

    .form-row {
      display: flex;
      gap: 16px;
    }

    .form-row .form-group {
      flex: 1;
    }

    .form-row .form-group.port-group {
      flex: 0 0 100px;
    }

    label {
      display: block;
      font-size: 0.85rem;
      font-weight: 500;
      margin-bottom: 6px;
      color: var(--fg2, #94A3B8);
    }

    input, textarea {
      width: 100%;
      background: var(--bg3, rgba(10, 11, 18, 0.8));
      border: 1px solid var(--bd, rgba(255, 255, 255, 0.1));
      border-radius: 8px;
      padding: 10px 14px;
      color: var(--fg, #F8FAFC);
      font-family: inherit;
      font-size: 0.95rem;
      transition: all 0.3s;
    }

    input:focus, textarea:focus {
      outline: none;
      border-color: var(--ac, #6366F1);
      box-shadow: 0 0 0 3px var(--gls, rgba(99, 102, 241, 0.2));
    }

    textarea {
      resize: vertical;
      min-height: 100px;
      font-family: 'Space Mono', monospace;
      font-size: 0.85rem;
    }

    /* Auth Tabs */
    .tabs {
      display: flex;
      background: var(--bg3, rgba(10, 11, 18, 0.6));
      padding: 4px;
      border-radius: 8px;
      margin-bottom: 20px;
      border: 1px solid var(--bd, rgba(255, 255, 255, 0.05));
    }

    .tab {
      flex: 1;
      text-align: center;
      padding: 8px;
      cursor: pointer;
      border-radius: 6px;
      font-size: 0.9rem;
      font-weight: 500;
      color: var(--fg2, #94A3B8);
      transition: all 0.2s;
    }

    .tab.active {
      background: var(--ac, #6366F1);
      color: #FFFFFF;
      box-shadow: 0 4px 12px var(--gls, rgba(99, 102, 241, 0.3));
    }

    .btn-connect {
      width: 100%;
      background: var(--gr, linear-gradient(135deg, #6366F1 0%, #A855F7 100%));
      color: #FFFFFF;
      border: none;
      border-radius: 8px;
      padding: 12px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s;
      box-shadow: 0 4px 15px var(--gls, rgba(99, 102, 241, 0.3));
      margin-top: 10px;
    }

    .btn-connect:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px var(--gl, rgba(99, 102, 241, 0.4));
    }

    .btn-connect:active {
      transform: translateY(0);
    }

    .status-msg {
      margin-top: 16px;
      font-size: 0.9rem;
      text-align: center;
      min-height: 20px;
      transition: all 0.3s;
    }

    .status-msg.error {
      color: #F87171;
    }

    .status-msg.info {
      color: #60A5FA;
    }

    /* Fullscreen Terminal Container */
    #terminal-container {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: #000000;
      z-index: 5;
      display: none;
      opacity: 0;
      transition: opacity 0.5s ease-in-out;
    }

    #terminal {
      width: 100%;
      height: calc(100% - 36px);
      padding: 8px;
    }

    /* Terminal disconnect bar */
    .term-bar {
      height: 36px;
      background: var(--bg3, #1E293B);
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 16px;
      font-size: 0.85rem;
      color: var(--fg2, #94A3B8);
      border-bottom: 1px solid var(--bd, rgba(255, 255, 255, 0.05));
    }

    .btn-disconnect {
      background: #EF4444;
      color: white;
      border: none;
      padding: 4px 10px;
      border-radius: 4px;
      font-weight: 600;
      cursor: pointer;
      font-size: 0.75rem;
      transition: background 0.2s;
    }

    .btn-disconnect:hover {
      background: #DC2626;
    }

    /* Utility classes */
    .hidden {
      display: none !important;
    }
  </style>
</head>
<body>

  <!-- Connection Form -->
  <div class="connect-container" id="connect-card">
    <div class="card">
      <h2>Web SSH Client</h2>
      <p class="subtitle">Secure terminal proxy</p>

      <form id="connect-form" onsubmit="handleConnect(event)">
        <div class="form-row">
          <div class="form-group">
            <label for="host">Host / IP</label>
            <input type="text" id="host" required placeholder="e.g. 192.168.1.50" value="127.0.0.1">
          </div>
          <div class="form-group port-group">
            <label for="port">Port</label>
            <input type="number" id="port" required value="22">
          </div>
        </div>

        <div class="form-group">
          <label for="username">Username</label>
          <input type="text" id="username" placeholder="root">
        </div>

        <div class="tabs">
          <div class="tab active" id="tab-pass" onclick="setAuthMethod('password')">Password</div>
          <div class="tab" id="tab-key" onclick="setAuthMethod('key')">Private Key</div>
          <div class="tab" id="tab-saved" onclick="setAuthMethod('saved')">Saved Key</div>
        </div>

        <!-- Password input -->
        <div class="form-group" id="group-pass">
          <label for="password">Password</label>
          <input type="password" id="password" placeholder="••••••••">
        </div>

        <!-- Key inputs -->
        <div class="hidden" id="group-key">
          <div class="form-group">
            <label for="private-key">Private Key (PEM format)</label>
            <textarea id="private-key" placeholder="-----BEGIN OPENSSH PRIVATE KEY-----&#10;...&#10;-----END OPENSSH PRIVATE KEY-----"></textarea>
          </div>
          <div class="form-group">
            <label for="passphrase">Passphrase (Optional)</label>
            <input type="password" id="passphrase" placeholder="Key Passphrase">
          </div>
        </div>

        <!-- Saved Key input -->
        <div class="hidden" id="group-saved">
          <div id="saved-key-status-msg" style="font-size: 0.85rem; color: var(--fg2); margin-bottom: 10px; line-height: 1.4;"></div>
          <div class="form-group" id="group-saved-passphrase-container">
            <label for="saved-passphrase">Key Passphrase</label>
            <input type="password" id="saved-passphrase" placeholder="Key Passphrase">
          </div>
        </div>

        <button type="submit" class="btn-connect" id="btn-submit">Connect Session</button>
      </form>

      <div class="status-msg" id="status"></div>

      <hr style="border: 0; border-top: 1px solid var(--bd, rgba(255, 255, 255, 0.08)); margin: 20px 0;">
      <a href="#" onclick="toggleManager(event)" id="btn-toggle-manager" style="display:block; text-align:center; font-size:0.85rem; color:var(--ac, #6366F1); text-decoration:none; font-weight: 500;">⚙️ Manage Saved SSH Keys</a>
      
      <div id="key-manager-panel" class="hidden" style="margin-top: 15px;">
        <div style="background: rgba(0, 0, 0, 0.25); padding: 16px; border-radius: 8px; border: 1px solid var(--bd, rgba(255, 255, 255, 0.05));">
          <h4 style="font-size: 0.95rem; font-weight: 600; margin-bottom: 12px; color: var(--fg);">SSH Key Manager</h4>
          
          <div id="pubkey-info" class="hidden" style="margin-bottom: 12px;">
            <label style="font-size: 0.8rem; display: block; margin-bottom: 4px;">Current Public Key (add to target authorized_keys)</label>
            <textarea readonly id="manager-pubkey" style="min-height: 50px; font-size: 0.75rem; background: var(--bg3); padding: 6px; resize: none;"></textarea>
            <button type="button" onclick="copyPubKey()" style="background: rgba(99, 102, 241, 0.2); border: 1px solid var(--ac); color: var(--fg); padding: 6px 12px; font-size: 0.75rem; border-radius: 4px; margin-top: 6px; cursor: pointer; width: 100%; font-weight: 600; transition: background 0.2s;">Copy Public Key</button>
          </div>

          <div style="display: flex; gap: 8px; margin-bottom: 12px;">
            <button type="button" id="btn-mgr-gen" onclick="setMgrAction('generate')" style="flex: 1; font-size: 0.75rem; padding: 6px; border-radius: 4px; border: 1px solid var(--bd); background: transparent; color: var(--fg2); cursor: pointer; font-weight: 500;">Generate Key</button>
            <button type="button" id="btn-mgr-imp" onclick="setMgrAction('import')" style="flex: 1; font-size: 0.75rem; padding: 6px; border-radius: 4px; border: 1px solid var(--bd); background: transparent; color: var(--fg2); cursor: pointer; font-weight: 500;">Import Key</button>
          </div>

          <!-- Generate Form -->
          <div id="mgr-form-gen" class="hidden">
            <div class="form-group" style="margin-bottom: 10px;">
              <label for="gen-passphrase" style="font-size: 0.8rem; display: block; margin-bottom: 4px;">Key Passphrase</label>
              <input type="password" id="gen-passphrase" placeholder="Passphrase to encrypt generated key" style="padding: 8px 12px; font-size: 0.85rem;">
            </div>
            <button type="button" onclick="generateKey()" class="btn-connect" style="margin-top: 5px; padding: 8px 12px; font-size: 0.85rem;">Generate Ed25519 Key</button>
          </div>

          <!-- Import Form -->
          <div id="mgr-form-imp" class="hidden">
            <div class="form-group" style="margin-bottom: 10px;">
              <label for="imp-key" style="font-size: 0.8rem; display: block; margin-bottom: 4px;">Private Key (PEM format)</label>
              <textarea id="imp-key" placeholder="-----BEGIN OPENSSH PRIVATE KEY-----&#10;...&#10;-----END OPENSSH PRIVATE KEY-----" style="min-height: 80px; font-size: 0.75rem; padding: 6px; font-family: monospace;"></textarea>
            </div>
            <div class="form-group" style="margin-bottom: 10px;">
              <label for="imp-passphrase" style="font-size: 0.8rem; display: block; margin-bottom: 4px;">Passphrase to Encrypt/Verify Key</label>
              <input type="password" id="imp-passphrase" placeholder="Key Passphrase" style="padding: 8px 12px; font-size: 0.85rem;">
            </div>
            <button type="button" onclick="importKey()" class="btn-connect" style="margin-top: 5px; padding: 8px 12px; font-size: 0.85rem;">Save Encrypted Key</button>
          </div>

          <div id="mgr-status" class="status-msg" style="margin-top: 10px; font-size: 0.8rem; min-height: 18px;"></div>
        </div>
      </div>
    </div>
  </div>

  <!-- Terminal Display -->
  <div id="terminal-container">
    <div class="term-bar">
      <span id="term-status">SSH: Connecting...</span>
      <button class="btn-disconnect" onclick="disconnect()">Disconnect</button>
    </div>
    <div id="terminal"></div>
  </div>

  <script src="xterm.js"></script>
  <script src="xterm-addon-fit.js"></script>
  <script>
    let authMethod = 'password';
    let socket = null;
    let term = null;
    let fitAddon = null;

    function setAuthMethod(method) {
      authMethod = method;
      document.getElementById('tab-pass').classList.toggle('active', method === 'password');
      document.getElementById('tab-key').classList.toggle('active', method === 'key');
      document.getElementById('tab-saved').classList.toggle('active', method === 'saved');

      document.getElementById('group-pass').classList.toggle('hidden', method !== 'password');
      document.getElementById('group-key').classList.toggle('hidden', method !== 'key');
      document.getElementById('group-saved').classList.toggle('hidden', method !== 'saved');
    }

    function showStatus(text, type = 'info') {
      const statusEl = document.getElementById('status');
      statusEl.textContent = text;
      statusEl.className = 'status-msg ' + type;
    }

    function isIP(str) {
      const ipv4 = /^(?:[0-9]{1,3}\.){3}[0-9]{1,3}$/;
      const ipv6 = /^[0-9a-fA-F:]+$/;
      return ipv4.test(str) || (str.includes(':') && ipv6.test(str));
    }

    async function resolveDNS(domain) {
      try {
        const resp = await fetch(`https://cloudflare-dns.com/dns-query?name=${encodeURIComponent(domain)}&type=A`, {
          headers: { 'Accept': 'application/dns-json' }
        });
        const data = await resp.json();
        if (data.Answer && data.Answer.length > 0) {
          const aRecord = data.Answer.find(ans => ans.type === 1);
          if (aRecord) return aRecord.data;
        }
      } catch (e) {}

      try {
        const resp = await fetch(`https://cloudflare-dns.com/dns-query?name=${encodeURIComponent(domain)}&type=AAAA`, {
          headers: { 'Accept': 'application/dns-json' }
        });
        const data = await resp.json();
        if (data.Answer && data.Answer.length > 0) {
          const aaaaRecord = data.Answer.find(ans => ans.type === 28);
          if (aaaaRecord) return aaaaRecord.data;
        }
      } catch (e) {}

      throw new Error('Could not resolve hostname to IP');
    }

    async function handleConnect(e) {
      e.preventDefault();
      
      const hostInput = document.getElementById('host').value.trim();
      const port = parseInt(document.getElementById('port').value.trim(), 10) || 22;
      const username = document.getElementById('username').value.trim() || 'root';
      const password = document.getElementById('password').value;
      const privateKey = document.getElementById('private-key').value.trim();
      const passphrase = document.getElementById('passphrase').value;
      const savedPassphrase = document.getElementById('saved-passphrase').value;

      if (!hostInput) {
        showStatus('Please fill in Host.', 'error');
        return;
      }

      if (authMethod === 'saved' && !hasSavedKey) {
        showStatus('No saved SSH key found. Generate or import one below.', 'error');
        return;
      }

      showStatus('Resolving hostname...', 'info');
      document.getElementById('btn-submit').disabled = true;

      let host = hostInput;
      if (!isIP(hostInput)) {
        try {
          host = await resolveDNS(hostInput);
          showStatus(`Resolved to IP: ${host}`, 'info');
        } catch (err) {
          showStatus(err.message, 'error');
          document.getElementById('btn-submit').disabled = false;
          return;
        }
      }

      showStatus('Connecting to proxy...', 'info');

      // Determine correct protocol
      const proto = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
      const wsUrl = `${proto}//${window.location.host}/ssh/ws`;

      try {
        socket = new WebSocket(wsUrl);
      } catch (err) {
        showStatus('WebSocket connection failed: ' + err.message, 'error');
        document.getElementById('btn-submit').disabled = false;
        return;
      }

      socket.onopen = () => {
        showStatus('Proxy connected. Negotiating SSH session...', 'info');

        // Create terminal instance (but keep hidden until successfully connected)
        initTerminal();

        const adminPass = sessionStorage.getItem('admin_passphrase') || '';
        // Send initialization payload
        const payload = {
          type: 'init',
          host,
          port,
          username,
          cols: term.cols,
          rows: term.rows
        };

        if (adminPass) {
          payload.adminPassphrase = adminPass;
        }

        if (authMethod === 'key') {
          payload.privateKey = privateKey;
          if (passphrase) payload.passphrase = passphrase;
        } else if (authMethod === 'saved') {
          payload.useSavedKey = true;
          if (savedPassphrase) payload.passphrase = savedPassphrase;
        } else {
          payload.password = password;
        }

        socket.send(JSON.stringify(payload));
      };

      socket.onmessage = (event) => {
        try {
          const msg = JSON.parse(event.data);
          
          if (msg.type === 'connected') {
            showStatus('SSH Connection Established!', 'info');
            // Hide connection panel, show terminal screen
            document.getElementById('connect-card').style.opacity = '0';
            setTimeout(() => {
              document.getElementById('connect-card').style.display = 'none';
              const termCont = document.getElementById('terminal-container');
              termCont.style.display = 'block';
              setTimeout(() => {
                termCont.style.opacity = '1';
                fitAddon.fit();
                term.focus();
                // Send an initial resize command just to align everything
                socket.send(JSON.stringify({ type: 'resize', cols: term.cols, rows: term.rows }));
              }, 50);
            }, 500);

            document.getElementById('term-status').textContent = `SSH: ${username}@${host}:${port}`;
          } else if (msg.type === 'data') {
            term.write(msg.data);
          } else if (msg.type === 'error') {
            showStatus(msg.message, 'error');
            disconnect();
          }
        } catch (err) {
          console.error('Error handling WebSocket message:', err);
        }
      };

      socket.onclose = (event) => {
        showStatus('Session disconnected.', 'info');
        disconnect();
      };

      socket.onerror = (err) => {
        showStatus('WebSocket error occurred.', 'error');
        disconnect();
      };
    }

    function initTerminal() {
      if (term) return; // Already initialized

      const style = getComputedStyle(document.documentElement);
      const bg = style.getPropertyValue('--bg').trim() || '#000000';
      const fg = style.getPropertyValue('--fg').trim() || '#F8FAFC';
      const ac = style.getPropertyValue('--ac').trim() || '#6366F1';

      term = new Terminal({
        cursorBlink: true,
        fontFamily: '"Space Mono", monospace',
        fontSize: 14,
        theme: {
          background: bg,
          foreground: fg,
          cursor: ac
        }
      });

      fitAddon = new FitAddon.FitAddon();
      term.loadAddon(fitAddon);
      term.open(document.getElementById('terminal'));

      // Forward user inputs to server
      term.onData((data) => {
        if (socket && socket.readyState === WebSocket.OPEN) {
          socket.send(JSON.stringify({ type: 'data', data }));
        }
      });

      // Handle window resizing
      window.addEventListener('resize', () => {
        if (term && fitAddon) {
          fitAddon.fit();
          if (socket && socket.readyState === WebSocket.OPEN) {
            socket.send(JSON.stringify({ type: 'resize', cols: term.cols, rows: term.rows }));
          }
        }
      });
    }

    function disconnect() {
      if (socket) {
        try { socket.close(); } catch (e) {}
        socket = null;
      }

      document.getElementById('btn-submit').disabled = false;

      // Swap UI back to connection form
      const termCont = document.getElementById('terminal-container');
      termCont.style.opacity = '0';
      setTimeout(() => {
        termCont.style.display = 'none';
        
        const connectCard = document.getElementById('connect-card');
        connectCard.style.display = 'block';
        setTimeout(() => {
          connectCard.style.opacity = '1';
        }, 50);

        if (term) {
          term.dispose();
          term = null;
          fitAddon = null;
          document.getElementById('terminal').innerHTML = '';
        }
      }, 500);
    }

    let hasSavedKey = false;
    let savedPubKey = '';

    async function checkSavedKey() {
      try {
        const resp = await fetch('/api/admin/ssh-key');
        if (resp.status === 200) {
          const data = await resp.json();
          if (data.hasKey) {
            hasSavedKey = true;
            savedPubKey = data.publicKey;
            updateSavedKeyUI();
          } else {
            hasSavedKey = false;
            updateSavedKeyUI();
          }
        }
      } catch (e) {
        console.error("Error checking saved key:", e);
      }
    }

    function updateSavedKeyUI() {
      const statusMsg = document.getElementById('saved-key-status-msg');
      const container = document.getElementById('group-saved-passphrase-container');
      const pubkeyInfo = document.getElementById('pubkey-info');
      const managerPubkey = document.getElementById('manager-pubkey');

      if (hasSavedKey) {
        statusMsg.innerHTML = `<span style="color:#8b5cf6; font-weight:600;">✓ Saved Key Found</span><br><span style="font-size:0.75rem; word-break:break-all;">Public Key: ${savedPubKey}</span>`;
        container.classList.remove('hidden');
        pubkeyInfo.classList.remove('hidden');
        managerPubkey.value = savedPubKey;
      } else {
        statusMsg.innerHTML = `<span style="color:#EF4444; font-weight:600;">✗ No Saved Key Found</span><br>Use the manager below to generate or import a key.`;
        container.classList.add('hidden');
        pubkeyInfo.classList.add('hidden');
        managerPubkey.value = '';
      }
    }

    function toggleManager(e) {
      if (e) e.preventDefault();
      const panel = document.getElementById('key-manager-panel');
      const isHidden = panel.classList.contains('hidden');
      panel.classList.toggle('hidden', !isHidden);
      document.getElementById('btn-toggle-manager').textContent = isHidden ? '▲ Hide Key Manager' : '⚙️ Manage Saved SSH Keys';
      if (isHidden) {
        checkSavedKey();
      }
    }

    let mgrAction = 'generate';
    function setMgrAction(action) {
      mgrAction = action;
      document.getElementById('btn-mgr-gen').style.background = action === 'generate' ? 'var(--ac)' : 'transparent';
      document.getElementById('btn-mgr-gen').style.color = action === 'generate' ? 'white' : 'var(--fg2)';
      document.getElementById('btn-mgr-imp').style.background = action === 'import' ? 'var(--ac)' : 'transparent';
      document.getElementById('btn-mgr-imp').style.color = action === 'import' ? 'white' : 'var(--fg2)';

      document.getElementById('mgr-form-gen').classList.toggle('hidden', action !== 'generate');
      document.getElementById('mgr-form-imp').classList.toggle('hidden', action !== 'import');
    }

    function showMgrStatus(text, type = 'info') {
      const el = document.getElementById('mgr-status');
      el.textContent = text;
      el.className = 'status-msg ' + type;
    }

    async function generateKey() {
      const passphrase = document.getElementById('gen-passphrase').value;
      if (!passphrase) {
        showMgrStatus('Passphrase is required to encrypt key pair.', 'error');
        return;
      }
      showMgrStatus('Generating key pair...', 'info');
      try {
        const resp = await fetch('/api/admin/ssh-key/generate', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ passphrase })
        });
        const data = await resp.json();
        if (resp.status === 200) {
          showMgrStatus('Key pair generated and saved successfully!', 'info');
          document.getElementById('gen-passphrase').value = '';
          await checkSavedKey();
        } else {
          showMgrStatus(data.error || 'Failed to generate key pair.', 'error');
        }
      } catch (err) {
        showMgrStatus(err.message, 'error');
      }
    }

    async function importKey() {
      const privateKey = document.getElementById('imp-key').value;
      const passphrase = document.getElementById('imp-passphrase').value;
      if (!privateKey) {
        showMgrStatus('Private key is required.', 'error');
        return;
      }
      if (!passphrase) {
        showMgrStatus('Passphrase is required to secure the key.', 'error');
        return;
      }
      showMgrStatus('Importing key...', 'info');
      try {
        const resp = await fetch('/api/admin/ssh-key/save', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ privateKey, passphrase })
        });
        const data = await resp.json();
        if (resp.status === 200) {
          showMgrStatus('Key imported and secured successfully!', 'info');
          document.getElementById('imp-key').value = '';
          document.getElementById('imp-passphrase').value = '';
          await checkSavedKey();
        } else {
          showMgrStatus(data.error || 'Failed to import key.', 'error');
        }
      } catch (err) {
        showMgrStatus(err.message, 'error');
      }
    }

    function copyPubKey() {
      const el = document.getElementById('manager-pubkey');
      el.select();
      document.execCommand('copy');
      alert('Public key copied to clipboard!');
    }

    // Run check on load
    window.addEventListener('DOMContentLoaded', () => {
      checkSavedKey();
      setMgrAction('generate');

      // Auto-fill parameters from URL search query if provided
      const urlParams = new URLSearchParams(window.location.search);
      const hostParam = urlParams.get('host');
      const userParam = urlParams.get('username');
      const portParam = urlParams.get('port');
      const authParam = urlParams.get('auth');
      const connectParam = urlParams.get('connect');

      if (hostParam) {
        document.getElementById('host').value = hostParam;
      }
      if (userParam) {
        document.getElementById('username').value = userParam;
      }
      if (portParam) {
        document.getElementById('port').value = portParam;
      }
      const passParam = urlParams.get('password');
      if (passParam) {
        document.getElementById('password').value = passParam;
      }
      if (authParam) {
        setAuthMethod(authParam);
      }
      if (connectParam === 'true' || connectParam === '1') {
        setTimeout(() => {
          const form = document.getElementById('connect-form');
          if (form) {
            if (typeof form.requestSubmit === 'function') {
              form.requestSubmit();
            } else {
              form.dispatchEvent(new Event('submit'));
            }
          }
        }, 500);
      }
    });
  </script>
</body>
</html>
