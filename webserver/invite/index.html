<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Invite Friends — mitch.pro</title>
  <meta name="description" content="Invite friends to mitch.pro and earn 2,000 MitchCoins for every signup.">
  <link rel="stylesheet" href="/app.css">
  <script src="/api.js"></script>
  <script src="/app-shell.js" defer></script>
  <style>
    .invite-shell {
      max-width: 42rem;
    }

    .page-head {
      margin-bottom: 1.25rem;
      max-width: 38rem;
      animation: app-fade-in 0.45s ease both;
    }

    .page-head h1 {
      margin: 0;
      font-size: clamp(1.85rem, 4vw, 2.55rem);
      font-weight: 800;
      letter-spacing: -0.035em;
    }

    .page-sub {
      margin: 0.55rem 0 0;
      color: var(--t-fg2);
      font-size: 0.92rem;
      line-height: 1.55;
    }

    .wrap {
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
      animation: app-fade-in 0.55s ease 0.06s both;
    }

    .card {
      padding: 1.2rem 1.15rem;
      border: 1px solid var(--t-bd);
      border-radius: var(--t-radius);
      background: var(--t-bg2);
    }

    .card-title {
      font-family: inherit;
      font-size: 0.95rem;
      font-weight: 750;
      color: var(--t-fg);
      margin: 0 0 1rem;
      letter-spacing: -0.02em;
    }

    .stat-row {
      display: flex;
      gap: 0.65rem;
      margin-bottom: 1.15rem;
    }

    .stat-box {
      flex: 1;
      background: var(--t-bg3);
      border: 1px solid var(--t-bd);
      border-radius: var(--t-radius);
      padding: 0.9rem;
      text-align: center;
    }

    .stat-num {
      font-family: inherit;
      font-size: 1.75rem;
      color: var(--t-ac);
      font-weight: 800;
      letter-spacing: -0.03em;
    }

    .stat-label {
      font-size: 0.7rem;
      color: var(--t-fg2);
      font-weight: 700;
      margin-top: 0.2rem;
    }

    label {
      display: block;
      font-size: 0.78rem;
      font-weight: 600;
      color: var(--t-fg2);
      margin-bottom: 0.4rem;
    }

    .card > p {
      font-size: 0.85rem;
      color: var(--t-fg2);
      margin: 0 0 1rem;
      line-height: 1.5;
    }

    .code-display {
      display: flex;
      align-items: center;
      gap: 0.65rem;
      background: var(--t-bg3);
      border: 1px solid var(--t-bd);
      border-radius: var(--t-radius);
      padding: 0.85rem 0.95rem;
      font-family: inherit;
      font-size: 1.35rem;
      font-weight: 800;
      color: var(--t-ac);
      letter-spacing: 0.1em;
    }

    .code-display .code-text { flex: 1; min-width: 0; word-break: break-all; }

    .copy-btn {
      appearance: none;
      background: transparent;
      border: 1px solid var(--t-bd);
      color: var(--t-fg2);
      padding: 0.35rem 0.75rem;
      border-radius: var(--t-radius-sm);
      font-size: 0.78rem;
      font-weight: 700;
      cursor: pointer;
      font-family: inherit;
      transition:
        border-color var(--t-motion, 0.15s) ease,
        background var(--t-motion, 0.15s) ease,
        color var(--t-motion, 0.15s) ease;
    }

    .copy-btn:hover {
      border-color: var(--t-ac);
      color: var(--t-fg);
      background: color-mix(in srgb, var(--t-ac) 10%, transparent);
    }

    .copy-btn.copied {
      color: var(--t-ac);
      border-color: var(--t-ac);
    }

    .link-display {
      margin-top: 0.75rem;
      background: var(--t-bg3);
      border: 1px solid var(--t-bd);
      border-radius: var(--t-radius);
      padding: 0.75rem 0.85rem;
      font-size: 0.78rem;
      color: var(--t-fg2);
      word-break: break-all;
      display: flex;
      align-items: flex-start;
      gap: 0.65rem;
    }

    .link-display .link-text { flex: 1; }

    input[type="text"],
    input[type="email"] {
      width: 100%;
      background: var(--t-bg2);
      border: 1px solid var(--t-bd);
      color: var(--t-fg);
      border-radius: var(--t-radius);
      padding: 0.7rem 0.85rem;
      font-size: 0.92rem;
      font-family: inherit;
      outline: none;
      transition:
        border-color var(--t-motion, 0.15s) ease,
        box-shadow var(--t-motion, 0.15s) ease;
    }

    input:focus {
      border-color: var(--t-ac);
      box-shadow: 0 0 0 3px var(--t-gls, transparent);
    }

    .btn {
      width: 100%;
      appearance: none;
      border: 1px solid transparent;
      border-radius: var(--t-radius);
      padding: 0.7rem 1.1rem;
      min-height: 2.55rem;
      font-weight: 700;
      font-size: 0.9rem;
      cursor: pointer;
      font-family: inherit;
      margin-top: 0.85rem;
      transition:
        background var(--t-motion, 0.15s) ease,
        box-shadow var(--t-motion, 0.15s) ease,
        transform 0.12s ease,
        opacity var(--t-motion, 0.15s) ease;
    }

    .btn:active { transform: scale(0.98); }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }

    .btn-primary {
      background: var(--t-ac);
      color: var(--t-ac-ink);
      border-color: var(--t-bda, transparent);
    }

    .btn-primary:hover:not(:disabled) {
      background: var(--t-ac);
      box-shadow: 0 0 0 3px var(--t-gls, transparent);
    }

    .btn-gold {
      background: var(--t-ac);
      color: var(--t-ac-ink);
      border-color: var(--t-bda, transparent);
    }

    .btn-gold:hover:not(:disabled) {
      filter: brightness(1.05);
    }

    .msg {
      min-height: 1.2em;
      font-size: 0.85rem;
      font-weight: 600;
      margin-top: 0.65rem;
      text-align: center;
      color: var(--t-fg2);
    }

    .msg.ok { color: var(--t-ac); }
    .msg.err { color: #f87171; }
    html.theme-light .msg.err { color: #b91c1c; }

    .premium-lock {
      background: var(--t-bg3);
      border: 1px solid var(--t-bd);
      border-radius: var(--t-radius);
      padding: 0.85rem 1rem;
      font-size: 0.85rem;
      color: var(--t-fg2);
      line-height: 1.45;
    }

    .premium-lock a { color: var(--t-ac); font-weight: 700; }

    #invite-email-wrap { margin-top: 0.85rem; }

    @media (max-width: 600px) {
      .stat-row { flex-direction: column; }
    }

    @media (prefers-reduced-motion: reduce) {
      .page-head, .wrap { animation: none !important; }
      .btn, .copy-btn, input { transition: none !important; }
    }

    .theme-no-motion .page-head,
    .theme-no-motion .wrap,
    .theme-no-motion .btn,
    .theme-no-motion .copy-btn {
      animation: none !important;
      transition: none !important;
    }
  </style>
</head>
<body class="app-shell">
  <main class="app-main invite-shell">
    <header class="page-head">
      <h1>Invite Friends</h1>
      <p class="page-sub">You earn 2,000 MitchCoins when someone signs up with your link and verifies their email.</p>
    </header>

    <div class="wrap">
      <div class="card">
        <div class="card-title">Stats</div>
        <div class="stat-row">
          <div class="stat-box">
            <div class="stat-num" id="stat-signups">—</div>
            <div class="stat-label">Signups</div>
          </div>
          <div class="stat-box">
            <div class="stat-num" id="stat-coins">—</div>
            <div class="stat-label">Coins earned</div>
          </div>
        </div>

        <label for="code-text">Invite code</label>
        <div class="code-display">
          <span class="code-text" id="code-text">Loading…</span>
          <button class="copy-btn" id="copy-code-btn" onclick="copyCode()">Copy</button>
        </div>

        <div class="link-display">
          <span class="link-text" id="link-text">Loading your invite link…</span>
          <button class="copy-btn" id="copy-link-btn" onclick="copyLink()">Copy</button>
        </div>
      </div>

      <div class="card" id="custom-code-card">
        <div class="card-title">Custom code</div>
        <div id="premium-content" style="display:none;">
          <label for="custom-code-input">New code (3–20 letters or numbers)</label>
          <input type="text" id="custom-code-input" maxlength="20" oninput="this.value=this.value.toUpperCase().replace(/[^A-Z0-9]/g,'')">
          <button class="btn btn-gold" id="set-code-btn" onclick="setCode()">Set Custom Code</button>
          <div class="msg" id="code-msg" role="status" aria-live="polite"></div>
        </div>
        <div id="premium-lock-content">
          <div class="premium-lock">
            Custom codes require <a href="/shop/">Premium</a>.
          </div>
        </div>
      </div>

      <div class="card">
        <div class="card-title">Email an invite</div>
        <label for="invite-to">Friend's email</label>
        <input type="email" id="invite-to">
        <button class="btn btn-primary" id="send-btn" onclick="sendInvite()">Send Invite Email</button>
        <div class="msg" id="send-msg" role="status" aria-live="polite"></div>
      </div>

    </div>
  </main>

  <script>
    var myCode = '';
    var myEmail = '';

    async function loadData() {
      try {
        const res = await fetch('/api/invite/my-code', { credentials: 'include' });
        if (res.status === 401) {
          document.getElementById('code-text').textContent = 'Sign in to get your code';
          document.getElementById('link-text').textContent = 'You need to be signed in to use invites.';
          return;
        }
        const d = await res.json();
        if (!d.success) throw new Error('load');

        myCode = d.code;
        myEmail = d.email || '';

        document.getElementById('code-text').textContent = d.code;
        document.getElementById('stat-signups').textContent = d.signups;
        document.getElementById('stat-coins').textContent = (d.signups * 2000).toLocaleString();

        const baseLink = `https://mitchdog.com/enroll?ref=${encodeURIComponent(d.code)}`;
        document.getElementById('link-text').textContent = baseLink;

        if (d.isPremium) {
          document.getElementById('premium-content').style.display = 'block';
          document.getElementById('premium-lock-content').style.display = 'none';
        }
      } catch(e) {
        document.getElementById('code-text').innerHTML = 'Could not load. <a href="#" id="retry-invite">Retry</a>';
        document.getElementById('link-text').textContent = '';
        document.getElementById('retry-invite').addEventListener('click', function (ev) {
          ev.preventDefault();
          document.getElementById('code-text').textContent = 'Loading…';
          loadData();
        });
      }
    }

    function flashCopy(btn, text) {
      btn.textContent = text;
      btn.classList.toggle('copied', text === 'Copied!');
      setTimeout(() => { btn.textContent = 'Copy'; btn.classList.remove('copied'); }, 2000);
    }

    function copyText(text, btn) {
      if (!text || !navigator.clipboard) { flashCopy(btn, 'Copy failed'); return; }
      navigator.clipboard.writeText(text).then(() => flashCopy(btn, 'Copied!'), () => flashCopy(btn, 'Copy failed'));
    }

    function copyCode() { copyText(myCode, document.getElementById('copy-code-btn')); }

    function copyLink() { copyText(myCode ? document.getElementById('link-text').textContent : '', document.getElementById('copy-link-btn')); }

    async function setCode() {
      const input = document.getElementById('custom-code-input').value.trim();
      const msg = document.getElementById('code-msg');
      const btn = document.getElementById('set-code-btn');
      if (btn.disabled) return;
      if (!input || input.length < 3) { msg.className='msg err'; msg.textContent='Code must be at least 3 characters.'; return; }
      btn.disabled = true;
      msg.className = 'msg'; msg.textContent = 'Saving…';
      btn.textContent = 'Saving…';
      try {
        const res = await fetch('/api/invite/set-code', {
          method: 'POST',
          credentials: 'include',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ code: input })
        });
        const d = await res.json();
        if (d.success) {
          myCode = d.code;
          document.getElementById('code-text').textContent = d.code;
          document.getElementById('link-text').textContent = `https://mitchdog.com/enroll?ref=${encodeURIComponent(d.code)}`;
          msg.className = 'msg ok'; msg.textContent = '✓ Code updated!';
        } else {
          msg.className = 'msg err'; msg.textContent = d.error || 'Failed to set code.';
        }
      } catch(e) { msg.className = 'msg err'; msg.textContent = 'Could not reach the server. Try again.'; }
      btn.disabled = false;
      btn.textContent = 'Set Custom Code';
    }

    async function sendInvite() {
      const to = document.getElementById('invite-to').value.trim();
      const msg = document.getElementById('send-msg');
      const btn = document.getElementById('send-btn');
      if (btn.disabled) return;
      if (!to) { msg.className='msg err'; msg.textContent='Enter an email address.'; return; }
      btn.disabled = true;
      msg.className = 'msg'; msg.textContent = 'Sending…';
      btn.textContent = 'Sending…';
      try {
        const res = await fetchWithRetry('/api/invite/send', {
          method: 'POST',
          credentials: 'include',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ to })
        }, () => { msg.textContent = 'Sending… retrying connection…'; });
        const d = await res.json();
        if (res.status === 429) {
          msg.className = 'msg err';
          msg.textContent = 'Slow down — you can send up to 5 invites per hour.';
        } else if (d.success) {
          msg.className = 'msg ok';
          msg.textContent = d.alreadySent
            ? '✓ Invite sent again (they already received one before).'
            : '✓ Invite sent! They\'ll get an email with your link.';
          document.getElementById('invite-to').value = '';
        } else {
          msg.className = 'msg err'; msg.textContent = d.error || 'Failed to send.';
        }
      } catch(e) { msg.className = 'msg err'; msg.textContent = 'Could not reach the server. Try again.'; }
      btn.disabled = false;
      btn.textContent = 'Send Invite Email';
    }

    ['custom-code-input', 'invite-to'].forEach(function (id) {
      var el = document.getElementById(id);
      if (el) el.addEventListener('keydown', function (e) {
        if (e.key === 'Enter') { e.preventDefault(); (id === 'invite-to' ? sendInvite : setCode)(); }
      });
    });

    loadData();
  </script>
  <script src="/cookie-consent.js" defer></script>
</body>
</html>
