<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>a:b iframe launcher — mitch.pro</title>
  <link rel="stylesheet" href="/app.css">
  <script src="/api.js"></script>
  <script src="/app-shell.js" defer></script>
  <style>
    .ab-page {
      position: relative;
      isolation: isolate;
    }

    .ab-page::before {
      content: '';
      position: fixed;
      inset: 0;
      z-index: -1;
      pointer-events: none;
      background:
        radial-gradient(ellipse 65% 45% at 50% -8%, color-mix(in srgb, var(--t-ac) 14%, transparent), transparent 70%),
        radial-gradient(ellipse 40% 35% at 100% 100%, color-mix(in srgb, var(--t-ac2, var(--t-ac)) 7%, transparent), transparent 65%);
    }

    .ab-shell {
      width: min(40rem, 100%);
      max-width: 40rem;
    }

    .page-head {
      margin-bottom: 1.15rem;
      animation: app-fade-in 0.45s ease both;
    }

    .page-head h1 {
      margin: 0;
      font-size: clamp(1.85rem, 4vw, 2.4rem);
      font-weight: 800;
      letter-spacing: -0.035em;
    }

    .page-sub {
      margin: 0.5rem 0 0;
      color: var(--t-fg2);
      font-size: 0.9rem;
      line-height: 1.55;
    }

    .stack {
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
      animation: app-fade-in 0.55s ease 0.06s both;
    }

    .section {
      padding: 1.15rem 1.1rem;
      background:
        linear-gradient(160deg, color-mix(in srgb, var(--t-bg2) 92%, transparent), color-mix(in srgb, var(--t-bg3) 80%, transparent));
      border: 1px solid var(--t-bd);
      border-radius: calc(var(--t-radius, 8px) + 2px);
      box-shadow: 0 1px 0 color-mix(in srgb, #fff 6%, transparent) inset;
    }

    .section h2 {
      margin: 0 0 0.85rem;
      font-size: 1rem;
      font-weight: 750;
      letter-spacing: -0.02em;
      color: var(--t-fg);
    }

    .field-stack {
      display: flex;
      flex-direction: column;
      gap: 0.65rem;
    }

    .btn-row {
      display: flex;
      flex-wrap: wrap;
      gap: 0.45rem;
    }

    input,
    textarea {
      width: 100%;
      max-width: 100%;
      padding: 0.65rem 0.85rem;
      font-size: 0.92rem;
      background: var(--t-bg2);
      color: var(--t-fg);
      border: 1px solid var(--t-bd);
      border-radius: var(--t-radius, 8px);
      font-family: inherit;
      transition:
        border-color var(--t-motion, 0.15s) ease,
        box-shadow var(--t-motion, 0.15s) ease;
    }

    input:focus,
    textarea:focus {
      outline: none;
      border-color: var(--t-ac);
      box-shadow: 0 0 0 3px var(--t-gls, transparent);
    }

    textarea {
      min-height: 6.5rem;
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 0.82rem;
      line-height: 1.45;
      resize: vertical;
    }

    button {
      appearance: none;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 2.35rem;
      padding: 0.5rem 0.95rem;
      font-size: 0.86rem;
      cursor: pointer;
      background: var(--t-bg2);
      color: var(--t-fg);
      border: 1px solid var(--t-bd);
      border-radius: var(--t-radius, 8px);
      font-family: inherit;
      font-weight: 650;
      transition:
        background var(--t-motion, 0.15s) ease,
        border-color var(--t-motion, 0.15s) ease,
        color var(--t-motion, 0.15s) ease,
        box-shadow var(--t-motion, 0.15s) ease,
        transform 0.12s ease;
    }

    button:hover {
      border-color: color-mix(in srgb, var(--t-bd) 70%, var(--t-ac) 30%);
      background: var(--t-bg3);
      color: var(--t-fg);
    }

    button:active { transform: scale(0.97); }

    #urlList {
      display: flex;
      flex-direction: column;
      gap: 0.35rem;
    }

    #urlList div {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.65rem;
      padding: 0.45rem 0.65rem;
      border: 1px solid var(--t-bd);
      border-radius: calc(var(--t-radius, 8px) - 2px);
      background: color-mix(in srgb, var(--t-bg3) 55%, transparent);
      color: var(--t-fg2);
      font-size: 0.84rem;
      word-break: break-all;
    }

    #urlList button {
      min-height: 1.9rem;
      padding: 0.25rem 0.6rem;
      font-size: 0.75rem;
      flex-shrink: 0;
    }

    @media (prefers-reduced-motion: reduce) {
      .page-head, .stack { animation: none !important; }
      button, input, textarea { transition: none !important; }
    }

    .theme-no-motion .page-head,
    .theme-no-motion .stack,
    .theme-no-motion button {
      animation: none !important;
      transition: none !important;
    }
  </style>
</head>
<body class="ab-page">
  <main class="app-main ab-shell">
    <header class="page-head">
      <h1>a:b iframe launcher</h1>
      <p class="page-sub">Build a multi-URL launch link, then open targets in blank tabs.</p>
    </header>

    <div class="stack">
      <div class="section" id="builder">
        <h2>URL Builder</h2>
        <div class="field-stack">
          <input id="urlInput" type="text" placeholder="Enter URL">
          <div class="btn-row">
            <button id="addBtn" type="button">Add URL</button>
            <button id="clearBtn" type="button">Clear All</button>
          </div>
          <div id="urlList"></div>
          <textarea id="generatedUrl" readonly placeholder="Generated URL will appear here..."></textarea>
          <div class="btn-row">
            <button id="copyBtn" type="button">Copy URL</button>
            <button id="useBtn" type="button">Use This URL</button>
          </div>
        </div>
      </div>

      <div class="section" id="launcher">
        <h2>Launch</h2>
        <div class="field-stack">
          <input id="url" type="text" placeholder="https://example.com or paste generated URL">
          <div class="btn-row">
            <button id="openBtn" type="button">Open</button>
          </div>
        </div>
      </div>
    </div>
  </main>

  <script>
    const urls = [];
    const urlInput = document.getElementById('urlInput');
    const urlList = document.getElementById('urlList');
    const generatedUrl = document.getElementById('generatedUrl');

    function updateBuilder() {
      urlList.innerHTML = '';
      urls.forEach((url, i) => {
        const div = document.createElement('div');
        div.innerHTML = `${i + 1}. ${url} <button onclick="removeUrl(${i})">Remove</button>`;
        urlList.appendChild(div);
      });

      if (urls.length > 0) {
        const params = new URLSearchParams();
        urls.forEach((url, i) => params.set(`url${i + 1}`, url));
        generatedUrl.value = `${window.location.origin}${window.location.pathname}?${params.toString()}`;
      } else {
        generatedUrl.value = '';
      }
    }

    window.removeUrl = (i) => {
      urls.splice(i, 1);
      updateBuilder();
    };

    document.getElementById('addBtn').onclick = () => {
      const url = urlInput.value.trim();
      if (!url) return alert('Enter a URL!');
      if (urls.length >= 5) return alert('Max 5 URLs!');
      urls.push(url);
      urlInput.value = '';
      updateBuilder();
    };

    document.getElementById('clearBtn').onclick = () => {
      urls.length = 0;
      updateBuilder();
    };

    document.getElementById('copyBtn').onclick = () => {
      if (!generatedUrl.value) return alert('No URL to copy!');
      generatedUrl.select();
      document.execCommand('copy');
      alert('Copied!');
    };

    document.getElementById('useBtn').onclick = () => {
      if (!generatedUrl.value) return alert('No URL to use!');
      document.getElementById('url').value = generatedUrl.value;
    };

    const url1 = new URLSearchParams(window.location.search).get('url1') ?? "";
    const url2 = new URLSearchParams(window.location.search).get('url2') ?? "";
    const url3 = new URLSearchParams(window.location.search).get('url3') ?? "";
    const url4 = new URLSearchParams(window.location.search).get('url4') ?? "";
    const url5 = new URLSearchParams(window.location.search).get('url5') ?? "";

    function openBlank(target) {
      if (!target) return alert("Enter a URL first!");
      target = target.trim();
      if (!/^https?:\/\//i.test(target)) target = 'https://' + target;
      const w = window.open("", "_blank", "width=1000,height=700");
      if (!w) return alert("Popup blocked! Allow popups for this site.");
      const html = `<!doctype html>
<html>
<head>
  <title>New Tab</title>
  <link rel="icon" type="image/svg" href="https://www.google.com/chrome/static/images/chrome-logo_112px.svg">
  <meta charset="utf-8">
  <style>
    html,body{margin:0;padding:0;height:100%;overflow:hidden;background:#000}
    iframe{border:0;width:100%;height:100%;display:block}
  </style>
</head>
<body><iframe src="${target}" allowfullscreen allow="fullscreen; autoplay; clipboard-read; clipboard-write; encrypted-media"></iframe></body>
</html>`;
      w.document.open();
      w.document.write(html);
      w.document.close();
    }

    document.getElementById('openBtn').onclick = () => {
      openBlank(document.getElementById('url').value.trim());
    };

    document.getElementById('url').onkeydown = (e) => {
      if (e.key === 'Enter') openBlank(document.getElementById('url').value.trim());
    };

    if (url1) {
      const autoUrls = [url1, url2, url3, url4, url5].filter(u => u);
      autoUrls.forEach(openBlank);
      setTimeout(() => window.open('', '_self').close(), 500);
    }
  </script>
<script src="/cookie-consent.js" defer></script>

</body>
</html>
