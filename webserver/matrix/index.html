  <body class="matrix-page mitch-design" style="height: 100%; margin: 0;">

    <!-- Mitch.pro SSO Connect Banner -->
    <div id="mitch-sso-banner">
      <span id="mitch-sso-msg">Connect your Mitch.pro account to chat</span>

    <script>
      window.global ||= window;

      // ── Clean up and prevent Element Web auto-updater reload loop ──
      try {
        if (window.location.search && window.location.search.includes('updated=')) {
          const cleanUrl = new URL(window.location.href);
          cleanUrl.searchParams.delete('updated');
          window.history.replaceState(null, '', cleanUrl.pathname + cleanUrl.search + cleanUrl.hash);
        }
      } catch (_) {}

      (function() {
        const origFetch = window.fetch;
        if (typeof origFetch === 'function') {
          window.fetch = function(input, init) {
            try {
              const urlStr = typeof input === 'string' ? input : (input && input.url ? input.url : '');
              if (urlStr === 'version' || urlStr === '/matrix/version' || urlStr.endsWith('/version')) {
                return Promise.resolve(new Response('v1.12.28\n', {
                  status: 200,
                  headers: { 'Content-Type': 'text/plain; charset=utf-8' }
                }));
              }
            } catch (_) {}
            return origFetch.apply(this, arguments);
          };
        }
      })();

      // ── Synchronize Element Dark/Light Theme with theme.js ────────
      (function() {
        function getSiteThemeMode() {
          try {
            const m = document.cookie.match(/(?:^|; )theme=([^;]+)/);
            if (m) {
              const v = decodeURIComponent(m[1]).toLowerCase();
              if (v === 'light' || v === 'daylight' || v === 'paper' || v === 'arctic' || v === 'blossom') return 'light';
              return 'dark';
            }
          } catch (_) {}
          if (window.__theme && typeof window.__theme.get === 'function') {
            return window.__theme.get() === 'light' ? 'light' : 'dark';
          }
          return document.documentElement.classList.contains('theme-light') ? 'light' : 'dark';
        }

        function applyElementTheme(mode) {
          const isLight = mode === 'light';
          document.documentElement.classList.toggle('theme-light', isLight);
          document.documentElement.style.colorScheme = isLight ? 'light' : 'dark';
          const links = document.querySelectorAll('link[data-mx-theme]');
          links.forEach(l => {
            const title = (l.getAttribute('title') || '').toLowerCase();
            if (isLight && title === 'light') {
              l.removeAttribute('disabled');
            } else if (!isLight && title === 'dark') {
              l.removeAttribute('disabled');
            } else {
              l.setAttribute('disabled', 'disabled');
            }
          });
          try {
            localStorage.setItem('mx_theme', isLight ? 'Light' : 'Dark');
          } catch (_) {}
          const metaTheme = document.querySelector('meta[name="theme-color"]');
          if (metaTheme) metaTheme.setAttribute('content', isLight ? '#f6f8fa' : '#15171b');
        }

        const initialMode = getSiteThemeMode();
        applyElementTheme(initialMode);

        window.addEventListener('themechange', function(e) {
          const detail = e && e.detail ? String(e.detail).toLowerCase() : '';
          const nextMode = (detail === 'light') ? 'light' : (detail === 'dark' ? 'dark' : getSiteThemeMode());
          applyElementTheme(nextMode);
        });

        window.addEventListener('storage', function(e) {
          if (e.key === 'theme' || e.key === 'theme_mode') {
            applyElementTheme(getSiteThemeMode());
          }
        });
      })();

      // ── Mitch.pro Single Sign-On (SSO) & Bootstrapping ────────────
      (function() {
        const banner = document.getElementById("mitch-sso-banner");
        const MATRIX_STORE_RECOVERY_KEY = 'mitch_matrix_store_recovery_v1';
        const MATRIX_DATABASES = [
          'account',
          'matrix-js-sdk:web-sync-store',
          'crypto-store',
          'matrix-js-sdk:crypto',
          'matrix-js-sdk::matrix-sdk-crypto',
          'matrix-js-sdk::matrix-sdk-crypto-meta',
          'matrix-react-sdk'
        ];
        let matrixStoreRecoveryStarted = false;

        function isMatrixStoreAccountMismatch(value) {
          const message = String(value?.message || value || '');
          return /account in the store doesn't match the account in the constructor|storage inconsistency|StorageManager consistency check failed|Missing session data|storage_evicted/i.test(message);
        }

        function beginMatrixStoreRecovery() {
          if (matrixStoreRecoveryStarted) return;
          matrixStoreRecoveryStarted = true;
          localStorage.setItem(MATRIX_STORE_RECOVERY_KEY, '1');
          setTimeout(() => window.location.reload(), 50);
        }

        window.addEventListener('error', event => {
          if (isMatrixStoreAccountMismatch(event.error || event.message)) beginMatrixStoreRecovery();
        });
        window.addEventListener('unhandledrejection', event => {
          if (isMatrixStoreAccountMismatch(event.reason)) beginMatrixStoreRecovery();
        });

        // Recover only from a confirmed store/account mismatch. Verification and
        // encryption recovery must remain explicit user decisions in Element.
        new MutationObserver(mutations => {
          for (const mutation of mutations) {
            for (const node of mutation.addedNodes) {
              const message = node.nodeType === Node.TEXT_NODE ? node.nodeValue : (node.textContent || '');
              if (isMatrixStoreAccountMismatch(message)) {
                console.warn('[Matrix Storage] Storage error detected in DOM:', message.slice(0, 100));
                localStorage.removeItem("mx_crypto_initialised");
                localStorage.removeItem("mx_has_pickle_key");
                beginMatrixStoreRecovery();
                return;
              }
            }
          }

        }).observe(document.documentElement, { childList: true, subtree: true });

        // Listen for user clicks on "Remove this device" or "Sign out" inside error dialogs
        document.addEventListener('click', function(e) {
          const btn = e.target && e.target.closest && e.target.closest('button');
          if (btn && (/remove this device/i.test(btn.textContent) || /sign out/i.test(btn.textContent))) {
            const dialog = btn.closest('.mx_Dialog, .mx_ErrorDialog, [role="dialog"]');
            if (dialog && /missing session data|storage/i.test(dialog.textContent)) {
              console.log('[Matrix Storage] User clicked Remove this device. Performing clean store reset.');
              beginMatrixStoreRecovery();
            }
          }
        }, true);

        // Graceful fallback for broken avatar images: hide broken <img> so the styled initial avatar displays
        window.addEventListener('error', function(e) {
          const target = e.target;
          if (target && target.tagName === 'IMG') {
            const isAvatar = target.classList.contains('mx_BaseAvatar_image') ||
              target.classList.contains('_image_va14e_43') ||
              target.closest('.mx_BaseAvatar') ||
              target.closest('._triggerButton_dh4sb_100') ||
              target.closest('._avatar_va14e_8') ||
              target.closest('[class*="avatar"]') ||
              target.closest('[class*="Avatar"]');
            if (isAvatar) {
              target.classList.add('broken-avatar');
              target.style.display = 'none';
              const parent = target.parentElement;
              if (parent) {
                parent.classList.add('avatar-img-failed');
                // Ensure initial element is visible
                const initial = parent.querySelector('.mx_BaseAvatar_initial, [class*="_avatar-imageless_"]');
                if (initial) {
                  initial.style.display = 'flex';
                  initial.style.visibility = 'visible';
                  initial.style.opacity = '1';
                }
              }
            }
          }
        }, true);

        function bootElement() {
          if (window.__elementLoaded) return;
          window.__elementLoaded = true;
          const script = document.createElement("script");
          script.src = "/matrix/bundles/156d536ae79bdae0c801/bundle.js";
          document.body.appendChild(script);
        }

        function readStoredSession() {
          return {
            token: localStorage.getItem("mx_access_token") || '',
            userId: localStorage.getItem("mx_user_id") || '',
            deviceId: localStorage.getItem("mx_device_id") || ''
          };
        }

        function clearStoredSession() {
          for (const key of [
            'mx_access_token', 'mx_device_id', 'mx_user_id', 'mx_hs_url', 'mx_has_access_token', 'mx_is_guest',
            'mx_crypto_initialised', 'mx_has_pickle_key', 'mx_soft_logout', 'must_verify_device', 'mx_fresh_login',
            'mx_has_refresh_token', 'mx_refresh_token',
            'cinny_access_token', 'cinny_device_id', 'cinny_user_id', 'cinny_hs_base_url'
          ]) {
            localStorage.removeItem(key);
          }
        }

        function deleteMatrixDatabase(name) {
          return new Promise(resolve => {
            let settled = false;
            const finish = result => {
              if (settled) return;
              settled = true;
              resolve(result);
            };
            try {
              const request = indexedDB.deleteDatabase(name);
              request.onsuccess = () => finish(true);
              request.onerror = () => finish(false);
              request.onblocked = () => setTimeout(() => finish(false), 1500);
              setTimeout(() => finish(false), 3000);
            } catch (_) {
              finish(false);
            }
          });
        }

        async function resetMatrixClientStores() {
          if (!('indexedDB' in window)) return true;
          const results = await Promise.all(MATRIX_DATABASES.map(deleteMatrixDatabase));
          return results.every(Boolean);
        }

        async function completePendingMatrixStoreRecovery() {
          if (localStorage.getItem(MATRIX_STORE_RECOVERY_KEY) !== '1') {
            return { pending: false, cleared: true };
          }
          clearStoredSession();
          const cleared = await resetMatrixClientStores();
          if (cleared) localStorage.removeItem(MATRIX_STORE_RECOVERY_KEY);
          return { pending: true, cleared };
        }

        async function storedSessionIsValid(token, expectedUserId, expectedDeviceId) {
          if (!token || !expectedUserId || !expectedDeviceId) return false;
          try {
            const response = await fetch('/_matrix/client/v3/account/whoami', {
              headers: { Authorization: `Bearer ${token}` },
              credentials: 'same-origin',
              cache: 'no-store'
            });
            if (response.status >= 500) return null;
            if (!response.ok) return false;
            const data = await response.json();
            return data.user_id === expectedUserId && data.device_id === expectedDeviceId;
          } catch (_) {
            return null;
          }
        }

        function saveSession(data) {
          const hs = data.base_url || 'https://mitchdog.com';
          localStorage.setItem("mx_access_token", data.access_token);
          localStorage.setItem("mx_device_id", data.device_id);
          localStorage.setItem("mx_user_id", data.user_id);
          localStorage.setItem("mx_hs_url", hs);
          localStorage.setItem("mx_has_access_token", "true");
          localStorage.setItem("mx_is_guest", "false");
        }

        window.updateMatrixShellAccount = function(status) {
          const name = document.getElementById('matrix-account-name');
          const avatar = document.getElementById('matrix-account-avatar');
          const link = document.getElementById('matrix-account-link');
          if (!name || !avatar || !link) return;
          if (!status || !status.authenticated) {
            name.textContent = 'Sign in';
            avatar.textContent = 'M';
            avatar.style.backgroundImage = '';
            link.href = '/api/sso/bridge?back=/matrix/';
            return;
          }
          const raw = String(status.displayName || status.username || status.user_id || 'Account');
          const label = raw.replace(/^@/, '').split(':')[0];
          name.textContent = label;
          if (status.pfp) {
            let pfpUrl = status.pfp;
            if (pfpUrl.startsWith('mxc://')) {
              pfpUrl = '/_matrix/media/v3/download/' + pfpUrl.slice(6);
            }
            avatar.textContent = '';
            avatar.style.backgroundImage = 'url("' + pfpUrl + '")';
            avatar.style.backgroundSize = 'cover';
            avatar.style.backgroundPosition = 'center';
          } else {
            avatar.style.backgroundImage = '';
            avatar.textContent = (label.trim()[0] || 'M').toUpperCase();
          }
          link.href = '/preferences/#account';
          if (status.bio) link.title = status.bio;
        };

        async function initMitchSSO() {
          let shouldBootElement = true;
          try {
            const recovery = await completePendingMatrixStoreRecovery();
            if (recovery.pending && !recovery.cleared) {
              shouldBootElement = false;
              if (banner) banner.style.display = 'flex';
              const message = document.getElementById('mitch-sso-msg');
              if (message) message.textContent = 'Repairing encrypted chat storage… close other chat tabs if this page keeps reloading.';
              setTimeout(() => window.location.reload(), 2000);
              return;
            }

            const statusRes = await fetch('/api/matrix/sso-status', {
              credentials: 'same-origin',
              cache: 'no-store'
            });
            const status = statusRes.ok ? await statusRes.json() : { authenticated: false };
            window.updateMatrixShellAccount(status);
            const stored = readStoredSession();

            const sameStatusAccount = !status.authenticated || stored.userId === status.user_id;
            const sessionValidity = stored.token && stored.userId && stored.deviceId && sameStatusAccount
              ? await storedSessionIsValid(stored.token, stored.userId, stored.deviceId)
              : false;
            // A temporary whoami outage should not sign out a working device.
            if (sessionValidity === true || sessionValidity === null) {
              localStorage.setItem('mx_hs_url', 'https://mitchdog.com');
              localStorage.setItem('mx_has_access_token', 'true');
              localStorage.setItem('mx_is_guest', 'false');
              if (banner) banner.style.display = 'none';
              bootElement();
              return;
            }

            const sameAccount = status.authenticated && stored.userId === status.user_id;
            const reusableDeviceId = sameAccount ? stored.deviceId : '';
            // An expired token is not a new Matrix identity. Keep this device's
            // crypto store until the SSO response confirms the device changed.
            if (stored.userId && status.authenticated && !sameAccount) {
              clearStoredSession();
              await resetMatrixClientStores();
            }

            if (!status.authenticated) {
              if (statusRes.ok && (stored.token || stored.userId)) {
                clearStoredSession();
                await resetMatrixClientStores();
              }
              if (banner) banner.style.display = 'flex';
              bootElement();
              return;
            }

            const res = await fetch("/api/matrix/sso-login", {
              method: "POST",
              headers: { "Content-Type": "application/json", "X-Mitch-Requested-With": "1" },
              credentials: "same-origin",
              body: JSON.stringify(reusableDeviceId ? { device_id: reusableDeviceId } : {})
            });
            if (res.ok) {
              const data = await res.json();
              if (data && data.access_token && data.user_id) {
                if ((stored.userId && data.user_id !== stored.userId) ||
                    (reusableDeviceId && data.device_id !== reusableDeviceId)) {
                  await resetMatrixClientStores();
                }
                saveSession(data);
                if (banner) banner.style.display = "none";
              } else {
                localStorage.removeItem('mx_access_token');
                localStorage.removeItem('mx_has_access_token');
                if (banner) banner.style.display = "flex";
              }
            } else if (banner) {
              localStorage.removeItem('mx_access_token');
              localStorage.removeItem('mx_has_access_token');
              banner.style.display = "flex";
            }
          } catch (e) {
            console.warn("[Mitch Matrix SSO]", e);
            const current = readStoredSession();
            if (!current.token && banner) banner.style.display = "flex";
          } finally {
            if (shouldBootElement) {
              bootElement();
            }
          }
        }

        if (navigator.locks && typeof navigator.locks.request === 'function') {
          navigator.locks.request('mitch-matrix-session', initMitchSSO);
        } else {
          initMitchSSO();
        }
      })();
    </script>
