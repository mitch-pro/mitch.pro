<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Call</title>
<link rel="stylesheet" href="call.css?v=1">
</head>
<body class="theme-dark">
  <main id="stage" aria-live="polite">
    <p id="status" class="status">Connecting…</p>
    <ul id="tiles" class="tiles"></ul>
    <button id="close" class="close" type="button" hidden>Close</button>
  </main>
  <!-- The chat client hides the container of this button and draws its own
       call controls; it is kept because the client looks it up by test id. -->
  <div class="controls"><div><button type="button" data-testid="incall_leave">Leave</button></div></div>
  <script src="voice-client.js?v=1"></script>
  <script src="call.js?v=1"></script>
</body>
</html>
