<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Inventory — mitch.pro</title>
<link rel="stylesheet" href="/app.css">
<script src="/api.js"></script>
<script src="/app-shell.js" defer></script>
<style>
  .page-head {
    display: grid;
    grid-template-columns: 1fr auto;
    gap: 1.25rem;
    align-items: end;
    margin-bottom: 1.25rem;
  }
  .page-head h1 {
    margin: 0;
    font-size: clamp(1.85rem, 4vw, 2.75rem);
    letter-spacing: -0.03em;
  }
  .subline {
    margin: 0.55rem 0 0;
    color: var(--t-fg2);
    font-size: 0.88rem;
    max-width: 40rem;
    line-height: 1.55;
  }
  .head-actions {
    display: flex;
    gap: 0.5rem;
    flex-wrap: wrap;
  }
  .status-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(9.5rem, 1fr));
    gap: 0.55rem;
    margin: 0 0 1.25rem;
  }
  .status b {
    display: block;
    font-family: Outfit, system-ui, sans-serif;
    font-size: 0.86rem;
    font-weight: 750;
    color: var(--t-fg);
    margin-bottom: 0.2rem;
  }
  .status span {
    color: var(--t-fg2);
    font-size: 0.75rem;
  }
  .section {
    margin: 0 0 1rem;
    border: 1px solid var(--t-bd);
    border-radius: var(--t-radius, 8px);
    overflow: hidden;
    background: color-mix(in srgb, var(--t-bg2) 70%, transparent);
  }
  .section-head {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    gap: 0.75rem;
    padding: 0.75rem 0.9rem;
    border-bottom: 1px solid var(--t-bd);
  }
  .section-title {
    font-family: Outfit, system-ui, sans-serif;
    font-size: 1rem;
    font-weight: 750;
    color: var(--t-fg);
  }
  .section-count { color: var(--t-fg2); font-size: 0.72rem; }
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(12.5rem, 1fr));
    gap: 0.75rem;
    padding: 0.9rem;
  }
  .card {
    background: var(--t-bg2);
    border: 1px solid var(--t-bd);
    border-radius: var(--t-radius, 8px);
    padding: 0.9rem;
    min-height: 10.5rem;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    transition: border-color var(--t-motion, 0.15s) ease;
  }
  .card.active {
    border-color: color-mix(in srgb, var(--t-ac) 55%, var(--t-bd));
    box-shadow: 0 0 0 1px color-mix(in srgb, var(--t-ac) 22%, transparent);
  }
  .name {
    font-family: Outfit, system-ui, sans-serif;
    font-weight: 750;
    font-size: 1rem;
    line-height: 1.25;
  }
  .desc {
    color: var(--t-fg2);
    font-size: 0.75rem;
    line-height: 1.45;
    margin-top: 0.5rem;
  }
  .tags {
    display: flex;
    gap: 0.35rem;
    flex-wrap: wrap;
    min-height: 1.4rem;
    margin-bottom: 0.55rem;
  }
  .pill {
    display: inline-flex;
    align-items: center;
    min-height: 1.4rem;
    padding: 0.15rem 0.5rem;
    border-radius: 999px;
    border: 1px solid var(--t-bd);
    background: var(--t-bg3);
    color: var(--t-fg2);
    font-size: 0.65rem;
    font-weight: 700;
  }
  .pill.good { color: #c084fc; border-color: rgba(192,132,252,.35); background: rgba(192,132,252,.08); }
  .pill.warn { color: #f59e0b; border-color: rgba(245,158,11,.4); background: rgba(245,158,11,.08); }
  .pill.active { color: var(--t-ac); border-color: color-mix(in srgb, var(--t-ac) 45%, transparent); background: color-mix(in srgb, var(--t-ac) 12%, transparent); }
  .empty {
    color: var(--t-fg2);
    border: 1px dashed var(--t-bd);
    border-radius: var(--t-radius, 8px);
    padding: 1.75rem;
    text-align: center;
  }
  .card .btn, .card .btn-primary { width: 100%; }
  #toast {
    position: fixed;
    right: 1.1rem;
    bottom: 1.1rem;
    display: none;
    max-width: min(26rem, calc(100vw - 2rem));
    padding: 0.75rem 1rem;
    border-radius: var(--t-radius, 8px);
    font-weight: 700;
    font-size: 0.88rem;
    z-index: 9999;
    box-shadow: 0 12px 40px rgba(0,0,0,.35);
  }
  #toast.ok { display: block; background: #16a34a; color: #fff; }
  #toast.err { display: block; background: #dc2626; color: #fff; }
  @media (max-width: 719px) {
    .page-head { grid-template-columns: 1fr; align-items: stretch; }
    .head-actions .btn { flex: 1 1 auto; }
    .grid { grid-template-columns: 1fr; padding: 0.65rem; }
  }
  @media (prefers-reduced-motion: reduce) {
    .card { transition: none; }
  }
  .theme-no-motion .card { transition: none; }
</style>
</head>
<body>
<main class="app-main">
  <header class="page-head">
    <div>
      <h1>Inventory</h1>
      <p class="subline">Equip owned shop items, including items that are no longer listed in the market.</p>
    </div>
    <div class="head-actions panel-actions">
      <a class="btn" href="/shop/">Open Market</a>
      <a class="btn" href="/preferences/">Preferences</a>
    </div>
  </header>

  <div id="status" class="status-grid"></div>
  <div id="inventory"><div class="empty">Loading inventory...</div></div>
</main>
<div id="toast"></div>

<script>
const equipTypes = new Set(['name_color', 'chat_badge', 'chat_effect', 'profile_effect', 'site_theme', 'canvas_tool', 'ai_personality']);
let inventory = null;

function esc(value) {
  return String(value ?? '').replace(/[&<>"']/g, ch => ({
    '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
  }[ch]));
}
function toast(text, ok) {
  const el = document.getElementById('toast');
  el.textContent = text;
  el.className = ok ? 'ok' : 'err';
  clearTimeout(toast.timer);
  toast.timer = setTimeout(() => { el.className = ''; }, 3200);
}
function timeLeft(ts) {
  ts = Number(ts || 0);
  if (!ts || ts <= Date.now()) return 'Inactive';
  const mins = Math.ceil((ts - Date.now()) / 60000);
  if (mins < 60) return mins + 'm left';
  return Math.floor(mins / 60) + 'h ' + (mins % 60) + 'm left';
}
function renderStatus(status) {
  const rows = [
    ['VIP Casino', timeLeft(status.vipUntil)],
    ['Happy Hour', timeLeft(status.happyHourUntil)],
    ['Double Down', timeLeft(status.doubleDownUntil)],
    ['Bad Beat Insurance', timeLeft(status.badBeatInsuranceUntil)],
    ['Slot Free Spins', String(status.slotsFreeSpins || 0)],
    ['Streak Freezes', String(status.streakFreezes || 0)]
  ];
  document.getElementById('status').innerHTML = rows.map(([label, value]) => (
    `<div class="panel status"><b>${esc(label)}</b><span>${esc(value)}</span></div>`
  )).join('');
}
function renderCard(item) {
  const canEquip = equipTypes.has(item.costType);
  const tags = [
    '<span class="pill good">owned</span>',
    item.active ? '<span class="pill active">active</span>' : '',
    item.removedFromShop ? '<span class="pill warn">removed from shop</span>' : ''
  ].filter(Boolean).join('');
  const button = canEquip
    ? `<button class="${item.active ? 'btn' : 'btn-primary'}" data-id="${esc(item.id)}" data-type="${esc(item.costType)}">${item.active ? 'Turn Off' : 'Equip'}</button>`
    : '<span class="pill">pass / consumable</span>';
  return `<article class="card ${item.active ? 'active' : ''}">
    <div>
      <div class="tags">${tags}</div>
      <div class="name">${esc(item.name || item.id)}</div>
      <div class="desc">${esc(item.desc || '')}</div>
    </div>
    <div style="margin-top:0.85rem">${button}</div>
  </article>`;
}
function render() {
  const items = Array.isArray(inventory.items) ? inventory.items : [];
  renderStatus(inventory.status || {});
  const root = document.getElementById('inventory');
  if (!items.length) {
    root.innerHTML = '<div class="empty">No owned shop items yet.</div>';
    return;
  }
  const grouped = {};
  items.forEach(item => {
    const section = item.section || 'Other';
    if (!grouped[section]) grouped[section] = [];
    grouped[section].push(item);
  });
  root.innerHTML = Object.entries(grouped).map(([section, sectionItems]) => `
    <section class="section">
      <div class="section-head"><div class="section-title">${esc(section)}</div><div class="section-count">${sectionItems.length} item${sectionItems.length === 1 ? '' : 's'}</div></div>
      <div class="grid">${sectionItems.map(renderCard).join('')}</div>
    </section>
  `).join('');
  root.querySelectorAll('button[data-id]').forEach(btn => {
    btn.addEventListener('click', () => equip(btn.dataset.type, btn.textContent === 'Turn Off' ? '' : btn.dataset.id));
  });
}
async function equip(type, itemId) {
  try {
    const r = await fetch('/api/me/cosmetics/equip', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ type, itemId })
    });
    const data = await r.json().catch(() => ({}));
    if (!r.ok) return toast(data.error || 'Could not update item', false);
    toast(itemId ? 'Equipped' : 'Turned off', true);
    await load();
  } catch {
    toast('Network error while updating item', false);
  }
}
async function load() {
  try {
    const r = await fetch('/api/me/inventory', { credentials: 'include', cache: 'no-store' });
    if (r.status === 401) { location.href = '/enroll/'; return; }
    inventory = await r.json();
    render();
  } catch {
    document.getElementById('inventory').innerHTML = '<div class="empty">Failed to load inventory.</div>';
  }
}
load();
</script>
<script src="/cookie-consent.js" defer></script>
</body>
</html>
