<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>Music — mitch.pro</title>
  <link rel="icon" href="/favicon.ico">
  <link rel="stylesheet" href="/app.css">
  <link rel="stylesheet" href="/music-widget.css?v=4">
  <link rel="stylesheet" href="/music/music.css?v=12">
  <script src="/app-shell.js" defer></script>
  <script src="/music-core.js?v=7" defer></script>
  <script src="/music/music.js?v=15" defer></script>
</head>
<body class="app-shell music-page" data-mode="page">
  <main class="app-main mp-main">
    <h1 class="mp-sr">Music</h1>
    <div class="mp-shell">
      <aside class="mp-side" aria-label="Find music">
        <form class="mp-search" id="mp-search" role="search">
          <span class="mp-searchicon" id="mp-searchicon" aria-hidden="true"></span>
          <input id="mp-q" type="search" maxlength="120" placeholder="Search songs or artists" aria-label="Search songs or artists" autocomplete="off">
        </form>
        <div class="mp-tabs" role="tablist">
          <button type="button" role="tab" id="tab-search" aria-selected="true" data-tab="search">Results</button>
          <button type="button" role="tab" id="tab-library" aria-selected="false" data-tab="library">Library</button>
          <button type="button" role="tab" id="tab-playlists" aria-selected="false" data-tab="playlists">Playlists</button>
          <button type="button" role="tab" id="tab-queue" aria-selected="false" data-tab="queue">Queue</button>
        </div>
        <p id="mp-status" class="mp-status" role="status"></p>
        <div class="mp-scroll">
          <ul id="mp-list" class="mp-list"></ul>

          <div id="mp-playlists" class="mp-playlists" hidden>
            <div id="mp-plhome">
              <div class="mp-pltools">
                <div class="mp-seg" role="group" aria-label="Playlist list">
                  <button type="button" id="mp-seg-mine" aria-pressed="true">Mine</button>
                  <button type="button" id="mp-seg-public" aria-pressed="false">Public</button>
                </div>
                <span class="mp-spacer"></span>
                <button type="button" id="mp-pl-new" class="mp-btn">New</button>
                <button type="button" id="mp-pl-spotify" class="mp-btn">Import from Spotify</button>
              </div>
              <form id="mp-plsearch" class="mp-plsearch" role="search" hidden>
                <input id="mp-plq" type="search" maxlength="80" placeholder="Search public playlists" aria-label="Search public playlists" autocomplete="off">
              </form>
              <ul id="mp-pllist" class="mp-plgrid"></ul>
            </div>
            <div id="mp-pldetail" hidden>
              <div class="mp-plhead">
                <button type="button" id="mp-pl-back" class="mp-link">&larr; Playlists</button>
              </div>
              <div class="mp-plinfo">
                <h2 id="mp-pl-name" class="mp-plname"></h2>
                <div id="mp-pl-meta" class="mp-plmeta"></div>
              </div>
              <div id="mp-pl-actions" class="mp-pltools"></div>
              <div id="mp-pl-share" class="mp-share" hidden></div>
              <ul id="mp-pltracks" class="mp-list"></ul>
            </div>
          </div>
        </div>
      </aside>

      <section class="mp-stage is-empty" id="mp-stage" aria-label="Now playing">
        <div id="mp-ambient" class="mp-ambient" aria-hidden="true"></div>
        <div class="mp-stagebody">
          <div class="mp-cover">
            <div class="mp-coverart"><img id="mp-art" alt="" hidden><span class="mp-coverempty" id="mp-coverempty" aria-hidden="true"></span></div>
            <div class="mp-nowmeta">
              <div id="mp-title" class="mp-title">Nothing playing</div>
              <div id="mp-artist" class="mp-artist"></div>
            </div>
            <div class="mp-nowtools">
              <button type="button" id="mp-fav" class="mp-icon" aria-label="Save to library" aria-pressed="false" title="Save to library" hidden></button>
              <button type="button" id="mp-pop" class="mp-icon" aria-label="Pop out player" title="Pop out player"></button>
            </div>
          </div>
          <div class="mp-lyricspane">
            <div id="mp-lyrics" class="mp-lyrics"></div>
            <div class="mp-lyricsmeta">
              <span id="mp-lyricsinfo"></span>
              <span class="mp-nudge" id="mp-nudge" hidden>
                <button type="button" id="mp-lyrbk" class="mp-link" title="Show the lyrics earlier">&minus;0.5s</button>
                <span id="mp-lyroff" class="mp-lyroff">Timing</span>
                <button type="button" id="mp-lyrfw" class="mp-link" title="Show the lyrics later">+0.5s</button>
              </span>
              <button type="button" id="mp-wrong" class="mp-link" hidden>Wrong lyrics?</button>
            </div>
            <form id="mp-wrongform" class="mp-wrongform" hidden>
              <input id="mp-wt" type="text" maxlength="200" placeholder="Song title" aria-label="Song title">
              <input id="mp-wa" type="text" maxlength="200" placeholder="Artist" aria-label="Artist">
              <button type="submit" class="mp-btn">Search lyrics</button>
            </form>
          </div>
        </div>
        <div class="mp-dock">
          <div class="mp-scrub">
            <span id="mp-cur" class="mp-time">0:00</span>
            <input id="mp-seek" class="mp-range mp-seek" type="range" min="0" max="1000" value="0" aria-label="Seek">
            <span id="mp-dur" class="mp-time">0:00</span>
          </div>
          <div class="mp-transport">
            <div class="mp-transportside mp-xfside"><button type="button" id="mp-xfade" class="mp-pill" title="Crossfade between songs" hidden>Crossfade off</button></div>
            <div class="mp-transportmain">
              <button type="button" id="mp-shuffle" class="mp-icon mp-toggle" aria-label="Shuffle" aria-pressed="false" title="Shuffle"></button>
              <button type="button" id="mp-prev" class="mp-icon" aria-label="Previous" title="Previous"></button>
              <button type="button" id="mp-play" class="mp-icon mp-playbtn" aria-label="Play" title="Play"></button>
              <button type="button" id="mp-next" class="mp-icon" aria-label="Next" title="Next"></button>
              <button type="button" id="mp-repeat" class="mp-icon mp-toggle" aria-label="Repeat" aria-pressed="false" title="Repeat"></button>
            </div>
            <div class="mp-transportside mp-volwrap">
              <input id="mp-vol" class="mp-range mp-vol" type="range" min="0" max="100" value="90" aria-label="Volume">
            </div>
          </div>
        </div>
      </section>
    </div>
  </main>

  <dialog id="mp-dialog" class="mp-dialog">
    <form method="dialog" id="mp-dialogform">
      <h2 id="mp-dialogtitle"></h2>
      <div id="mp-dialogfields"></div>
      <p id="mp-dialognote" class="mp-status"></p>
      <div class="mp-dialogbtns">
        <button type="button" id="mp-dialogcancel" class="mp-btn">Cancel</button>
        <button type="submit" id="mp-dialogok" class="mp-btn mp-primary"></button>
      </div>
    </form>
  </dialog>
  <dialog id="mp-picker" class="mp-dialog">
    <h2>Add to playlist</h2>
    <ul id="mp-pickerlist" class="mp-list"></ul>
    <div class="mp-dialogbtns">
      <button type="button" id="mp-pickernew" class="mp-btn">New playlist</button>
      <button type="button" id="mp-pickerclose" class="mp-btn">Close</button>
    </div>
  </dialog>
</body>
</html>
