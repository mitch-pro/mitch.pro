<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>Public Plaza — mitch.pro</title>
  <style>
    .plaza-main{width:min(1120px,100%)}
    .plaza-head{display:flex;align-items:flex-end;justify-content:space-between;gap:1.25rem}
    .plaza-kicker{margin-bottom:.55rem;color:var(--t-ac);font-size:.68rem;font-weight:750;letter-spacing:.1em;text-transform:uppercase}
    .plaza-stats{display:flex;gap:.5rem;flex-wrap:wrap}
    .plaza-stats>span{display:inline-flex;align-items:center;gap:.4rem;padding:.45rem .7rem;border:1px solid var(--t-bd);border-radius:999px;background:color-mix(in srgb,var(--t-bg2) 80%,transparent);color:var(--t-fg2);font-size:.72rem;font-weight:700}
    .plaza-stats i{width:6px;height:6px;border-radius:50%;background:#53e6a5;box-shadow:0 0 8px #53e6a5}
    .plaza-stats .offline i{background:#ff6f85;box-shadow:0 0 8px #ff6f85}
    .chat-shell{padding:0!important;overflow:hidden!important;border-radius:calc(var(--t-radius,8px) + 8px)!important}
    .channel-head{display:flex;align-items:center;justify-content:space-between;gap:.75rem;padding:.9rem 1.05rem;border-bottom:1px solid var(--t-bd);background:color-mix(in srgb,#fff 2%,transparent)}
    .channel-head div{display:flex;flex-direction:column}
    .channel-head small{color:var(--t-fg2);font-size:.65rem;font-weight:750;letter-spacing:.1em;text-transform:uppercase}
    .channel-head strong{margin-top:.2rem;font-size:.9rem}
    .channel-head>span{color:var(--t-fg2);font-size:.75rem}
    .chat-box{height:min(62vh,620px);min-height:360px;overflow-y:auto;padding:1rem 1.05rem}
    .msg{position:relative;display:flex;align-items:flex-start;gap:.7rem;max-width:820px;margin:.2rem 0;padding:.55rem .65rem;border:1px solid transparent;border-radius:12px;transition:background .15s,border-color .15s}
    .msg:hover{border-color:var(--t-bd);background:color-mix(in srgb,#fff 2.5%,transparent)}
    .msg.own{margin-left:auto;background:color-mix(in srgb,var(--t-ac) 8%,transparent);border-color:color-mix(in srgb,var(--t-ac) 18%,transparent)}
    .msg-avatar{display:grid;width:2.15rem;height:2.15rem;flex:0 0 2.15rem;place-items:center;border:1px solid var(--t-bd);border-radius:10px;background:color-mix(in srgb,var(--t-ac) 16%,transparent);color:var(--t-fg);font:750 .8rem Outfit,sans-serif}
    .msg-copy{display:flex;min-width:0;flex:1;flex-wrap:wrap;align-items:baseline;column-gap:.5rem}
    .author{color:var(--t-fg);font-size:.78rem;font-weight:750}
    .text{width:100%;margin-top:.2rem;color:color-mix(in srgb,var(--t-fg) 82%,var(--t-fg2));font-size:.9rem;line-height:1.5;overflow-wrap:anywhere;white-space:pre-wrap}
    .msg time{color:var(--t-fg2);font-size:.65rem}
    .chat-badge{margin-left:.3rem;color:var(--t-ac);font-size:.65rem}
    .badge-verified{color:var(--t-ac2)}.badge-og{padding:1px 3px;border:1px solid rgba(255,111,133,.35);border-radius:4px;color:#ff8294;font-size:7px}
    .message-tools{display:flex;gap:.25rem;opacity:0;transition:opacity .15s}
    .msg:hover .message-tools,.message-tools:focus-within{opacity:1}
    .message-tools button{width:auto!important;min-height:1.7rem!important;margin:0!important;padding:.25rem .45rem!important;border-color:var(--t-bd)!important;background:color-mix(in srgb,#fff 3%,transparent)!important;color:var(--t-fg2)!important;font-size:.7rem!important}
    .message-tools button:last-child{color:#ff8294!important}
    .empty-chat{display:grid;height:100%;place-items:center;color:var(--t-fg2);text-align:center}
    .empty-chat span{display:block;font-size:1.6rem;margin-bottom:.35rem}
    .input-wrap{position:relative;display:grid;grid-template-columns:1fr auto;gap:.55rem;padding:.8rem;border-top:1px solid var(--t-bd);background:color-mix(in srgb,var(--t-bg) 70%,transparent)}
    .input-wrap input{min-height:2.9rem!important;padding:.65rem 5.5rem .65rem .85rem!important}
    .input-wrap button{min-width:7.5rem}
    .char-count{position:absolute;right:9.5rem;bottom:1.85rem;color:var(--t-fg2);font-size:.7rem}
    .chat-toast{position:fixed;right:1rem;bottom:1.35rem;z-index:1000;padding:.7rem .9rem;border:1px solid rgba(255,111,133,.25);border-radius:12px;background:color-mix(in srgb,var(--t-bg) 92%,#400);box-shadow:0 16px 40px rgba(0,0,0,.35);color:#ff9aaa;font-size:.8rem;opacity:0;transform:translateY(8px);pointer-events:none;transition:.2s}
    .chat-toast.show{opacity:1;transform:none}
    .mod-overlay{position:fixed;inset:0;z-index:9999;display:grid;place-items:center;padding:1rem;background:rgba(2,4,9,.72);backdrop-filter:blur(12px)}
    .mod-card{width:min(430px,100%);padding:1.2rem;border:1px solid var(--t-bd);border-radius:calc(var(--t-radius,8px) + 8px);background:var(--t-bg2);box-shadow:0 28px 80px rgba(0,0,0,.5)}
    .mod-card-head{display:flex;justify-content:space-between;gap:.75rem}
    .mod-card h2{margin:0}.mod-card p{color:var(--t-fg2);font-size:.78rem;word-break:break-all}
    .mod-actions{display:grid;grid-template-columns:1fr 1fr;gap:.45rem;margin-top:1rem}
    .mod-actions button{min-height:2.5rem}
    .mod-actions .danger{color:#ff8194!important;border-color:rgba(255,111,133,.23)!important}
    .mod-actions .wide{grid-column:1/-1}
    @media(max-width:700px){
      .plaza-head{align-items:flex-start;flex-direction:column}
      .plaza-stats{width:100%}
      .plaza-stats>span{flex:1;justify-content:center}
      .channel-head>span{display:none}
      .chat-box{height:58vh;min-height:300px;padding:.65rem}
      .msg{gap:.5rem;padding:.5rem .4rem}
      .msg-avatar{width:1.85rem;height:1.85rem;flex-basis:1.85rem;border-radius:9px}
      .message-tools{opacity:1}
      .input-wrap{grid-template-columns:1fr}
      .input-wrap button{width:100%}
      .char-count{right:1.2rem;bottom:5.1rem}
      .input-wrap input{padding-right:4.5rem!important}
    }
  </style>
</head>
<body class="plaza-page">
<main class="app-main plaza-main">
  <header class="page-head plaza-head"><div><div class="plaza-kicker">Public chat</div><h1>Plaza</h1><p class="page-sub">Live community channel. Keep it friendly.</p></div><div class="plaza-stats"><span id="connectionState" class="offline"><i></i> Connecting</span><span><b id="messageCount">0</b> recent</span></div></header>
  <section class="panel chat-shell"><header class="channel-head"><div><small>Channel</small><strong>#general</strong></div><span>Messages sync in real time</span></header><div id="chatBox" class="chat-box" aria-live="polite"><div class="empty-chat"><div><span>◌</span>Loading…</div></div></div><form id="chatForm" class="input-wrap"><input id="chatInput" maxlength="1000" autocomplete="off" placeholder="Write a message…" required><span class="char-count" id="charCount">0 / 1000</span><button id="sendBtn" type="submit">Send</button></form></section>
</main>
<div class="chat-toast" id="chatToast" role="status"></div>
<script>
(function(){
  const box=document.getElementById('chatBox'),form=document.getElementById('chatForm'),input=document.getElementById('chatInput'),send=document.getElementById('sendBtn');
  let myEmail='',staff=false,ws=null,reconnectTimer=null,reconnectDelay=1000,sending=false,loaded=false;const seen=new Set();
  const esc=v=>String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
  const norm=v=>String(v||'').toLowerCase().replace(/@student\.rjuhsd\.us$/,'@student.mitch.pro');
  const key=m=>String(m.id||`${m.email}:${m.ts}`);
  function toast(text){const el=document.getElementById('chatToast');el.textContent=text;el.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>el.classList.remove('show'),3200)}
  function connection(label,on){const el=document.getElementById('connectionState');el.classList.toggle('offline',!on);el.innerHTML='<i></i> '+esc(label)}
  function removeMessage(id){Array.from(box.querySelectorAll('.msg')).find(row=>row.dataset.msgId===String(id))?.remove();document.getElementById('messageCount').textContent=box.querySelectorAll('.msg').length}
  function render(m){const id=key(m);if(seen.has(id))return;seen.add(id);if(!loaded){box.replaceChildren();loaded=true}const own=norm(m.email)===norm(myEmail),row=document.createElement('article'),effect=String(m.chatEffect||'').replace(/[^a-z0-9_-]/gi,'');row.className='msg'+(own?' own':'')+(effect?' '+effect:'');row.dataset.msgId=String(m.id||'');row.dataset.msgKey=id;row.dataset.email=String(m.email||'');row.dataset.msgTs=String(m.ts||0);const color=String(m.color||'').replace(/[^a-z0-9_-]/gi,'');const badges={verified_badge:'✓',og_badge:'OG',artist_badge:'◆',chess_badge:'♟',builder_badge:'⌁',lucky_badge:'♣',premium_star_badge:'★',owner_fan_badge:'♛'};const badge=m.badge?`<span class="chat-badge ${m.badge==='verified_badge'?'badge-verified':m.badge==='og_badge'?'badge-og':''}">${esc(badges[m.badge]||'◆')}</span>`:'';row.innerHTML=`<span class="msg-avatar">${esc(String(m.name||'?')[0].toUpperCase())}</span><span class="msg-copy"><span class="author ${color}">${esc(m.name||'Member')}${badge}</span><time>${new Date(m.ts||Date.now()).toLocaleTimeString('en-US', {hour12:true,hour:'numeric',minute:'2-digit'})}</time><span class="text">${esc(m.text)}</span></span>`;if(staff){const tools=document.createElement('span');tools.className='message-tools';const moderate=document.createElement('button');moderate.type='button';moderate.textContent='Moderate';moderate.onclick=()=>openModeration(m);const remove=document.createElement('button');remove.type='button';remove.textContent='Delete';remove.onclick=()=>deleteMessage(m);tools.append(moderate,remove);row.append(tools)}box.append(row);document.getElementById('messageCount').textContent=box.querySelectorAll('.msg').length}
  async function request(path,body){const r=await fetch(path,{method:'POST',credentials:'include',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});const d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.error||d.message||'Request failed');return d}
  async function history(){try{const stick=box.scrollHeight-box.scrollTop-box.clientHeight<90,r=await fetch('/api/public-chat/history',{credentials:'include',cache:'no-store'});if(!r.ok)throw Error();const d=await r.json(),messages=d.messages||[];const ids=new Set(messages.map(key));if(messages.length){const min=Number(messages[0].ts||0);box.querySelectorAll('.msg').forEach(el=>{if(Number(el.dataset.msgTs)>=min&&!ids.has(el.dataset.msgKey))el.remove()})}messages.forEach(render);document.getElementById('messageCount').textContent=messages.length;if(stick)box.scrollTop=box.scrollHeight}catch(_){if(!loaded)box.innerHTML='<div class="empty-chat"><div><span>!</span>Could not load messages.</div></div>'}}
  function connect(){clearTimeout(reconnectTimer);if(ws&&[WebSocket.OPEN,WebSocket.CONNECTING].includes(ws.readyState))return;connection('Connecting',false);ws=new WebSocket((location.protocol==='https:'?'wss:':'ws:')+'//'+location.host+'/ws');ws.onopen=()=>{reconnectDelay=1000;connection('Live',true)};ws.onmessage=e=>{try{const d=JSON.parse(e.data);if(d.type==='public_chat'){const stick=box.scrollHeight-box.scrollTop-box.clientHeight<90;render(d.msg);if(stick)box.scrollTop=box.scrollHeight}else if(d.type==='public_chat_delete')removeMessage(d.msgId);else if(d.type==='public_chat_clear_user'){box.querySelectorAll('.msg').forEach(el=>{if(norm(el.dataset.email)===norm(d.userEmail))el.remove()})}}catch(_){}};ws.onerror=()=>{try{ws.close()}catch(_){}};ws.onclose=()=>{connection('Reconnecting',false);reconnectTimer=setTimeout(connect,reconnectDelay);reconnectDelay=Math.min(15000,Math.round(reconnectDelay*1.8))}}
  async function deleteMessage(m){if(!(await customConfirm('Delete','Delete this message?')))return;try{await request('/api/chat/delete-message',{room:'public',msgId:String(m.id||'')});removeMessage(m.id)}catch(e){toast(e.message)}}
  function openModeration(m){document.getElementById('modOverlay')?.remove();const overlay=document.createElement('div');overlay.id='modOverlay';overlay.className='mod-overlay';overlay.innerHTML=`<section class="mod-card" role="dialog" aria-modal="true"><header class="mod-card-head"><div><small>STAFF ACTIONS</small><h2>Moderate ${esc(m.name||'member')}</h2></div><button type="button" data-close>Close</button></header><p>${esc(m.email||'Unknown account')} · public plaza</p><div class="mod-actions"><button type="button" data-action="warn">Send warning</button><button type="button" data-action="timeout">Timeout</button><button type="button" class="danger" data-action="delete">Delete message</button><button type="button" class="danger" data-action="clear">Delete all</button><button type="button" class="danger wide" data-action="ban">Toggle room ban</button></div></section>`;document.body.append(overlay);overlay.onclick=e=>{if(e.target===overlay||e.target.closest('[data-close]'))overlay.remove()};overlay.querySelectorAll('[data-action]').forEach(b=>b.onclick=async()=>{try{const action=b.dataset.action;if(action==='delete')await request('/api/chat/delete-message',{room:'public',msgId:String(m.id||'')});if(action==='clear'&&await customConfirm('Delete All','Delete every public message from this user?'))await request('/api/chat/delete-user-messages',{room:'public',userEmail:m.email});if(action==='timeout'){const mins=Number(await customPrompt('Timeout','Timeout minutes','10'));if(!Number.isFinite(mins)||mins<=0)return;await request('/api/chat/timeout-user',{room:'public',userEmail:m.email,durationSeconds:Math.round(mins*60)})}if(action==='warn'){const message=await customPrompt('Warn','Warning message');if(!message)return;await request('/api/chat/warn-user',{userEmail:m.email,message})}if(action==='ban'){const ban=await customConfirm('Room Ban','OK bans this user from the room. Cancel removes an existing ban.');await request('/api/chat/ban-user',{room:'public',userEmail:m.email,ban})}overlay.remove();history();toast('Moderation action complete')}catch(e){toast(e.message)}})}
  form.onsubmit=async e=>{e.preventDefault();const text=input.value.trim();if(!text||sending)return;sending=true;send.disabled=true;input.value='';document.getElementById('charCount').textContent='0 / 1000';try{let recaptcha_token='';if(window.getCaptchaToken)recaptcha_token=await window.getCaptchaToken('public_chat_send')||'';await request('/api/public-chat/send',{text,recaptcha_token});history()}catch(err){input.value=text;toast(err.message)}finally{sending=false;send.disabled=false;input.focus()}};
  input.oninput=()=>document.getElementById('charCount').textContent=input.value.length+' / 1000';window.addEventListener('online',connect);
  (async()=>{try{const r=await fetch('/api/me',{credentials:'include',cache:'no-store'});if(!r.ok)throw Error();const me=await r.json();if(!me.email)throw Error();myEmail=me.email;staff=!!(me.isAdmin||me.isModerator);await history();connect();setInterval(history,7000)}catch(_){location.href=/(^|\.)rjuhsd\.school$/.test(location.hostname)?'/api/sso/bridge?back='+encodeURIComponent(location.pathname+location.search):'/enroll/'}})();
})();
</script>
<script src="/cookie-consent.js" defer></script>
</body></html>
