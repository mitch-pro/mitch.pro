<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Members — mitch.pro</title>
<script src="/theme.js?v=11"></script>
<link rel="stylesheet" href="/app.css">
<script src="/api.js"></script>
<script src="/app-shell.js" defer></script>
<script src="/sync.js"></script>
<style>
  .page-head { margin-bottom: 1.15rem; max-width: 40rem; }
  .page-head h1 {
    margin: 0;
    font-size: clamp(1.85rem, 4vw, 2.55rem);
    letter-spacing: -0.03em;
  }
  .page-sub {
    margin: 0.5rem 0 0;
    color: var(--t-fg2);
    font-size: 0.9rem;
    line-height: 1.55;
  }
  .toolbar {
    display: grid;
    grid-template-columns: minmax(14rem, 1fr) 9.5rem 9.5rem;
    gap: 0.55rem;
    margin-bottom: 0.9rem;
  }
  .toolbar input,
  .toolbar select,
  .dialog select,
  .dialog textarea {
    width: 100%;
    min-height: 2.5rem;
    padding: 0.55rem 0.75rem;
    border: 1px solid var(--t-bd);
    border-radius: var(--t-radius, 8px);
    background: var(--t-bg2);
    color: var(--t-fg);
    font: inherit;
    outline: none;
    transition: border-color var(--t-motion, 0.15s), box-shadow var(--t-motion, 0.15s);
  }
  .toolbar input:focus,
  .toolbar select:focus,
  .dialog select:focus,
  .dialog textarea:focus {
    border-color: var(--t-ac);
    box-shadow: 0 0 0 3px var(--t-gls);
  }
  .stats {
    display: flex;
    gap: 0.45rem;
    flex-wrap: wrap;
    margin: 0 0 1rem;
  }
  .pill {
    display: inline-flex;
    align-items: center;
    gap: 0.3rem;
    border: 1px solid var(--t-bd);
    background: var(--t-bg3);
    border-radius: 999px;
    padding: 0.25rem 0.6rem;
    color: var(--t-fg2);
    font-size: 0.72rem;
    font-weight: 700;
    white-space: nowrap;
  }
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(15rem, 1fr));
    gap: 0.75rem;
    align-items: stretch;
  }
  .member {
    display: grid;
    grid-template-rows: auto 1fr auto;
    min-height: 14rem;
    background: color-mix(in srgb, var(--t-bg2) 88%, transparent);
    border: 1px solid var(--t-bd);
    border-radius: var(--t-radius, 8px);
    overflow: hidden;
  }
  .cover {
    height: 3.4rem;
    background:
      linear-gradient(135deg, color-mix(in srgb, var(--t-ac) 28%, transparent), color-mix(in srgb, var(--t-ac2, var(--t-ac)) 14%, transparent)),
      var(--t-bg3);
    border-bottom: 1px solid var(--t-bd);
    position: relative;
  }
  .avatar {
    position: absolute;
    left: 0.85rem;
    bottom: -1.85rem;
    width: 3.7rem;
    height: 3.7rem;
    border-radius: var(--t-radius, 8px);
    border: 2px solid var(--t-bg);
    background: var(--t-bg3);
    overflow: hidden;
    display: grid;
    place-items: center;
    color: var(--t-ac);
    font-family: Outfit, system-ui, sans-serif;
    font-weight: 800;
    font-size: 1.15rem;
  }
  .avatar img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .online-dot {
    position: absolute;
    left: 3.9rem;
    bottom: -1.7rem;
    width: 0.7rem;
    height: 0.7rem;
    border-radius: 50%;
    border: 2px solid var(--t-bg);
    background: #64748b;
  }
  .online-dot.on { background: #a855f7; box-shadow: 0 0 10px rgba(168,85,247,.55); }
  .body { padding: 2.35rem 0.9rem 0.75rem; min-width: 0; }
  .name-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 0.5rem;
    min-width: 0;
  }
  .name {
    min-width: 0;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    font-family: Outfit, system-ui, sans-serif;
    font-weight: 750;
    font-size: 0.98rem;
    color: var(--t-fg);
  }
  .handle {
    color: var(--t-fg2);
    font-size: 0.78rem;
    margin-top: 0.15rem;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .presence-detail { margin-top:0.55rem; padding:0.5rem 0.6rem; border-radius:8px; background:var(--t-bg3); color:var(--t-fg2); font-size:0.72rem; line-height:1.35; }
  .presence-detail.is-online { color:#86efac; }
  .presence-detail.is-chat { color:#d8b4fe; border:1px solid color-mix(in srgb,#a855f7 35%,transparent); }
  .presence-detail code { display:block; margin-top:0.18rem; color:var(--t-fg2); font-size:0.65rem; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .role {
    text-transform: uppercase;
    letter-spacing: 0.05em;
    font-size: 0.62rem;
  }
  .role.owner { color: #facc15; border-color: rgba(250,204,21,.38); }
  .role.admin { color: #f87171; border-color: rgba(248,113,113,.38); }
  .role.moderator { color: #c084fc; border-color: rgba(192,132,252,.38); }
  .role.premium { color: #f59e0b; border-color: rgba(245,158,11,.38); }
  .role.basic { color: var(--t-fg2); }
  .bio {
    margin-top: 0.65rem;
    color: var(--t-fg2);
    font-size: 0.78rem;
    line-height: 1.45;
    min-height: 2.9em;
    overflow: hidden;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
  }
  .actions {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 0.45rem;
    padding: 0 0.9rem 0.9rem;
  }
  .actions button,
  .actions a,
  .dialog-actions button {
    min-height: 2.25rem;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    text-decoration: none;
    border-radius: var(--t-radius, 8px);
    border: 1px solid var(--t-bd);
    background: var(--t-bg2);
    color: var(--t-fg);
    font-size: 0.78rem;
    font-weight: 650;
    padding: 0.4rem 0.55rem;
    cursor: pointer;
    font-family: inherit;
    transition: border-color var(--t-motion, 0.15s), background var(--t-motion, 0.15s);
  }
  .actions button:hover,
  .actions a:hover,
  .dialog-actions button:hover {
    border-color: var(--t-ac);
  }
  .actions button:disabled { opacity: 0.52; cursor: not-allowed; }
  .actions .wide { grid-column: 1 / -1; }
  .report-btn { color: #f87171 !important; }
  .empty {
    grid-column: 1 / -1;
    border: 1px dashed var(--t-bd);
    background: color-mix(in srgb, var(--t-bg2) 70%, transparent);
    border-radius: var(--t-radius, 8px);
    padding: 1.75rem;
    text-align: center;
    color: var(--t-fg2);
    font-size: 0.88rem;
  }
  .modal {
    position: fixed;
    inset: 0;
    z-index: 500;
    display: none;
    align-items: center;
    justify-content: center;
    background: rgba(0,0,0,.55);
    padding: 1rem;
  }
  .modal.show { display: flex; }
  .dialog {
    width: min(28rem, 100%);
    background: var(--t-bg2);
    border: 1px solid var(--t-bd);
    border-radius: calc(var(--t-radius, 8px) + 2px);
    padding: 1rem;
    box-shadow: 0 24px 70px rgba(0,0,0,.45);
  }
  .dialog h2 {
    margin: 0 0 0.35rem;
    font-size: 1.05rem;
  }
  .dialog p {
    margin: 0 0 0.75rem;
    color: var(--t-fg2);
    font-size: 0.82rem;
    line-height: 1.45;
  }
  .dialog textarea {
    min-height: 6.5rem;
    resize: vertical;
    margin-top: 0.5rem;
  }
  .dialog-actions {
    display: flex;
    gap: 0.5rem;
    justify-content: flex-end;
    margin-top: 0.75rem;
  }
  .status {
    min-height: 1.2em;
    color: var(--t-fg2);
    font-size: 0.8rem;
    margin-top: 0.65rem;
  }
  .status.ok { color: #d8b4fe; }
  .status.err { color: #f87171; }
  @media (max-width: 719px) {
    .toolbar { grid-template-columns: 1fr; }
    .grid { grid-template-columns: 1fr; }
    .actions { grid-template-columns: 1fr; }
    .actions .wide { grid-column: auto; }
  }
  @media (prefers-reduced-motion: reduce) {
    .toolbar input, .actions button, .actions a { transition: none; }
  }
  .theme-no-motion .toolbar input,
  .theme-no-motion .actions button,
  .theme-no-motion .actions a {
    transition: none;
  }
</style>
</head>
<body class="members-page">
<main class="app-main">
  <header class="page-head">
    <h1>Members</h1>
    <p class="page-sub">Search people, start chats, and manage friend requests.</p>
  </header>

  <div class="toolbar panel">
    <input id="search" type="search" placeholder="Search members by name, handle, or role" autocomplete="off">
    <select id="roleFilter">
      <option value="all">All roles</option>
      <option value="online">Online now</option>
      <option value="friends">Friends</option>
      <option value="premium">Premium</option>
      <option value="staff">Staff</option>
    </select>
    <select id="sortMode">
      <option value="relevance">Best match</option>
      <option value="online">Online first</option>
      <option value="name">Name A-Z</option>
    </select>
  </div>

  <div class="stats" id="stats"></div>
  <div class="grid" id="membersGrid"><div class="empty">Loading members...</div></div>
</main>

<div class="modal" id="reportModal" aria-hidden="true">
  <div class="dialog" role="dialog" aria-modal="true" aria-labelledby="reportTitle">
    <h2 id="reportTitle">Report Profile</h2>
    <p id="reportTarget">Send a profile report to the admin team.</p>
    <select id="reportReason">
      <option value="Inappropriate profile">Inappropriate profile</option>
      <option value="Impersonation">Impersonation</option>
      <option value="Harassment or bullying">Harassment or bullying</option>
      <option value="Spam or scam">Spam or scam</option>
      <option value="Other">Other</option>
    </select>
    <textarea id="reportDetails" maxlength="800" placeholder="Add context for admins..."></textarea>
    <div class="dialog-actions">
      <button type="button" id="cancelReport">Cancel</button>
      <button type="button" id="submitReport">Send Report</button>
    </div>
    <div class="status" id="reportStatus"></div>
  </div>
</div>

<script>
    let members = [];
    let activeReportKey = '';

    function esc(value) {
      return String(value == null ? '' : value)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }

    function keyFor(member) {
      return member.handle || member.email || '';
    }

    function displayName(member) {
      return member.displayName || member.handle || member.email || 'member';
    }

    function initials(member) {
      return displayName(member).replace(/^@/, '').slice(0, 2).toUpperCase() || 'M';
    }

    function safeImageSrc(value) {
      const raw = String(value || '').trim();
      if (!raw || /[\u0000-\u001f\u007f<>"`]/.test(raw)) return '';
      if (/^https?:\/\//i.test(raw)) return raw;
      if (/^data:image\/(?:png|jpe?g|webp|gif);base64,[a-z0-9+/=]+$/i.test(raw) && raw.length <= 140000) return raw;
      return '';
    }

    function roleClass(role) {
      const value = String(role || '').toLowerCase();
      if (value.includes('owner')) return 'owner';
      if (value.includes('admin')) return 'admin';
      if (value.includes('moderator')) return 'moderator';
      if (value.includes('premium')) return 'premium';
      return 'basic';
    }

    function friendButton(member) {
      const key = esc(keyFor(member));
      if (member.friendStatus === 'self') return '<button type="button" disabled>That is you</button>';
      if (member.friendStatus === 'friends') return '<button type="button" disabled>Friends</button>';
      if (member.friendStatus === 'outgoing') return '<button type="button" data-action="cancel" data-key="' + key + '">Cancel Request</button>';
      if (member.friendStatus === 'incoming') return '<button type="button" data-action="accept" data-key="' + key + '">Accept Request</button>';
      return '<button type="button" data-action="friend" data-key="' + key + '">Send friend request</button>';
    }

    function dmHref(member) {
      return '/matrix/';
    }

    function profileHref(member) {
      return '/profile/?u=' + encodeURIComponent(member.handle || member.email || '');
    }

    function renderStats(list) {
      const online = members.filter(m => m.online).length;
      const friends = members.filter(m => m.friendStatus === 'friends').length;
      document.getElementById('stats').innerHTML = [
        '<span class="pill">' + list.length + ' shown</span>',
        '<span class="pill">' + members.length + ' total</span>',
        '<span class="pill">' + online + ' online</span>',
        '<span class="pill">' + friends + ' friends</span>'
      ].join('');
    }

    function score(member, q) {
      if (!q) return 0;
      const name = displayName(member).toLowerCase();
      const handle = String(member.handle || member.email || '').toLowerCase();
      const role = String(member.role || '').toLowerCase();
      if (name === q || handle === q) return 1000;
      if (name.startsWith(q) || handle.startsWith(q)) return 500;
      if (name.includes(q) || handle.includes(q)) return 250;
      if (role.includes(q)) return 80;
      return 0;
    }

    function filteredMembers() {
      const q = document.getElementById('search').value.trim().toLowerCase();
      const role = document.getElementById('roleFilter').value;
      const sort = document.getElementById('sortMode').value;
      let list = members.filter(member => {
        if (q && score(member, q) <= 0) return false;
        const roleText = String(member.role || '').toLowerCase();
        if (role === 'online') return member.online;
        if (role === 'friends') return member.friendStatus === 'friends';
        if (role === 'premium') return roleText.includes('premium') || roleText.includes('owner') || roleText.includes('admin');
        if (role === 'staff') return roleText.includes('owner') || roleText.includes('admin') || roleText.includes('moderator');
        return true;
      });
      list.sort((a, b) => {
        if (sort === 'name') return displayName(a).localeCompare(displayName(b));
        if (sort === 'online') return Number(b.online) - Number(a.online) || displayName(a).localeCompare(displayName(b));
        return score(b, q) - score(a, q) ||
          Number(b.online) - Number(a.online) ||
          (b.friendStatus === 'friends') - (a.friendStatus === 'friends') ||
          displayName(a).localeCompare(displayName(b));
      });
      return list;
    }

    function render() {
      const list = filteredMembers();
      renderStats(list);
      const grid = document.getElementById('membersGrid');
      if (!list.length) {
        grid.innerHTML = '<div class="empty">No members match that search.</div>';
        return;
      }
      grid.innerHTML = list.map(member => {
        const key = esc(keyFor(member));
        const role = roleClass(member.role);
        const handle = member.handle ? '@' + member.handle : member.email;
        const pfpSrc = safeImageSrc(member.pfp);
        const pfp = pfpSrc ? '<img src="' + esc(pfpSrc) + '" alt="" loading="lazy" decoding="async" referrerpolicy="no-referrer">' : esc(initials(member));
        const activity = member.online ? String(member.activity || member.playing || 'Online now') : 'Offline';
        const presencePage = member.online ? String(member.page || '/') : '';
        const inChat = member.online && /chat|matrix|encrypt/i.test(activity + ' ' + presencePage);
        return '<article class="member">' +
          '<div class="cover"><div class="avatar">' + pfp + '</div><span class="online-dot ' + (member.online ? 'on' : '') + '"></span></div>' +
          '<div class="body">' +
            '<div class="name-row"><div class="name">' + esc(displayName(member)) + '</div><span class="pill role ' + role + '">' + esc(member.role || 'member') + '</span></div>' +
            '<div class="handle">' + esc(handle) + '</div>' +
            '<div class="presence-detail ' + (member.online ? 'is-online' : '') + (inChat ? ' is-chat' : '') + '">' + esc(activity) + (presencePage ? '<code>' + esc(presencePage) + '</code>' : '') + '</div>' +
            (member.bio ? '<div class="bio">' + esc(member.bio) + '</div>' : '') +
          '</div>' +
          '<div class="actions">' +
            friendButton(member) +
            '<a href="' + esc(dmHref(member)) + '">Message</a>' +
            '<a href="' + esc(profileHref(member)) + '">Profile</a>' +
            '<button type="button" class="report-btn wide" data-action="report" data-key="' + key + '">Report Profile</button>' +
          '</div>' +
        '</article>';
      }).join('');
    }

    async function getCaptcha(action) {
      for (let i = 0; i < 50; i++) {
        if (window.getCaptchaToken && window.grecaptcha) break;
        await new Promise(resolve => setTimeout(resolve, 100));
      }
      return window.getCaptchaToken ? (await window.getCaptchaToken(action) || '') : '';
    }

    async function postJson(url, body) {
      const res = await fetch(url, {
        method: 'POST',
        credentials: 'include',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(body || {})
      });
      const data = await res.json().catch(() => ({}));
      if (!res.ok || data.error) throw new Error(data.error || 'Request failed');
      return data;
    }

    async function reload() {
      const res = await fetch('/api/members?t=' + Date.now(), { credentials: 'include', cache: 'no-store' });
      if (!res.ok) {
        document.getElementById('membersGrid').innerHTML = '<div class="empty">Please sign in to search members.</div>';
        return;
      }
      const data = await res.json();
      members = data.members || [];
      render();
    }

    async function sendFriendRequest(key, button) {
      button.disabled = true;
      button.textContent = 'Sending...';
      try {
        const recaptcha_token = await getCaptcha('friend_request');
        await postJson('/api/friends/request', { email: key, recaptcha_token });
        await reload();
      } catch (err) {
        alert(err.message);
        button.disabled = false;
        button.textContent = 'Add Friend';
      }
    }

    async function acceptRequest(key, button) {
      button.disabled = true;
      try {
        await postJson('/api/friends/request/respond', { email: key, action: 'accept' });
        await reload();
      } catch (err) {
        alert(err.message);
        button.disabled = false;
      }
    }

    async function cancelRequest(key, button) {
      button.disabled = true;
      try {
        await postJson('/api/friends/request/cancel', { email: key });
        await reload();
      } catch (err) {
        alert(err.message);
        button.disabled = false;
      }
    }

    function openReport(key) {
      const member = members.find(m => keyFor(m) === key);
      activeReportKey = key;
      document.getElementById('reportTarget').textContent = 'Report ' + displayName(member || { handle: key }) + ' to the admin team.';
      document.getElementById('reportDetails').value = '';
      document.getElementById('reportStatus').textContent = '';
      document.getElementById('reportStatus').className = 'status';
      document.getElementById('reportModal').classList.add('show');
    }

    function closeReport() {
      document.getElementById('reportModal').classList.remove('show');
      activeReportKey = '';
    }

    async function submitReport() {
      const status = document.getElementById('reportStatus');
      const button = document.getElementById('submitReport');
      const reason = document.getElementById('reportReason').value;
      const details = document.getElementById('reportDetails').value.trim();
      button.disabled = true;
      status.className = 'status';
      status.textContent = 'Sending report...';
      try {
        await postJson('/api/profile/report', { member: activeReportKey, reason, details });
        status.className = 'status ok';
        status.textContent = 'Report sent.';
        setTimeout(closeReport, 700);
      } catch (err) {
        status.className = 'status err';
        status.textContent = err.message;
      } finally {
        button.disabled = false;
      }
    }

    document.getElementById('membersGrid').addEventListener('click', event => {
      const control = event.target.closest('[data-action]');
      if (!control) return;
      const key = control.dataset.key;
      if (control.dataset.action === 'friend') sendFriendRequest(key, control);
      if (control.dataset.action === 'accept') acceptRequest(key, control);
      if (control.dataset.action === 'cancel') cancelRequest(key, control);
      if (control.dataset.action === 'report') openReport(key);
    });

    document.getElementById('search').addEventListener('input', render);
    document.getElementById('roleFilter').addEventListener('change', render);
    document.getElementById('sortMode').addEventListener('change', render);
    document.getElementById('cancelReport').addEventListener('click', closeReport);
    document.getElementById('submitReport').addEventListener('click', submitReport);
    document.getElementById('reportModal').addEventListener('click', event => {
      if (event.target.id === 'reportModal') closeReport();
    });

    reload();
  </script>
<script src="/cookie-consent.js" defer></script>
</body>
</html>
