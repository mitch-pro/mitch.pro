<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>Companion characters — mitch.pro</title>
  <link rel="icon" href="/favicon.ico">
  <link rel="stylesheet" href="/app.css">
  <link rel="stylesheet" href="/admin/admin.css">
  <link rel="stylesheet" href="/admin/companion/companion.css">
  <script src="/app-shell.js" defer></script>
  <script src="/admin/companion/companion.js?v=1" defer></script>
</head>
<body class="admin-page">
  <div class="shell">
    <header class="topbar">
      <h1>Companion characters</h1>
    </header>
    <p><a href="/admin/">Administration</a></p>

    <section class="companion-form-panel">
      <h2 id="form-heading">New character</h2>
      <form id="character-form">
        <input type="hidden" id="character-id">
        <label for="character-name">Name</label>
        <input id="character-name" type="text" maxlength="60" required>
        <label for="character-prompt">Personality prompt</label>
        <textarea id="character-prompt" rows="6" maxlength="4000" required></textarea>
        <label for="character-price">Price (coins to unlock, 0 = free)</label>
        <input id="character-price" type="number" min="0" step="1" value="0">
        <button type="submit" id="character-submit">Create character</button>
        <button type="button" id="character-cancel-edit" hidden>Cancel edit</button>
        <p id="character-status" role="status"></p>
      </form>
    </section>

    <section>
      <h2>Characters</h2>
      <div id="character-list"></div>
    </section>
  </div>
</body>
</html>
