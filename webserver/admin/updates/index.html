<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>Updates — mitch.pro</title>
  <link rel="icon" href="/favicon.ico">
  <link rel="stylesheet" href="/app.css">
  <link rel="stylesheet" href="/admin/updates/updates.css">
  <script src="/app-shell.js" defer></script>
  <script src="/admin/updates/updates.js" defer></script>
</head>
<body class="updates-page">
  <main class="updates-main">
    <header class="updates-heading">
      <a href="/admin/">Administration</a>
      <h1>Updates</h1>
      <p>Entries appear in the Updates list on the homepage, newest first. Nothing here comes from commits.</p>
      <p id="access-status" role="status">Checking admin access…</p>
    </header>

    <section class="updates-panel updates-lock" id="passphrase-lock" hidden>
      <h2 id="lock-heading">Unlock updates</h2>
      <form id="passphrase-form">
        <label for="admin-passphrase">Admin passphrase</label>
        <div class="unlock-row"><input id="admin-passphrase" type="password" autocomplete="current-password" minlength="4" required><button type="submit" id="unlock-button">Unlock</button></div>
        <p id="unlock-status" class="updates-status" role="status"></p>
      </form>
    </section>

    <div id="updates-workspace" hidden>
      <section class="updates-panel">
        <h2 id="form-heading">New entry</h2>
        <form id="entry-form">
          <label for="entry-title">Title</label>
          <input id="entry-title" type="text" maxlength="120" required autocomplete="off">
          <label for="entry-body">Details <small>(optional)</small></label>
          <textarea id="entry-body" maxlength="2000" rows="4"></textarea>
          <label for="entry-date">Date <small>(blank for today)</small></label>
          <input id="entry-date" type="date">
          <div class="updates-actions">
            <button type="submit" id="entry-save" class="updates-primary">Post</button>
            <button type="button" id="entry-cancel" hidden>Cancel edit</button>
          </div>
          <p id="entry-status" class="updates-status" role="status"></p>
        </form>
      </section>

      <section class="updates-panel">
        <h2>Posted entries</h2>
        <div id="entry-list" role="list"></div>
        <p id="list-status" class="updates-status" role="status"></p>
      </section>
    </div>
  </main>
<script src="/admin/passphrase-help.js" defer></script>
</body>
</html>
