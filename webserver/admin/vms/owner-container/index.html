<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>Container 500 · mitch.pro</title>
  <link rel="icon" href="/favicon.ico">
  <link rel="stylesheet" href="/app.css">
  <link rel="stylesheet" href="/admin/vms/owner-container/owner-container.css">
  <script src="/app-shell.js" defer></script>
  <script type="module" src="/admin/vms/owner-container/owner-container.js"></script>
</head>
<body>
  <main class="oc-shell">
    <header class="oc-header">
      <a href="/admin/" class="oc-back">&larr; Admin</a>
      <h1>Container 500</h1>
    </header>
    <p id="oc-message" class="oc-message" role="status"></p>
    <section id="oc-card" class="oc-card" hidden>
      <dl class="oc-stats">
        <div><dt>Name</dt><dd id="oc-name">-</dd></div>
        <div><dt>Status</dt><dd id="oc-status">-</dd></div>
        <div><dt>CPU</dt><dd id="oc-cpu">-</dd></div>
        <div><dt>Memory</dt><dd id="oc-mem">-</dd></div>
        <div><dt>Disk</dt><dd id="oc-disk">-</dd></div>
        <div><dt>Uptime</dt><dd id="oc-uptime">-</dd></div>
      </dl>
      <div class="oc-actions">
        <button type="button" data-power="start">Start</button>
        <button type="button" data-power="shutdown">Shut down</button>
        <button type="button" data-power="restart">Restart</button>
        <button type="button" data-power="force-stop" class="oc-danger">Force stop</button>
        <button type="button" id="oc-console" class="oc-primary">Open console</button>
        <button type="button" id="oc-refresh">Refresh</button>
      </div>
    </section>
    <div id="oc-screen" class="oc-screen" hidden></div>
  </main>
</body>
</html>
