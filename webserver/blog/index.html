<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Blog — mitch.pro</title>
<link rel="stylesheet" href="/app.css">
<script src="/api.js"></script>
<script src="/app-shell.js" defer></script>
<style>
  .page-head {
    display: grid;
    grid-template-columns: 1fr auto;
    gap: 1rem;
    align-items: end;
    margin-bottom: 1.1rem;
  }
  .page-head h1 {
    margin: 0;
    font-size: clamp(1.85rem, 4vw, 2.75rem);
    letter-spacing: -0.03em;
  }
  .page-sub {
    margin: 0.5rem 0 0;
    color: var(--t-fg2);
    font-size: 0.9rem;
    line-height: 1.5;
    max-width: 38rem;
  }
  .actions {
    display: flex;
    gap: 0.5rem;
    flex-wrap: wrap;
    align-items: center;
    justify-content: flex-end;
  }
  .actions button,
  .toolbar button,
  .mini-actions button,
  #postActions button,
  .panel-head button {
    appearance: none;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    min-height: 2.2rem;
    padding: 0.4rem 0.75rem;
    border: 1px solid var(--t-bd);
    border-radius: var(--t-radius, 8px);
    background: var(--t-bg2);
    color: var(--t-fg);
    font: inherit;
    font-weight: 600;
    font-size: 0.82rem;
    cursor: pointer;
    transition:
      border-color var(--t-motion, 0.15s) ease,
      background var(--t-motion, 0.15s) ease,
      color var(--t-motion, 0.15s) ease;
  }
  .actions button:hover,
  .toolbar button:hover,
  .mini-actions button:hover,
  #postActions button:hover,
  .panel-head button:hover {
    border-color: var(--t-ac);
    color: var(--t-fg);
  }
  .actions button.primary,
  button.primary {
    background: color-mix(in srgb, var(--t-ac) 88%, #000 12%);
    color: #fff;
    border-color: var(--t-bda, transparent);
  }
  button:disabled { opacity: 0.55; cursor: not-allowed; }
  .toggle-row {
    display: flex;
    align-items: center;
    gap: 0.45rem;
    color: var(--t-fg2);
    font-size: 0.8rem;
    font-weight: 600;
    min-height: 2.2rem;
    padding: 0 0.35rem;
  }
  .toggle-row input {
    width: 1rem;
    min-width: 1rem;
    height: 1rem;
    accent-color: var(--t-ac);
  }
  .filterbar {
    display: grid;
    grid-template-columns: 1fr 10rem 10rem;
    gap: 0.5rem;
    margin: 0 0 1rem;
  }
  .layout {
    display: grid;
    grid-template-columns: minmax(16rem, 22rem) minmax(0, 1fr);
    gap: 0.85rem;
    align-items: start;
  }
  .blog-panel {
    border: 1px solid var(--t-bd);
    border-radius: var(--t-radius, 8px);
    background: color-mix(in srgb, var(--t-bg2) 78%, transparent);
    overflow: hidden;
  }
  .panel-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 0.65rem;
    padding: 0.75rem 0.85rem;
    border-bottom: 1px solid var(--t-bd);
  }
  .panel-title {
    font-family: Outfit, system-ui, sans-serif;
    font-size: 0.72rem;
    text-transform: uppercase;
    letter-spacing: 0.07em;
    font-weight: 750;
    color: var(--t-fg2);
  }
  .post-list {
    display: grid;
    gap: 0;
    max-height: calc(100vh - 14rem);
    overflow: auto;
  }
  .post-item {
    text-align: left;
    width: 100%;
    border: 0;
    border-bottom: 1px solid var(--t-bd);
    border-radius: 0;
    background: transparent;
    color: inherit;
    padding: 0.85rem;
    cursor: pointer;
    font: inherit;
    transition: background var(--t-motion, 0.15s) ease;
  }
  .post-item:hover,
  .post-item.active {
    background: color-mix(in srgb, var(--t-ac) 8%, transparent);
  }
  .post-item.featured {
    box-shadow: inset 3px 0 0 color-mix(in srgb, #fbbf24 80%, var(--t-ac));
  }
  .post-item b {
    display: block;
    font-family: Outfit, system-ui, sans-serif;
    font-size: 0.95rem;
    line-height: 1.25;
    margin-bottom: 0.3rem;
    font-weight: 750;
  }
  .meta {
    color: var(--t-fg2);
    font-size: 0.74rem;
    line-height: 1.4;
  }
  .excerpt {
    color: var(--t-fg2);
    font-size: 0.78rem;
    line-height: 1.45;
    margin-top: 0.4rem;
  }
  .badge,
  .tag-pill {
    display: inline-flex;
    align-items: center;
    min-height: 1.25rem;
    border: 1px solid var(--t-bd);
    border-radius: 999px;
    padding: 0.1rem 0.45rem;
    color: var(--t-fg2);
    font-size: 0.68rem;
    font-weight: 700;
    background: var(--t-bg3);
  }
  .badge.draft {
    color: #fbbf24;
    border-color: rgba(251,191,36,.4);
    background: rgba(251,191,36,.08);
  }
  .badge.scheduled {
    color: #38bdf8;
    border-color: rgba(56,189,248,.4);
    background: rgba(56,189,248,.08);
  }
  .tag-row {
    display: flex;
    flex-wrap: wrap;
    gap: 0.35rem;
    margin-top: 0.5rem;
  }
  .reader { min-height: 32rem; }
  .article { padding: 1.35rem; }
  .article h2 {
    margin: 0 0 0.5rem;
    font-size: clamp(1.45rem, 3vw, 2.2rem);
    letter-spacing: -0.03em;
  }
  .article-body {
    margin-top: 1.35rem;
    color: var(--t-fg);
    font-size: 1rem;
    line-height: 1.72;
    overflow-wrap: anywhere;
  }
  .cover-image {
    display: block;
    width: 100%;
    max-height: 22rem;
    object-fit: cover;
    margin: 0 0 1.1rem;
    border-radius: var(--t-radius, 8px);
    border: 1px solid var(--t-bd);
    background: var(--t-bg3);
  }
  .article-body p, .doc-editor p { margin: 0 0 1rem; }
  .article-body h2, .doc-editor h2 { font-size: 1.45rem; margin: 1.1rem 0 0.5rem; line-height: 1.2; }
  .article-body h3, .doc-editor h3 { font-size: 1.15rem; margin: 1rem 0 0.4rem; line-height: 1.25; }
  .article-body a, .doc-editor a { color: var(--t-ac); text-decoration: underline; }
  .article-body blockquote, .doc-editor blockquote {
    margin: 1rem 0;
    padding: 0.75rem 1rem;
    border-left: 3px solid var(--t-ac);
    background: color-mix(in srgb, var(--t-bg3) 80%, transparent);
    color: var(--t-fg2);
  }
  .article-body pre, .doc-editor pre {
    overflow: auto;
    padding: 0.75rem;
    border: 1px solid var(--t-bd);
    border-radius: var(--t-radius, 8px);
    background: var(--t-bg3);
    font: 600 0.84rem/1.55 ui-monospace, SFMono-Regular, Menlo, monospace;
  }
  .article-body code, .doc-editor code {
    padding: 0.1rem 0.3rem;
    border-radius: 5px;
    background: color-mix(in srgb, var(--t-fg) 8%, transparent);
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
  }
  .article-body img, .doc-editor img {
    display: block;
    max-width: 100%;
    max-height: 38rem;
    margin: 1rem auto;
    border-radius: var(--t-radius, 8px);
    border: 1px solid var(--t-bd);
    background: var(--t-bg3);
  }
  .article-body ul, .article-body ol, .doc-editor ul, .doc-editor ol { padding-left: 1.4rem; margin: 0.75rem 0 1rem; }
  .article-body hr, .doc-editor hr { border: 0; border-top: 1px solid var(--t-bd); margin: 1.4rem 0; }
  .empty {
    color: var(--t-fg2);
    padding: 1.6rem;
    text-align: center;
    line-height: 1.45;
  }
  .editor { display: none; margin-top: 0.85rem; }
  .editor.open { display: block; }
  .editor form {
    display: grid;
    gap: 0.65rem;
    padding: 0.9rem;
  }
  input, textarea, select {
    width: 100%;
    border: 1px solid var(--t-bd);
    border-radius: var(--t-radius, 8px);
    background: var(--t-bg2);
    color: var(--t-fg);
    font: inherit;
    padding: 0.65rem 0.75rem;
    outline: none;
    transition: border-color var(--t-motion, 0.15s), box-shadow var(--t-motion, 0.15s);
  }
  input:focus, textarea:focus, select:focus {
    border-color: var(--t-ac);
    box-shadow: 0 0 0 3px var(--t-gls);
  }
  textarea {
    min-height: 16rem;
    resize: vertical;
    line-height: 1.55;
  }
  .toolbar {
    display: flex;
    flex-wrap: wrap;
    gap: 0.35rem;
    padding: 0.65rem;
    border: 1px solid var(--t-bd);
    border-radius: var(--t-radius, 8px);
    background: color-mix(in srgb, var(--t-bg3) 70%, transparent);
  }
  .toolbar button, .toolbar select {
    width: auto;
    min-height: 2rem;
    padding: 0.35rem 0.55rem;
    font-size: 0.75rem;
    margin: 0;
  }
  .toolbar select { min-width: 8rem; }
  .doc-editor {
    min-height: 22rem;
    max-height: 70vh;
    overflow: auto;
    border: 1px solid var(--t-bd);
    border-radius: var(--t-radius, 8px);
    background: var(--t-bg2);
    color: var(--t-fg);
    padding: 1.1rem;
    line-height: 1.7;
    outline: none;
  }
  .doc-editor:focus { border-color: var(--t-bda, var(--t-ac)); box-shadow: 0 0 0 3px var(--t-gls); }
  .doc-editor:empty::before {
    content: "Write the post...";
    color: var(--t-fg2);
    pointer-events: none;
  }
  .editor-row {
    display: grid;
    grid-template-columns: 10rem 1fr;
    gap: 0.65rem;
  }
  .inline-check {
    display: flex;
    align-items: center;
    gap: 0.45rem;
    color: var(--t-fg2);
    font-size: 0.82rem;
    font-weight: 650;
  }
  .inline-check input { width: 1rem; min-width: 1rem; height: 1rem; }
  .side-panels {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 0.85rem;
    margin-top: 0.85rem;
  }
  .mini-list { display: grid; gap: 0.5rem; padding: 0.75rem; }
  .mini-card {
    border: 1px solid var(--t-bd);
    border-radius: var(--t-radius, 8px);
    background: var(--t-bg2);
    padding: 0.65rem;
  }
  .mini-card.pending { border-color: rgba(251,191,36,.4); }
  .mini-actions { display: flex; gap: 0.35rem; flex-wrap: wrap; margin-top: 0.5rem; }
  .comment-form {
    display: grid;
    gap: 0.5rem;
    padding: 0.75rem;
    border-top: 1px solid var(--t-bd);
  }
  .comment-form textarea { min-height: 5rem; }
  #imageFile { display: none; }
  #toast {
    position: fixed;
    right: 1rem;
    bottom: 1rem;
    z-index: 9999;
    max-width: min(26rem, calc(100vw - 2rem));
    display: none;
    border-radius: var(--t-radius, 8px);
    padding: 0.7rem 0.85rem;
    font-weight: 700;
    font-size: 0.88rem;
  }
  #toast.ok { display: block; background: #16a34a; color: #fff; }
  #toast.err { display: block; background: #dc2626; color: #fff; }
  @media (max-width: 820px) {
    .page-head { grid-template-columns: 1fr; align-items: stretch; }
    .actions { justify-content: stretch; }
    .actions .btn, .actions button, .actions a.btn { flex: 1 1 auto; text-align: center; }
    .layout { grid-template-columns: 1fr; }
    .post-list { max-height: none; }
    .reader { min-height: 22rem; }
    .article { padding: 1rem; }
    .editor-row { grid-template-columns: 1fr; }
    .filterbar, .side-panels { grid-template-columns: 1fr; }
    .toolbar button { flex: 1 1 2.6rem; }
  }
  @media (prefers-reduced-motion: reduce) {
    .post-item, input, textarea, select, .actions button { transition: none; }
  }
  .theme-no-motion .post-item,
  .theme-no-motion input,
  .theme-no-motion textarea,
  .theme-no-motion select,
  .theme-no-motion .actions button {
    transition: none;
  }
</style>
</head>
<body>
<main class="app-main">
  <header class="page-head">
    <div>
      <h1>Blog</h1>
      <p class="page-sub">Posts from mitch.pro staff and contributors.</p>
    </div>
    <div class="actions">
      <a class="btn" href="/preferences/#privacy">Preferences</a>
      <label class="toggle-row"><input id="alertToggle" type="checkbox"> Email alerts</label>
      <button id="newPostBtn" class="primary" type="button" style="display:none;">New Post</button>
    </div>
  </header>

  <div class="filterbar panel" style="padding:0.65rem;margin-bottom:1rem;">
    <input id="blogSearch" type="search" placeholder="Search posts, tags, categories...">
    <select id="categoryFilter"><option value="">All categories</option></select>
    <select id="tagFilter"><option value="">All tags</option></select>
  </div>

  <div class="layout">
    <aside class="blog-panel">
      <div class="panel-head">
        <div class="panel-title">Posts</div>
        <span id="postCount" class="badge">0</span>
      </div>
      <div id="postList" class="post-list"><div class="empty">Loading posts...</div></div>
    </aside>

    <section>
      <div class="blog-panel reader">
        <div class="panel-head">
          <div class="panel-title">Reader</div>
          <div id="postActions" class="actions"></div>
        </div>
        <article id="article" class="article"><div class="empty">Select a post to read.</div></article>
      </div>

      <div class="side-panels">
        <div class="blog-panel">
          <div class="panel-head">
            <div class="panel-title">Comments</div>
            <span id="commentCount" class="badge">0</span>
          </div>
          <div id="commentList" class="mini-list"><div class="empty">Select a post to view comments.</div></div>
          <form id="commentForm" class="comment-form">
            <textarea id="commentBody" maxlength="1200" placeholder="Add a comment..."></textarea>
            <button type="submit">Post Comment</button>
            <div id="commentStatus" class="meta"></div>
          </form>
        </div>
        <div class="blog-panel">
          <div class="panel-head">
            <div class="panel-title">Revisions</div>
            <button type="button" onclick="loadRevisions()">Refresh</button>
          </div>
          <div id="revisionList" class="mini-list"><div class="empty">Writers can view revisions here.</div></div>
        </div>
      </div>

      <div id="editor" class="blog-panel editor">
        <div class="panel-head">
          <div class="panel-title" id="editorTitle">New Post</div>
          <button type="button" onclick="closeEditor()">Close</button>
        </div>
        <form id="postForm">
          <input id="postTitle" maxlength="140" placeholder="Post title" required>
          <div class="editor-row">
            <input id="postTags" maxlength="260" placeholder="Tags, separated by commas">
            <input id="postCategory" maxlength="40" placeholder="Category">
          </div>
          <div class="editor-row">
            <input id="postCover" maxlength="800" placeholder="Cover image URL">
            <input id="postSchedule" type="datetime-local" aria-label="Scheduled publish time">
          </div>
          <div class="actions">
            <button type="button" id="uploadBtn">Upload Image</button>
            <input id="imageFile" type="file" accept="image/png,image/jpeg,image/gif,image/webp">
            <label class="inline-check"><input id="postFeatured" type="checkbox"> Featured</label>
          </div>
          <div class="toolbar" aria-label="Editor toolbar">
            <select id="blockFormat" title="Text style">
              <option value="p">Paragraph</option>
              <option value="h2">Heading</option>
              <option value="h3">Subheading</option>
              <option value="blockquote">Quote</option>
              <option value="pre">Code block</option>
            </select>
            <button type="button" data-cmd="bold" title="Bold"><b>B</b></button>
            <button type="button" data-cmd="italic" title="Italic"><i>I</i></button>
            <button type="button" data-cmd="underline" title="Underline"><u>U</u></button>
            <button type="button" data-cmd="strikeThrough" title="Strikethrough"><s>S</s></button>
            <button type="button" data-cmd="insertUnorderedList" title="Bulleted list">UL</button>
            <button type="button" data-cmd="insertOrderedList" title="Numbered list">OL</button>
            <button type="button" id="linkBtn" title="Insert link">Link</button>
            <button type="button" id="imageBtn" title="Insert image by URL">Image</button>
            <button type="button" id="dividerBtn" title="Insert divider">Line</button>
            <button type="button" data-cmd="removeFormat" title="Clear formatting">Clear</button>
          </div>
          <div id="postBody" class="doc-editor" contenteditable="true" role="textbox" aria-multiline="true"></div>
          <div class="editor-row">
            <select id="postStatus">
              <option value="published">Publish</option>
              <option value="scheduled">Schedule</option>
              <option value="draft">Save as draft</option>
            </select>
            <button class="primary" type="submit">Save Post</button>
          </div>
          <div id="editorStatus" class="meta"></div>
        </form>
      </div>
    </section>
  </div>
</main>
<div id="toast"></div>

<script>
let posts = [];
let selected = null;
let currentPost = null;
let canWrite = false;
let editingSlug = '';
let allCategories = [];
let allTags = [];

function esc(value) {
  return String(value ?? '').replace(/[&<>"']/g, ch => ({
    '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
  }[ch]));
}
function legacyTextToHtml(text) {
  return String(text || '').trim().split(/\n{2,}/).map(part => '<p>' + esc(part).replace(/\n/g, '<br>') + '</p>').join('') || '<p></p>';
}
function safeUrl(value, image) {
  const raw = String(value || '').trim();
  if (/^https?:\/\//i.test(raw)) return raw;
  if (!image && (/^\//.test(raw) || /^mailto:[^@\s]+@[^@\s]+\.[^@\s]+$/i.test(raw))) return raw;
  return '';
}
function sanitizeClientHtml(html) {
  const tpl = document.createElement('template');
  tpl.innerHTML = String(html || '');
  const allowed = new Set(['p','br','strong','b','em','i','u','s','a','h2','h3','ul','ol','li','blockquote','pre','code','img','hr','span','div']);
  const alias = { div: 'p', b: 'strong', i: 'em' };
  function clean(node) {
    if (node.nodeType === Node.TEXT_NODE) return document.createTextNode(node.textContent || '');
    if (node.nodeType !== Node.ELEMENT_NODE) return document.createDocumentFragment();
    const raw = node.tagName.toLowerCase();
    if (!allowed.has(raw)) {
      const frag = document.createDocumentFragment();
      Array.from(node.childNodes).forEach(child => frag.appendChild(clean(child)));
      return frag;
    }
    const tag = alias[raw] || raw;
    if (tag === 'br' || tag === 'hr') return document.createElement(tag);
    if (tag === 'img') {
      const src = safeUrl(node.getAttribute('src'), true);
      if (!src) return document.createDocumentFragment();
      const img = document.createElement('img');
      img.src = src;
      img.alt = String(node.getAttribute('alt') || '').slice(0, 140);
      return img;
    }
    const el = document.createElement(tag);
    if (tag === 'a') {
      const href = safeUrl(node.getAttribute('href'), false);
      if (href) {
        el.href = href;
        el.target = '_blank';
        el.rel = 'noopener noreferrer';
      }
    }
    Array.from(node.childNodes).forEach(child => el.appendChild(clean(child)));
    return el;
  }
  const out = document.createElement('div');
  Array.from(tpl.content.childNodes).forEach(node => out.appendChild(clean(node)));
  return out.innerHTML;
}
function fmtDate(ts) {
  ts = Number(ts || 0);
  if (!ts) return 'Draft';
  return new Date(ts).toLocaleDateString([], { month: 'short', day: 'numeric', year: 'numeric' });
}
function toDatetimeLocal(ts) {
  ts = Number(ts || 0);
  if (!ts) return '';
  const d = new Date(ts);
  d.setMinutes(d.getMinutes() - d.getTimezoneOffset());
  return d.toISOString().slice(0, 16);
}
function fromDatetimeLocal(value) {
  return value ? new Date(value).getTime() : 0;
}
function toast(text, ok = true) {
  const el = document.getElementById('toast');
  el.textContent = text;
  el.className = ok ? 'ok' : 'err';
  clearTimeout(toast.timer);
  toast.timer = setTimeout(() => { el.className = ''; }, 3200);
}
function setEditorStatus(text) {
  document.getElementById('editorStatus').textContent = text || '';
}
function matchesFilters(post) {
  const q = document.getElementById('blogSearch').value.trim().toLowerCase();
  const cat = document.getElementById('categoryFilter').value;
  const tag = document.getElementById('tagFilter').value;
  if (cat && post.category !== cat) return false;
  if (tag && !(post.tags || []).includes(tag)) return false;
  if (!q) return true;
  const haystack = [post.title, post.excerpt, post.category, ...(post.tags || [])].join(' ').toLowerCase();
  return haystack.includes(q);
}
function renderFilters() {
  const cat = document.getElementById('categoryFilter');
  const tag = document.getElementById('tagFilter');
  const oldCat = cat.value;
  const oldTag = tag.value;
  cat.innerHTML = '<option value="">All categories</option>' + allCategories.map(v => '<option value="' + esc(v) + '">' + esc(v) + '</option>').join('');
  tag.innerHTML = '<option value="">All tags</option>' + allTags.map(v => '<option value="' + esc(v) + '">' + esc(v) + '</option>').join('');
  cat.value = allCategories.includes(oldCat) ? oldCat : '';
  tag.value = allTags.includes(oldTag) ? oldTag : '';
}
function renderList() {
  const visible = posts.filter(matchesFilters);
  document.getElementById('postCount').textContent = String(visible.length);
  const root = document.getElementById('postList');
  if (!visible.length) {
    root.innerHTML = '<div class="empty">No matching blog posts.</div>';
    return;
  }
  root.innerHTML = visible.map(post => `
    <button class="post-item ${post.slug === selected ? 'active' : ''} ${post.featured ? 'featured' : ''}" type="button" data-slug="${esc(post.slug)}">
      <b>${post.featured ? '★ ' : ''}${esc(post.title)}</b>
      <span class="meta">${esc(post.authorName || 'mitch.pro')} · ${esc(fmtDate(post.publishedAt || post.updatedAt || post.createdAt))}</span>
      ${post.status === 'draft' ? '<span class="badge draft">Draft</span>' : ''}
      ${post.status === 'scheduled' ? '<span class="badge scheduled">Scheduled</span>' : ''}
      <div class="excerpt">${esc(post.excerpt || '')}</div>
      ${post.category ? '<div class="meta">' + esc(post.category) + '</div>' : ''}
      ${(post.tags || []).length ? '<div class="tag-row">' + post.tags.map(tag => '<span class="tag-pill">' + esc(tag) + '</span>').join('') + '</div>' : ''}
    </button>
  `).join('');
  root.querySelectorAll('[data-slug]').forEach(btn => {
    btn.addEventListener('click', () => loadPost(btn.dataset.slug));
  });
}
function renderArticle(post) {
  currentPost = post;
  document.title = post ? post.title + ' - Blog - mitch.pro' : 'Blog - mitch.pro';
  if (!post) {
    document.getElementById('article').innerHTML = '<div class="empty">Select a post to read.</div>';
    document.getElementById('postActions').innerHTML = '';
    return;
  }
  document.getElementById('article').innerHTML = `
    ${post.coverImage ? '<img class="cover-image" src="' + esc(post.coverImage) + '" alt="">' : ''}
    <h2>${esc(post.title)}</h2>
    <div class="meta">By ${esc(post.authorName || 'mitch.pro')} · ${esc(fmtDate(post.publishedAt || post.publishAt || post.updatedAt || post.createdAt))}${post.category ? ' · ' + esc(post.category) : ''}</div>
    ${post.status === 'scheduled' ? '<div class="badge scheduled">Scheduled for ' + esc(fmtDate(post.publishAt)) + '</div>' : ''}
    ${(post.tags || []).length ? '<div class="tag-row">' + post.tags.map(tag => '<span class="tag-pill">' + esc(tag) + '</span>').join('') + '</div>' : ''}
    <div class="article-body">${sanitizeClientHtml(post.bodyHtml || legacyTextToHtml(post.body || ''))}</div>
  `;
  document.getElementById('postActions').innerHTML = [
    post.canEdit ? '<button type="button" onclick="editCurrentPost()">Edit</button>' : '',
    post.canDelete ? '<button type="button" onclick="deleteCurrentPost()">Delete</button>' : ''
  ].join('');
}
async function loadPosts() {
  const res = await fetch('/api/blog/posts', { credentials: 'include', cache: 'no-store' });
  if (res.status === 401) { location.href = '/enroll/'; return; }
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.error || 'Could not load posts');
  posts = data.posts || [];
  allCategories = data.categories || [];
  allTags = data.tags || [];
  canWrite = !!data.canWrite;
  document.getElementById('newPostBtn').style.display = canWrite ? '' : 'none';
  renderFilters();
  renderList();
  const hashSlug = location.hash.startsWith('#post/') ? decodeURIComponent(location.hash.slice(6)) : '';
  if (hashSlug) await loadPost(hashSlug);
  else if (posts[0]) await loadPost(posts[0].slug);
  else renderArticle(null);
}
async function loadPost(slug) {
  selected = slug;
  renderList();
  const res = await fetch('/api/blog/posts/' + encodeURIComponent(slug), { credentials: 'include', cache: 'no-store' });
  const data = await res.json().catch(() => ({}));
  if (!res.ok) {
    toast(data.error || 'Could not load post', false);
    return;
  }
  history.replaceState(null, '', '#post/' + encodeURIComponent(data.post.slug));
  selected = data.post.slug;
  renderList();
  renderArticle(data.post);
  await loadComments(data.post);
  await loadRevisions(data.post);
}
function openEditor(post) {
  if (!canWrite && !post) return;
  editingSlug = post ? post.slug : '';
  document.getElementById('editorTitle').textContent = post ? 'Edit Post' : 'New Post';
  document.getElementById('postTitle').value = post ? post.title || '' : '';
  document.getElementById('postTags').value = post && post.tags ? post.tags.join(', ') : '';
  document.getElementById('postCategory').value = post ? post.category || '' : '';
  document.getElementById('postCover').value = post ? post.coverImage || '' : '';
  document.getElementById('postSchedule').value = post ? toDatetimeLocal(post.publishAt || 0) : '';
  document.getElementById('postFeatured').checked = !!(post && post.featured);
  document.getElementById('postBody').innerHTML = post ? sanitizeClientHtml(post.bodyHtml || legacyTextToHtml(post.body || '')) : '';
  document.getElementById('postStatus').value = post && post.status === 'draft' ? 'draft' : (post && post.status === 'scheduled' ? 'scheduled' : 'published');
  setEditorStatus('');
  document.getElementById('editor').classList.add('open');
  document.getElementById('postTitle').focus();
}
function closeEditor() {
  document.getElementById('editor').classList.remove('open');
  editingSlug = '';
}
function editCurrentPost() {
  if (currentPost) openEditor(currentPost);
}
async function deleteCurrentPost() {
  if (!currentPost || !(await customConfirm('Delete', 'Delete "' + currentPost.title + '"?'))) return;
  const res = await fetch('/api/blog/posts/' + encodeURIComponent(currentPost.slug), {
    method: 'DELETE',
    credentials: 'include'
  });
  const data = await res.json().catch(() => ({}));
  if (!res.ok) return toast(data.error || 'Could not delete post', false);
  toast('Post deleted');
  selected = null;
  currentPost = null;
  closeEditor();
  await loadPosts();
}
async function loadComments(post = currentPost) {
  const list = document.getElementById('commentList');
  if (!post) {
    list.innerHTML = '<div class="empty">Select a post to view comments.</div>';
    document.getElementById('commentCount').textContent = '0';
    return;
  }
  try {
    const res = await fetch('/api/blog/posts/' + encodeURIComponent(post.slug) + '/comments', { credentials: 'include', cache: 'no-store' });
    const data = await res.json().catch(() => ({}));
    if (!res.ok) throw new Error(data.error || 'Could not load comments');
    const comments = data.comments || [];
    document.getElementById('commentCount').textContent = String(comments.length);
    list.innerHTML = comments.length ? comments.map(comment => `
      <div class="mini-card ${comment.status === 'pending' ? 'pending' : ''}">
        <div class="meta">${esc(comment.authorName || 'User')} · ${esc(fmtDate(comment.ts))} · ${esc(comment.status || '')}</div>
        <div style="margin-top:6px;line-height:1.45;">${esc(comment.body || '')}</div>
        <div class="mini-actions">
          ${data.canModerate && comment.status !== 'approved' ? '<button type="button" data-comment-id="' + esc(comment.id) + '" data-comment-action="approved">Approve</button>' : ''}
          ${data.canModerate && comment.status !== 'rejected' ? '<button type="button" data-comment-id="' + esc(comment.id) + '" data-comment-action="rejected">Reject</button>' : ''}
          ${comment.canDelete ? '<button type="button" data-comment-id="' + esc(comment.id) + '" data-comment-action="delete">Delete</button>' : ''}
        </div>
      </div>
    `).join('') : '<div class="empty">No comments yet.</div>';
    list.querySelectorAll('[data-comment-action]').forEach(btn => {
      btn.addEventListener('click', () => {
        if (btn.dataset.commentAction === 'delete') deleteComment(btn.dataset.commentId);
        else moderateComment(btn.dataset.commentId, btn.dataset.commentAction);
      });
    });
  } catch (err) {
    list.innerHTML = '<div class="empty">' + esc(err.message || 'Could not load comments') + '</div>';
  }
}
async function submitComment(event) {
  event.preventDefault();
  if (!currentPost) return;
  const body = document.getElementById('commentBody').value.trim();
  if (!body) return;
  document.getElementById('commentStatus').textContent = 'Posting...';
  const res = await fetch('/api/blog/posts/' + encodeURIComponent(currentPost.slug) + '/comments', {
    method: 'POST',
    credentials: 'include',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ body })
  });
  const data = await res.json().catch(() => ({}));
  if (!res.ok) {
    document.getElementById('commentStatus').textContent = data.error || 'Could not post comment';
    return;
  }
  document.getElementById('commentBody').value = '';
  document.getElementById('commentStatus').textContent = data.pending ? 'Comment submitted for review.' : 'Comment posted.';
  await loadComments();
}
async function moderateComment(id, status) {
  if (!currentPost) return;
  const res = await fetch('/api/blog/posts/' + encodeURIComponent(currentPost.slug) + '/comments/' + encodeURIComponent(id), {
    method: 'PATCH',
    credentials: 'include',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ status })
  });
  if (!res.ok) toast('Could not update comment', false);
  await loadComments();
}
async function deleteComment(id) {
  if (!currentPost || !(await customConfirm('Delete', 'Delete this comment?'))) return;
  const res = await fetch('/api/blog/posts/' + encodeURIComponent(currentPost.slug) + '/comments/' + encodeURIComponent(id), {
    method: 'DELETE',
    credentials: 'include'
  });
  if (!res.ok) toast('Could not delete comment', false);
  await loadComments();
}
async function loadRevisions(post = currentPost) {
  const list = document.getElementById('revisionList');
  if (!post || !post.canEdit) {
    list.innerHTML = '<div class="empty">Writers can view revisions here.</div>';
    return;
  }
  try {
    const res = await fetch('/api/blog/posts/' + encodeURIComponent(post.slug) + '/revisions', { credentials: 'include', cache: 'no-store' });
    const data = await res.json().catch(() => ({}));
    if (!res.ok) throw new Error(data.error || 'Could not load revisions');
    const revisions = data.revisions || [];
    list.innerHTML = revisions.length ? revisions.map(rev => `
      <div class="mini-card">
        <div class="meta">${esc(fmtDate(rev.ts))} · ${esc(rev.reason || 'edit')} · ${esc(rev.actorEmail || '')}</div>
        <strong>${esc(rev.title || 'Untitled')}</strong>
        <div class="mini-actions"><button type="button" onclick="restoreRevision('${esc(rev.id)}')">Restore</button></div>
      </div>
    `).join('') : '<div class="empty">No revisions yet.</div>';
  } catch (err) {
    list.innerHTML = '<div class="empty">' + esc(err.message || 'Could not load revisions') + '</div>';
  }
}
async function restoreRevision(id) {
  if (!currentPost || !(await customConfirm('Restore', 'Restore this revision? Current content will be saved as a new revision.'))) return;
  const res = await fetch('/api/blog/posts/' + encodeURIComponent(currentPost.slug) + '/restore', {
    method: 'POST',
    credentials: 'include',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ revisionId: id })
  });
  const data = await res.json().catch(() => ({}));
  if (!res.ok) return toast(data.error || 'Could not restore revision', false);
  toast('Revision restored');
  await loadPosts();
  await loadPost(data.post.slug);
}
async function savePost(event) {
  event.preventDefault();
  setEditorStatus('Saving...');
  const editor = document.getElementById('postBody');
  const cleanHtml = sanitizeClientHtml(editor.innerHTML);
  editor.innerHTML = cleanHtml;
  const payload = {
    title: document.getElementById('postTitle').value,
    tags: document.getElementById('postTags').value,
    category: document.getElementById('postCategory').value,
    coverImage: document.getElementById('postCover').value,
    featured: document.getElementById('postFeatured').checked,
    publishAt: fromDatetimeLocal(document.getElementById('postSchedule').value),
    body: editor.textContent.trim(),
    bodyHtml: cleanHtml,
    status: document.getElementById('postStatus').value
  };
  const url = editingSlug ? '/api/blog/posts/' + encodeURIComponent(editingSlug) : '/api/blog/posts';
  const method = editingSlug ? 'PATCH' : 'POST';
  const res = await fetch(url, {
    method,
    credentials: 'include',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(payload)
  });
  const data = await res.json().catch(() => ({}));
  if (!res.ok) {
    setEditorStatus(data.error || 'Could not save post');
    toast(data.error || 'Could not save post', false);
    return;
  }
  toast(payload.status === 'draft' ? 'Draft saved' : 'Post published');
  closeEditor();
  await loadPosts();
  await loadPost(data.post.slug);
}
async function uploadImageFile(file) {
  if (!file) return;
  if (!/^image\/(png|jpe?g|gif|webp)$/i.test(file.type)) return toast('Unsupported image type', false);
  if (file.size > 900000) return toast('Image is too large', false);
  const data = await new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => resolve(String(reader.result || ''));
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
  const res = await fetch('/api/blog/upload', {
    method: 'POST',
    credentials: 'include',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ mime: file.type, name: file.name, data })
  });
  const result = await res.json().catch(() => ({}));
  if (!res.ok) return toast(result.error || 'Could not upload image', false);
  document.getElementById('postBody').focus();
  document.execCommand('insertImage', false, result.url);
  document.getElementById('postCover').value ||= result.url;
  toast('Image uploaded');
}
function runCommand(cmd, value) {
  const editor = document.getElementById('postBody');
  editor.focus();
  document.execCommand(cmd, false, value || null);
}
document.querySelectorAll('[data-cmd]').forEach(btn => {
  btn.addEventListener('click', () => runCommand(btn.dataset.cmd));
});
document.getElementById('blockFormat').addEventListener('change', function() {
  runCommand('formatBlock', this.value);
  this.value = 'p';
});
document.getElementById('linkBtn').addEventListener('click', async () => {
  const href = safeUrl(await customPrompt('Insert Link', 'Link URL'), false);
  if (!href) return;
  runCommand('createLink', href);
  document.querySelectorAll('#postBody a').forEach(a => {
    a.target = '_blank';
    a.rel = 'noopener noreferrer';
  });
});
document.getElementById('imageBtn').addEventListener('click', async () => {
  const src = safeUrl(await customPrompt('Insert Image', 'Image URL'), true);
  if (!src) return;
  runCommand('insertImage', src);
});
document.getElementById('dividerBtn').addEventListener('click', () => runCommand('insertHorizontalRule'));
document.getElementById('postBody').addEventListener('paste', event => {
  event.preventDefault();
  const html = event.clipboardData.getData('text/html');
  const text = event.clipboardData.getData('text/plain');
  const safe = html ? sanitizeClientHtml(html) : legacyTextToHtml(text);
  document.execCommand('insertHTML', false, safe);
});
async function loadSubscription() {
  const res = await fetch('/api/blog/subscription', { credentials: 'include', cache: 'no-store' });
  if (!res.ok) return;
  const data = await res.json().catch(() => ({}));
  document.getElementById('alertToggle').checked = data.enabled === true;
}
async function saveSubscription() {
  const enabled = document.getElementById('alertToggle').checked;
  const res = await fetch('/api/blog/subscription', {
    method: 'POST',
    credentials: 'include',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ enabled })
  });
  const data = await res.json().catch(() => ({}));
  if (!res.ok) {
    document.getElementById('alertToggle').checked = !enabled;
    toast(data.error || 'Could not update alerts', false);
    return;
  }
  toast(enabled ? 'Blog email alerts enabled' : 'Blog email alerts disabled');
}
document.getElementById('newPostBtn').addEventListener('click', () => openEditor(null));
document.getElementById('postForm').addEventListener('submit', savePost);
document.getElementById('commentForm').addEventListener('submit', submitComment);
document.getElementById('alertToggle').addEventListener('change', saveSubscription);
document.getElementById('blogSearch').addEventListener('input', renderList);
document.getElementById('categoryFilter').addEventListener('change', renderList);
document.getElementById('tagFilter').addEventListener('change', renderList);
document.getElementById('uploadBtn').addEventListener('click', () => document.getElementById('imageFile').click());
document.getElementById('imageFile').addEventListener('change', event => {
  uploadImageFile(event.target.files && event.target.files[0]);
  event.target.value = '';
});
window.addEventListener('hashchange', () => {
  if (location.hash.startsWith('#post/')) loadPost(decodeURIComponent(location.hash.slice(6)));
});
Promise.all([loadSubscription(), loadPosts()]).catch(err => {
  document.getElementById('postList').innerHTML = '<div class="empty">Failed to load blog.</div>';
  toast(err.message || 'Failed to load blog', false);
});
</script>
</body>
