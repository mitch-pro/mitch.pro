<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<meta name="referrer" content="no-referrer">
<title>Logging in — mitch.pro</title>
<link rel="stylesheet" href="/app.css">
<script src="/app-shell.js" defer></script>
<style>
  body { background: var(--t-bg); color: var(--t-fg); font-family: 'DM Sans', system-ui, sans-serif; }
  main { max-width: 420px; margin: 96px auto; padding: 0 16px; text-align: center; }
  #ml-msg { color: var(--t-fg2); margin: 12px 0 20px; }
  #ml-msg.err { color: #ef4444; }
  #ml-back { display: none; padding: 10px 20px; border-radius: 10px; background: var(--t-ac); color: #fff; text-decoration: none; font-weight: 700; }
</style>
</head>
<body>
<main>
  <h1>Logging in</h1>
  <p id="ml-msg" role="status" aria-live="polite">Signing you in…</p>
  <a id="ml-back" href="/enroll/">Back to login</a>
</main>
<script>
// The token lives in the URL fragment so it never reaches server logs, and is
// redeemed with a POST so email link scanners that prefetch the URL can't use it up.
(async function () {
  var msg = document.getElementById('ml-msg');
  var token = (location.hash || '').replace(/^#/, '');
  history.replaceState(null, '', location.pathname);
  function fail(text) {
    msg.className = 'err';
    msg.textContent = text;
    document.getElementById('ml-back').style.display = 'inline-block';
  }
  if (!token) return fail('This link is invalid or has expired. Request a new one.');
  try {
    var r = await fetch('/api/magic-link/verify', {
      method: 'POST',
      credentials: 'include',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ token: token })
    });
    var d = await r.json();
    if (d.success) { location.replace('/'); return; }
    fail(d.message || 'This link is invalid or has expired. Request a new one.');
  } catch (e) {
    fail('Could not reach the server. Check your connection and try again.');
  }
})();
</script>
</body>
</html>
