<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Maintenance — mitch.pro</title>
<link rel="stylesheet" href="/app.css">
<style>
  .maintenance-card { width: min(28rem, 100%); margin: 18vh auto 0; padding: 1.6rem 1.5rem; background: var(--t-bg2); border: 1px solid var(--t-bd); border-radius: var(--t-radius); text-align: center; }
  .maintenance-card h1 { margin: 0 0 0.5rem; font-size: 1.4rem; font-weight: 700; letter-spacing: -0.02em; }
  .maintenance-card p { margin: 0; color: var(--t-fg2); font-size: 0.95rem; line-height: 1.55; }
  .spinner { width: 1.8rem; height: 1.8rem; margin: 0 auto 1rem; border: 3px solid var(--t-bd); border-top-color: var(--t-ac); border-radius: 50%; animation: spin 1s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  @media (prefers-reduced-motion: reduce) { .spinner { animation: none; } }
</style>
</head>
<body class="app-shell">
  <main class="app-main">
    <div class="maintenance-card">
      <div class="spinner" aria-hidden="true"></div>
      <h1>Down for maintenance</h1>
      <p>mitch.pro is restarting or being updated. It should be back in a moment.</p>
    </div>
  </main>
<script src="/cookie-consent.js" defer></script>
</body>
</html>
