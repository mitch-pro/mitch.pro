<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="description" content="Player rankings by MitchCoins and game scores.">
  <title>Leaderboard — mitch.pro</title>
  <link rel="stylesheet" href="/app.css">
  <link rel="stylesheet" href="/leaderboard/leaderboard.css?v=2">
  <script src="/api.js"></script>
  <script src="/app-shell.js" defer></script>
  <script src="/leaderboard/leaderboard.js?v=2" defer></script>
</head>
<body class="leaderboard-page">
  <main class="app-main leaderboard-shell">
    <header class="board-heading">
      <h1>Leaderboard</h1>
      <div class="rankings-actions">
        <label class="player-search"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"></circle><path d="m16 16 4 4"></path></svg><span class="board-sr-only">Search players by name or username</span><input id="rank-search" type="search" placeholder="Search players" maxlength="100" autocomplete="off"></label>
        <button class="board-refresh" id="refresh-board" type="button" aria-label="Refresh rankings" title="Refresh rankings"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 7v5h-5M4 17v-5h5"></path><path d="M6.1 7a7 7 0 0 1 11.6-1L20 9M4 15l2.3 3A7 7 0 0 0 18 17"></path></svg></button>
      </div>
    </header>
    <nav class="board-categories" id="metric-tabs" aria-label="Rank by category"></nav>
    <div id="board-content" aria-busy="true">
      <aside class="personal-standing" id="my-rank" aria-label="Your rank" hidden></aside>
      <section class="board-rankings" aria-labelledby="rankings-title">
        <h2 class="board-sr-only" id="rankings-title">MitchCoins rankings</h2>
        <div class="ranking-summary"><p id="rank-count">Loading rankings…</p><p id="board-updated"></p></div>
        <div class="standings-head" id="standings-head" aria-hidden="true"></div>
        <ol class="standings-list" id="rank-list" aria-label="Player rankings"><li class="board-empty">Loading rankings…</li></ol>
        <p class="board-notice" id="board-notice" hidden></p>
      </section>
    </div>
    <p class="board-sr-only" id="board-status" role="status" aria-live="polite"></p>
    <noscript><p class="board-empty">Enable JavaScript to load rankings.</p></noscript>
  </main>
  <script src="/cookie-consent.js" defer></script>
</body>
</html>
