<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="description" content="Meet the players making their mark. Explore community rankings, game scores, and each player's signature style.">
  <title>Leaderboard — mitch.pro</title>
  <link rel="stylesheet" href="/app.css">
  <link rel="stylesheet" href="/leaderboard/leaderboard.css?v=1">
  <script src="/api.js"></script>
  <script src="/app-shell.js" defer></script>
  <script src="/leaderboard/leaderboard.js?v=1" defer></script>
</head>
<body class="leaderboard-page">
  <main class="app-main leaderboard-shell">
    <header class="board-heading">
      <div>
        <p class="board-eyebrow"><span></span> The community, ranked</p>
        <h1>Leaderboard<span>.</span></h1>
        <p class="board-intro">Make your mark. Bring your own style.</p>
      </div>
      <a class="board-link" href="/game-portal/">Find your next game <span aria-hidden="true">↗</span></a>
    </header>

    <nav class="board-categories" id="metric-tabs" aria-label="Rank by category"></nav>

    <div id="board-content" aria-busy="true">
      <section class="board-spotlight" aria-labelledby="spotlight-title">
        <div class="section-heading"><h2 id="spotlight-title">Leading the way</h2><span id="spotlight-category">MitchCoins · Top 3</span></div>
        <div class="board-podium" id="podium">
          <div class="podium-placeholder skeleton" aria-hidden="true"></div>
          <div class="podium-placeholder skeleton" aria-hidden="true"></div>
          <div class="podium-placeholder skeleton" aria-hidden="true"></div>
        </div>
      </section>

      <aside class="personal-standing" id="my-rank" aria-label="Your standing"><div class="personal-placeholder skeleton" aria-hidden="true"></div></aside>

      <section class="board-rankings" aria-labelledby="rankings-title">
        <div class="rankings-toolbar">
          <div><h2 id="rankings-title">The rankings</h2><p id="rank-count">Finding the community’s best…</p></div>
          <div class="rankings-actions">
            <label class="player-search"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"></circle><path d="m16 16 4 4"></path></svg><span class="board-sr-only">Find a player by name or username</span><input id="rank-search" type="search" placeholder="Find a player…" maxlength="100" autocomplete="off"></label>
            <button class="board-refresh" id="refresh-board" type="button" aria-label="Refresh rankings" title="Refresh rankings"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 7v5h-5M4 17v-5h5"></path><path d="M6.1 7a7 7 0 0 1 11.6-1L20 9M4 15l2.3 3A7 7 0 0 0 18 17"></path></svg></button>
          </div>
        </div>
        <div class="standings-head" id="standings-head" aria-hidden="true"></div>
        <ol class="standings-list" id="rank-list" aria-label="Player rankings"><li class="board-empty">Loading rankings…</li></ol>
        <div class="board-notice" id="board-notice" hidden></div>
        <footer class="board-footer"><p id="board-updated">Fetching the latest scores</p><a href="/shop/">Find your signature look <span aria-hidden="true">↗</span></a></footer>
      </section>
    </div>
    <p class="board-sr-only" id="board-status" role="status" aria-live="polite"></p>
    <noscript><p class="board-empty">Enable JavaScript to see the latest rankings.</p></noscript>
  </main>
  <script src="/cookie-consent.js" defer></script>
</body>
</html>
