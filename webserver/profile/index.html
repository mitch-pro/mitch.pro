<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Profile — mitch.pro</title>
<link rel="stylesheet" href="/app.css">
<style>
  body.profile-page { background-size: cover; background-position: center; background-attachment: fixed; }
  .profile-main { width: min(640px, calc(100% - 28px)); margin-inline: auto; padding: clamp(1.5rem, 3vw, 3rem) 0 4.5rem; }
  .wrap {
    background: var(--t-bg2); color: var(--t-fg);
    padding: 28px; border-radius: var(--t-radius); border: 1px solid var(--t-bd);
    position: relative; overflow: hidden;
  }
  /* Equipped profile effects (user-chosen cosmetics). */
  .wrap.profile_grid { background-image: linear-gradient(color-mix(in srgb, var(--t-fg) 6%, transparent) 1px, transparent 1px), linear-gradient(90deg, color-mix(in srgb, var(--t-fg) 6%, transparent) 1px, transparent 1px); background-size: 18px 18px; }
  .wrap.profile_scanlines::after { content: ''; position: absolute; inset: 0; pointer-events: none; background: repeating-linear-gradient(0deg, color-mix(in srgb, var(--t-fg) 6%, transparent) 0, color-mix(in srgb, var(--t-fg) 6%, transparent) 1px, transparent 1px, transparent 4px); }
  .wrap.profile_gold_frame { border-color: rgba(245,158,11,.7); box-shadow: 0 0 28px rgba(245,158,11,.22); }
  .wrap.profile_neon_frame { border-color: rgba(236,72,153,.75); box-shadow: 0 0 32px rgba(236,72,153,.28); }
  .wrap.profile_stars::before { content: '✦  ·  ✧  ·  ✦'; position: absolute; right: 18px; top: 14px; color: #d99a06; letter-spacing: 10px; font-size: 12px; pointer-events: none; }

  .badge-premium, .badge-admin {
    display: inline-flex; align-items: center; gap: 5px;
    border: 1px solid var(--t-bd); background: var(--t-bg3);
    border-radius: 999px; padding: 3px 11px; font-size: 12px; font-weight: 600;
  }
  .badge-premium { color: #f59e0b; border-color: rgba(245,158,11,.4); }
  .badge-premium::before { content: '✦'; font-size: 9px; }
  .badge-admin { color: #ef4444; border-color: rgba(239,68,68,.4); }
  .badge-admin::before { content: '⚑'; font-size: 9px; }
  .badge-row { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 14px; }

  .avatar {
    width: 80px; height: 80px; border-radius: 50%;
    background: var(--t-ac); display: flex; align-items: center;
    justify-content: center; font-weight: 700; font-size: 2rem; color: var(--t-ac-ink);
    margin-bottom: 14px; flex-shrink: 0;
    overflow: hidden; border: 2px solid var(--t-bd);
  }
  .avatar img { width: 100%; height: 100%; object-fit: cover; }

  .display-name { font-size: 1.7rem; font-weight: 700; letter-spacing: -0.03em; line-height: 1.2; margin-bottom: 4px; overflow-wrap: anywhere; }
  /* Equipped name colors (user-chosen cosmetics); darker variants in light mode. */
  .display-name.neon_purple { color: #c291ff !important; }
  .display-name.electric_blue { color: #72b5ff !important; }
  .display-name.mint_flash { color: #81d9b0 !important; }
  .display-name.rose_spark { color: #f2a4bf !important; }
  .display-name.ember_red { color: #f69689 !important; }
  .display-name.void_white { color: var(--t-fg) !important; }
  .display-name.gold_glow { color: #e8c578 !important; text-shadow: 0 0 14px rgba(245,158,11,.6); }
  html.theme-light .display-name.neon_purple, html[data-theme="light"] .display-name.neon_purple { color: #7840b3 !important; }
  html.theme-light .display-name.electric_blue, html[data-theme="light"] .display-name.electric_blue { color: #215dab !important; }
  html.theme-light .display-name.mint_flash, html[data-theme="light"] .display-name.mint_flash { color: #24734f !important; }
  html.theme-light .display-name.rose_spark, html[data-theme="light"] .display-name.rose_spark { color: #aa3f69 !important; }
  html.theme-light .display-name.ember_red, html[data-theme="light"] .display-name.ember_red { color: #ae392f !important; }
  html.theme-light .display-name.gold_glow, html[data-theme="light"] .display-name.gold_glow { color: #92600a !important; text-shadow: none; }
  .display-name.rainbow_name {
    background: linear-gradient(90deg, #ff0000, #ff7f00, #ffff00, #00ff00, #0000ff, #4b0082, #8b00ff);
    -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent;
    background-size: 200% auto; animation: rainbow_move 3s linear infinite;
    display: inline-block;
  }
  @keyframes rainbow_move { to { background-position: 200% center; } }

  .profile-badge { font-size: 14px; margin-left: 8px; vertical-align: middle; }
  .badge-verified { color: #3b82f6; }
  .badge-og { color: #ef4444; border: 1px solid #ef4444; padding: 1px 4px; border-radius: 4px; font-weight: 700; font-size: 10px; }
  .badge-shop { color: #f59e0b; border: 1px solid rgba(245,158,11,.5); padding: 1px 4px; border-radius: 4px; font-weight: 700; font-size: 10px; }

  .email-line { font-size: 13px; color: var(--t-fg2); margin-bottom: 14px; }
  .bio { font-size: 14px; color: var(--t-fg); line-height: 1.6; margin-bottom: 14px; overflow-wrap: anywhere; }
  .website { margin-bottom: 14px; overflow-wrap: anywhere; }
  .website a { font-size: 13px; color: var(--t-ac); }
  .website a:hover { text-decoration: underline; }

  .divider { height: 1px; background: var(--t-bd); margin: 22px 0; }

  .save-btn {
    width: 100%; background: var(--t-ac); color: var(--t-ac-ink);
    border: none; border-radius: var(--t-radius-sm); padding: 11px 16px;
    font-family: var(--t-font); font-size: 14px; font-weight: 700;
    cursor: pointer; transition: opacity 0.15s;
  }
  .save-btn:hover { opacity: 0.88; color: var(--t-ac-ink); }

  .not-found { text-align: center; padding: 48px 20px; }
  .not-found h1 { font-size: 1.6rem; margin-bottom: 8px; }
  .not-found p { font-size: 14px; color: var(--t-fg2); margin-bottom: 12px; }

  .facts { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 22px; }
  .fact { background: var(--t-bg); border: 1px solid var(--t-bd); border-radius: var(--t-radius-sm); padding: 18px 20px; }
  .fact-val { display: flex; align-items: center; gap: 8px; min-height: 2.6rem; font-size: 1.9rem; font-weight: 700; letter-spacing: -0.03em; line-height: 1.1; color: var(--t-fg); }
  .fact-lbl { font-size: 13px; color: var(--t-fg2); margin-top: 6px; }
  .achs { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 18px; }
  .ach-badge { font-size: 12px; background: var(--t-bg3); border: 1px solid var(--t-bd); padding: 4px 10px; border-radius: 999px; color: var(--t-fg2); }

  @media (max-width: 600px) {
    .wrap { padding: 20px 16px; }
    .profile-top { flex-direction: column; }
  }
  .loading-line { color: var(--t-fg2); font-size: 14px; }
  .profile-top { display: flex; gap: 20px; align-items: flex-start; }
  .profile-top .avatar { width: 96px; height: 96px; margin-bottom: 0; font-size: 2.4rem; }
  .profile-id { min-width: 0; flex: 1; }
  .profile-id .display-name { margin-bottom: 6px; }
  .profile-id .badge-row { margin-bottom: 8px; }
  .profile-id .bio { margin: 10px 0 0; }
  .profile-id .website { margin: 8px 0 0; }
  .profile-id .email-line { margin: 0; }
  .wrap .link-btn { margin-top: 22px; }
  .link-btn { display: block; text-align: center; }
  .retry-btn { width: auto; padding: 8px 18px; }
  html.theme-light .badge-premium, html.theme-light .badge-shop, html[data-theme="light"] .badge-premium, html[data-theme="light"] .badge-shop { color: #92400e; }
  html.theme-light .badge-admin, html.theme-light .badge-og, html[data-theme="light"] .badge-admin, html[data-theme="light"] .badge-og { color: #b91c1c; }
  .back-link { color: var(--t-ac); font-size: 13px; }
  .back-link:focus-visible { outline: 2px solid var(--t-ac); outline-offset: 2px; }
</style>
</head>
<body class="profile-page app-shell">
<main class="profile-main">
<div class="wrap" id="wrap">
  <div class="loading-line">Loading…</div>
</div>
</main>

<script>
const params = new URLSearchParams(location.search);
const targetEmail = params.get('u') || null;
const isOwnProfile = !targetEmail && !window.PUBLIC_PROFILE;

function esc(t) { return (t||'').replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])); }
function safeImageSrc(value, allowData) {
  const raw = String(value || '').trim();
  if (!raw || /[\u0000-\u001f\u007f<>"`]/.test(raw)) return '';
  if (/^https?:\/\//i.test(raw)) return raw;
  if (allowData && /^data:image\/(?:png|jpe?g|webp|gif);base64,[a-z0-9+/=]+$/i.test(raw) && raw.length <= 140000) return raw;
  return '';
}
function safeLinkHref(value) {
  const raw = String(value || '').trim();
  if (!raw || /[\u0000-\u001f\u007f<>"`]/.test(raw)) return '';
  return /^https?:\/\//i.test(raw) ? raw : '';
}
function option(value, label, current) {
  return `<option value="${esc(value)}" ${String(current || '') === String(value) ? 'selected' : ''}>${esc(label)}</option>`;
}
function gradYearOptions(current) {
  var now = new Date();
  var y = now.getFullYear();
  var start = now >= new Date(y, 6, 1) ? y + 1 : y;
  var labels = ['Senior', 'Junior', 'Sophomore', 'Freshman'];
  var html = option('', 'None / Prefer not to say', current);
  for (var i = 0; i < 4; i++) html += option(String(start + i), `${start + i} (${labels[i]})`, current);
  return html;
}

function calculatePlaytime(stats) {
  var playtime = stats.playtime || {};
  var totalMinutes = 0;
  for (var key in playtime) {
    if (playtime.hasOwnProperty(key)) {
      totalMinutes += Number(playtime[key]) || 0;
    }
  }
  if (totalMinutes === 0) return '0m';
  if (totalMinutes < 60) return totalMinutes + 'm';
  var hrs = Math.floor(totalMinutes / 60);
  var mins = totalMinutes % 60;
  return hrs + 'h ' + mins + 'm';
}

async function load(forceNetwork) {
  const wrap = document.getElementById('wrap');
  let profile = null;
  let stats = {}, achs = [];

  if (window.PUBLIC_PROFILE && !forceNetwork) {
    profile = window.PUBLIC_PROFILE;
    stats = profile.stats || {};
    achs = profile.achievements || [];
  } else {
    try {
      if (targetEmail) {
        const r = await fetch('/api/profile/' + encodeURIComponent(targetEmail), { credentials: 'include', cache: 'no-store' });
        if (r.status === 404) { showNotFound(wrap); return; }
        if (!r.ok) { showLoadError(wrap); return; }
        profile = await r.json();
        stats = profile.stats || {};
        achs = profile.achievements || [];
      } else {
        const r = await fetch('/api/profile', { credentials: 'include', cache: 'no-store' });
        if (r.status === 401) { location.href = '/enroll.html'; return; }
        if (!r.ok) { showLoadError(wrap); return; }
        profile = await r.json();
        stats = profile.stats || {};
        achs = profile.achievements || [];
      }
    } catch { showLoadError(wrap); return; }
  }

  const profileName = profile.displayName || profile.nickname || profile.username || profile.email || 'Profile';
  const profileEffect = String(profile.activeProfileEffect || '').replace(/[^a-z0-9_-]/gi, '');
  if (profileEffect) wrap.classList.add(profileEffect);

  const safeBackground = safeImageSrc(profile.background, false);
  const safePfp = safeImageSrc(profile.pfp, true);
  const safeWebsite = safeLinkHref(profile.website);
  if (safeBackground) {
    document.body.style.backgroundImage = `url("${safeBackground.replace(/"/g, '%22')}")`;
  } else {
    document.body.style.backgroundImage = '';
  }

  document.title = profileName + ' — mitch.pro';
  const initials = profileName.slice(0, 1).toUpperCase();
  
  const badgeLabels = {
    verified_badge: { text: '✔', cls: 'badge-verified' },
    og_badge: { text: '📜', cls: 'badge-og' },
    artist_badge: { text: '🎨', cls: 'badge-shop' },
    chess_badge: { text: '♟', cls: 'badge-shop' },
    builder_badge: { text: '🛠', cls: 'badge-shop' },
    lucky_badge: { text: '🍀', cls: 'badge-shop' },
    premium_star_badge: { text: '⭐', cls: 'badge-shop' },
    owner_fan_badge: { text: '👑', cls: 'badge-shop' },
  };
  const badge = badgeLabels[profile.activeBadge];
  let badgeHtml = badge ? `<span class="profile-badge ${badge.cls}" title="${esc(String(profile.activeBadge).replace(/_badge$/, '').replace(/_/g, ' '))} badge">${badge.text}</span>` : '';

  const coinBalance = Number(profile.coins);
  const coinText = Number.isFinite(coinBalance) ? coinBalance.toLocaleString(undefined, { maximumFractionDigits: 1 }) : '0';
  let html = `
    <div class="profile-top">
      <div class="avatar">
        ${safePfp ? `<img src="${esc(safePfp)}" loading="lazy" decoding="async" referrerpolicy="no-referrer" alt="">` : initials}
      </div>
      <div class="profile-id">
        ${(profile.isPremium || profile.isAdmin) ? `<div class="badge-row">
          ${profile.isPremium ? '<span class="badge-premium">Premium member</span>' : ''}
          ${profile.isAdmin ? '<span class="badge-admin">Admin</span>' : ''}
        </div>` : ''}
        <div class="display-name ${esc(profile.activeColor || '')}">${esc(profileName)}${badgeHtml}</div>
        ${(!window.PUBLIC_PROFILE && profile.email && profile.email.includes('@')) ? `<div class="email-line">${esc(profile.email || '')}</div>` : ''}
        ${profile.bio ? `<div class="bio">${esc(profile.bio)}</div>` : ''}
        ${safeWebsite ? `<div class="website"><a href="${esc(safeWebsite)}" target="_blank" rel="noopener noreferrer">${esc(safeWebsite)}</a></div>` : ''}
      </div>
    </div>
    <div class="facts">
      <div class="fact"><div class="fact-val mitch-coin-amount">${esc(coinText)}</div><div class="fact-lbl">MitchCoins</div></div>
      <div class="fact"><div class="fact-val">${esc(calculatePlaytime(stats))}</div><div class="fact-lbl">Time spent</div></div>
    </div>
    ${achs.length ? `<div class="achs">${achs.map(a => `<span class="ach-badge">🏆 ${esc(String(a).replace(/_/g, ' '))}</span>`).join('')}</div>` : ''}`;

  if (isOwnProfile) {
    html += `<a class="save-btn link-btn" href="/preferences/#account">Edit profile</a>`;
  }

  wrap.innerHTML = html;
}

function showLoadError(wrap) {
  wrap.innerHTML = '<div class="not-found"><p>Could not load this profile.</p><button type="button" id="profile-retry" class="save-btn retry-btn">Try again</button></div>';
  document.getElementById('profile-retry').addEventListener('click', function () {
    wrap.innerHTML = '<div class="loading-line">Loading…</div>';
    load(true);
  });
}

function showNotFound(wrap) {
  wrap.innerHTML = '<div class="not-found"><h1>404</h1><p>Profile not found.</p><a class="back-link" href="/">Home</a></div>';
}

load();
window.addEventListener('mitch-profile-updated', function () { load(true); });
</script>
<script src="/app-shell.js" defer></script>
<script src="/cookie-consent.js" defer></script>
</body>
</html>
