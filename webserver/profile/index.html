<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Profile — mitch.pro</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    min-height: 100vh;
    background: var(--t-bg, #0d0d0d);
    color: var(--t-fg, #e8e8e8);
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;
    display: flex; flex-direction: column; align-items: center;
    padding: 48px 20px 80px;
    background-size: cover; background-position: center; background-attachment: fixed;
  }
  .wrap { 
    width: 100%; max-width: 520px; 
    background: rgba(13,13,13,0.85); backdrop-filter: blur(12px);
    padding: 32px; border-radius: 20px; border: 1px solid rgba(255,255,255,0.08);
    box-shadow: 0 20px 50px rgba(0,0,0,0.5);
    position: relative; overflow: hidden;
  }
  .wrap.profile_grid { background-image: linear-gradient(rgba(255,255,255,.04) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,.04) 1px, transparent 1px); background-size: 18px 18px; }
  .wrap.profile_scanlines::after { content: ''; position: absolute; inset: 0; pointer-events: none; background: repeating-linear-gradient(0deg, rgba(255,255,255,.045) 0, rgba(255,255,255,.045) 1px, transparent 1px, transparent 4px); mix-blend-mode: screen; }
  .wrap.profile_gold_frame { border-color: rgba(245,158,11,.7); box-shadow: 0 20px 50px rgba(0,0,0,.5), 0 0 28px rgba(245,158,11,.22); }
  .wrap.profile_neon_frame { border-color: rgba(236,72,153,.75); box-shadow: 0 20px 50px rgba(0,0,0,.5), 0 0 32px rgba(236,72,153,.28); }
  .wrap.profile_stars::before { content: '✦  ·  ✧  ·  ✦'; position: absolute; right: 18px; top: 14px; color: rgba(250,204,21,.55); letter-spacing: 10px; font-size: 12px; pointer-events: none; }

  .badge-premium {
    display: inline-flex; align-items: center; gap: 5px;
    background: rgba(245,158,11,0.12); border: 1px solid rgba(245,158,11,0.3);
    border-radius: 99px; padding: 3px 12px; font-size: 10px;
    font-weight: 500; letter-spacing: 0.1em; text-transform: uppercase;
    color: #f59e0b; margin-bottom: 18px;
  }
  .badge-premium::before { content: '✦'; font-size: 8px; }
  .badge-admin {
    display: inline-flex; align-items: center; gap: 5px;
    background: rgba(239,68,68,0.12); border: 1px solid rgba(239,68,68,0.3);
    border-radius: 99px; padding: 3px 12px; font-size: 10px;
    font-weight: 500; letter-spacing: 0.1em; text-transform: uppercase;
    color: #ef4444; margin-bottom: 18px;
  }
  .badge-admin::before { content: '⚑'; font-size: 8px; }
  .badge-row { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 18px; }
  .badge-row .badge-premium,
  .badge-row .badge-admin { margin-bottom: 0; }

  .avatar {
    width: 80px; height: 80px; border-radius: 50%;
    background: var(--t-ac, #a78bfa); display: flex; align-items: center;
    justify-content: center; font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    font-weight: 800; font-size: 2rem; color: #fff;
    margin-bottom: 16px; flex-shrink: 0;
    overflow: hidden; border: 2px solid rgba(255,255,255,0.1);
  }
  .avatar img { width: 100%; height: 100%; object-fit: cover; }
  
  .display-name {
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 1.6rem;
    font-weight: 800; margin-bottom: 4px;
  }
  .display-name.neon_purple { color: #d946ef !important; text-shadow: 0 0 10px rgba(217,70,239,0.5); }
  .display-name.electric_blue { color: #3b82f6 !important; text-shadow: 0 0 10px rgba(59,130,246,0.5); }
  .display-name.mint_flash { color: #c084fc !important; text-shadow: 0 0 10px rgba(192,132,252,0.45); }
  .display-name.rose_spark { color: #fb7185 !important; text-shadow: 0 0 10px rgba(251,113,133,0.45); }
  .display-name.ember_red { color: #ef4444 !important; text-shadow: 0 0 10px rgba(239,68,68,0.5); }
  .display-name.void_white { color: #f8fafc !important; text-shadow: 0 0 12px rgba(248,250,252,0.45); }
  .display-name.gold_glow { color: #f59e0b !important; text-shadow: 0 0 15px rgba(245,158,11,0.8); }
  .display-name.rainbow_name {
    background: linear-gradient(90deg, #ff0000, #ff7f00, #ffff00, #00ff00, #0000ff, #4b0082, #8b00ff);
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    background-size: 200% auto; animation: rainbow_move 3s linear infinite;
    font-weight: 900;
    display: inline-block;
    text-shadow: 0 0 2px rgba(0,0,0,0.3);
  }  @keyframes rainbow_move { to { background-position: 200% center; } }
  
  .profile-badge { font-size: 14px; margin-left: 8px; vertical-align: middle; }
  .badge-verified { color: #3b82f6; }
  .badge-og { color: #ef4444; border: 1px solid #ef4444; padding: 1px 4px; border-radius: 4px; font-weight: 800; text-transform: uppercase; font-size: 9px; }
  .badge-shop { color: #f59e0b; border: 1px solid rgba(245,158,11,.5); padding: 1px 4px; border-radius: 4px; font-weight: 800; text-transform: uppercase; font-size: 9px; }

  .email-line { font-size: 11px; color: var(--t-fg2, #666); margin-bottom: 20px; }
  .bio { font-size: 13px; color: var(--t-fg, #ccc); line-height: 1.7; margin-bottom: 20px; font-style: italic; font-weight: 300; }
  .website a { font-size: 12px; color: var(--t-ac, #a78bfa); text-decoration: none; }
  .website a:hover { text-decoration: underline; }

  .divider { height: 1px; background: rgba(255,255,255,0.08); margin: 28px 0; }

  .edit-section h2 {
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 13px;
    font-weight: 700; margin-bottom: 20px; color: var(--t-fg2, #888);
    text-transform: uppercase; letter-spacing: 0.08em;
  }
  .field { margin-bottom: 18px; }
  label { display: block; font-size: 10px; font-weight: 500; letter-spacing: 0.1em;
    text-transform: uppercase; color: var(--t-fg2, #666); margin-bottom: 7px; }
  input, textarea, select {
    width: 100%; background: rgba(255,255,255,0.04);
    border: 1px solid rgba(255,255,255,0.1); border-radius: 8px;
    color: var(--t-fg, #e8e8e8); font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;
    font-size: 13px; padding: 10px 13px; outline: none;
    transition: border-color 0.15s, box-shadow 0.15s;
  }
  input:focus, textarea:focus, select:focus {
    border-color: var(--t-ac, #a78bfa);
    box-shadow: 0 0 0 3px rgba(167,139,250,0.08);
  }
  select option { background: #111; color: #e8e8e8; }
  textarea { resize: vertical; min-height: 90px; line-height: 1.6; }
  input::placeholder, textarea::placeholder { color: rgba(255,255,255,0.2); font-style: italic; }

  .save-btn {
    width: 100%; background: var(--t-ac, #a78bfa); color: #fff;
    border: none; border-radius: 8px; padding: 12px;
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 13px; font-weight: 700;
    cursor: pointer; transition: opacity 0.15s, transform 0.15s;
  }
  .save-btn:hover:not(:disabled) { opacity: 0.88; transform: translateY(-1px); }
  .save-btn:disabled { opacity: 0.4; cursor: default; }

  #msg { margin-top: 10px; font-size: 12px; text-align: center; font-style: italic; min-height: 1.4em; }
  #msg.ok { color: #d8b4fe; } #msg.err { color: #f87171; }

  .not-found { text-align: center; padding: 60px 20px; }
  .not-found h1 { font-family: 'Syne', sans-serif; font-size: 1.4rem; font-weight: 800; margin-bottom: 8px; }
  .not-found p { font-size: 13px; color: var(--t-fg2, #777); }

  .stats-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 14px; }
  .stat-card { background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.06); border-radius: 10px; padding: 12px; text-align: center; }
  .stat-val { font-size: 1.2rem; font-weight: 800; color: var(--t-ac); }
  .stat-lbl { font-size: 9px; text-transform: uppercase; opacity: 0.5; margin-top: 4px; }
  .achs { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 18px; }
  .ach-badge { font-size: 10px; background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.08); padding: 4px 10px; border-radius: 6px; color: var(--t-fg2); }
  
  .bonus-banner {
    display: flex; align-items: flex-start; gap: 12px;
    background: linear-gradient(135deg, rgba(245,158,11,0.12), rgba(251,191,36,0.06));
    border: 1px solid rgba(245,158,11,0.35);
    border-radius: 12px; padding: 14px 16px; margin-bottom: 24px;
    font-size: 12px; line-height: 1.6;
  }
  .bonus-banner .bonus-icon { font-size: 20px; flex-shrink: 0; margin-top: 1px; }
  .bonus-banner strong { color: #f59e0b; display: block; margin-bottom: 3px; font-size: 13px; }
  .bonus-banner.claimed { opacity: 0.45; border-color: rgba(255,255,255,0.08); background: rgba(255,255,255,0.02); }

  .coin-toast {
    position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%) translateY(80px);
    background: linear-gradient(135deg, #065f46, #047857);
    border: 1px solid rgba(74,222,128,0.35); border-radius: 14px;
    padding: 14px 24px; color: #fff; font-family: 'Syne', sans-serif;
    font-weight: 800; font-size: 14px; z-index: 9999;
    box-shadow: 0 20px 50px rgba(0,0,0,0.6); transition: transform 0.4s ease, opacity 0.4s ease;
    opacity: 0; pointer-events: none; white-space: nowrap;
  }
  .coin-toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }

  .premium-label { font-size: 9px; color: #f59e0b; margin-left: 5px; font-weight: 700; }

  @media (max-width: 600px) {
    body {
      padding: 16px 10px 48px;
    }
    .wrap {
      padding: 20px 16px;
    }
    .stats-grid {
      grid-template-columns: 1fr !important;
    }
  }
</style>
</head>
<body class="profile-page">
<a id="profile-home-btn" href="/" title="Back to homepage"
   style="position:fixed;top:12px;left:12px;z-index:50;display:inline-flex;align-items:center;gap:6px;padding:8px 14px;border-radius:999px;border:1px solid var(--t-bd,rgba(255,255,255,.18));background:var(--t-bg2,rgba(20,20,28,.8));color:var(--t-fg,#eee);font:600 12.5px/1 system-ui,sans-serif;text-decoration:none;">⌂ Home</a>
<div class="wrap" id="wrap">
  <div style="color:var(--t-fg2,#666);font-size:13px">Loading…</div>
</div>
<div class="coin-toast" id="coin-toast">🎁 +500 MitchCoins! Profile complete bonus!</div>

<script>
const params = new URLSearchParams(location.search);
const targetEmail = params.get('u') || null;
const isOwnProfile = !targetEmail && !window.PUBLIC_PROFILE;

function esc(t) { return (t||'').replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])); }
function safeImageSrc(value, allowData) {
  const raw = String(value || '').trim();
  if (!raw || /[\u0000-\u001f\u007f<>"`]/.test(raw)) return '';
  if (/^https?:\/\//i.test(raw)) return raw;
  if (allowData && /^data:image\/(?:png|jpe?g|webp|gif);base64,[a-z0-9+/=]+$/i.test(raw) && raw.length <= 140000) return raw;
  return '';
}
function safeLinkHref(value) {
  const raw = String(value || '').trim();
  if (!raw || /[\u0000-\u001f\u007f<>"`]/.test(raw)) return '';
  return /^https?:\/\//i.test(raw) ? raw : '';
}
function option(value, label, current) {
  return `<option value="${esc(value)}" ${String(current || '') === String(value) ? 'selected' : ''}>${esc(label)}</option>`;
}
function gradYearOptions(current) {
  var now = new Date();
  var y = now.getFullYear();
  var start = now >= new Date(y, 6, 1) ? y + 1 : y;
  var labels = ['Senior', 'Junior', 'Sophomore', 'Freshman'];
  var html = option('', 'None / Prefer not to say', current);
  for (var i = 0; i < 4; i++) html += option(String(start + i), `${start + i} (${labels[i]})`, current);
  return html;
}
function Fmt(n) {
  if (n < 1000) return Math.floor(n);
  const s = ['', 'K', 'M', 'B', 'T', 'Qa', 'Qi', 'Sx', 'Sp', 'Oc', 'No', 'Dc'];
  const t = Math.floor(Math.log10(n) / 3);
  if (t < s.length) return (n / Math.pow(10, t * 3)).toFixed(1) + s[t];
  return n.toExponential(1);
}

function calculatePlaytime(stats) {
  var playtime = stats.playtime || {};
  var totalMinutes = 0;
  for (var key in playtime) {
    if (playtime.hasOwnProperty(key)) {
      totalMinutes += Number(playtime[key]) || 0;
    }
  }
  if (totalMinutes === 0) return '0m';
  if (totalMinutes < 60) return totalMinutes + 'm';
  var hrs = Math.floor(totalMinutes / 60);
  var mins = totalMinutes % 60;
  return hrs + 'h ' + mins + 'm';
}

async function load(forceNetwork) {
  const wrap = document.getElementById('wrap');
  let profile = null;
  let stats = {}, achs = [];

  if (window.PUBLIC_PROFILE && !forceNetwork) {
    profile = window.PUBLIC_PROFILE;
    stats = profile.stats || {};
    achs = profile.achievements || [];
  } else {
    try {
      if (targetEmail) {
        const r = await fetch('/api/profile/' + encodeURIComponent(targetEmail), { credentials: 'include', cache: 'no-store' });
        if (!r.ok) { showNotFound(wrap); return; }
        profile = await r.json();
        stats = profile.stats || {};
        achs = profile.achievements || [];
      } else {
        const r = await fetch('/api/profile', { credentials: 'include', cache: 'no-store' });
        if (r.status === 401) { location.href = '/enroll.html'; return; }
        profile = await r.json();
        stats = profile.stats || {};
        achs = profile.achievements || [];
      }
    } catch { showNotFound(wrap); return; }
  }

  const profileName = profile.displayName || profile.nickname || profile.username || profile.email || 'Profile';
  const profileEffect = String(profile.activeProfileEffect || '').replace(/[^a-z0-9_-]/gi, '');
  if (profileEffect) wrap.classList.add(profileEffect);

  const safeBackground = safeImageSrc(profile.background, false);
  const safePfp = safeImageSrc(profile.pfp, true);
  const safeWebsite = safeLinkHref(profile.website);
  if (safeBackground) {
    document.body.style.backgroundImage = `url("${safeBackground.replace(/"/g, '%22')}")`;
  } else {
    document.body.style.backgroundImage = '';
  }

  document.title = profileName + ' — mitch.pro';
  const initials = profileName.slice(0, 1).toUpperCase();
  
  const badgeLabels = {
    verified_badge: { text: '✔', cls: 'badge-verified' },
    og_badge: { text: '📜', cls: 'badge-og' },
    artist_badge: { text: '🎨', cls: 'badge-shop' },
    chess_badge: { text: '♟', cls: 'badge-shop' },
    builder_badge: { text: '🛠', cls: 'badge-shop' },
    lucky_badge: { text: '🍀', cls: 'badge-shop' },
    premium_star_badge: { text: '⭐', cls: 'badge-shop' },
    owner_fan_badge: { text: '👑', cls: 'badge-shop' },
  };
  const badge = badgeLabels[profile.activeBadge];
  let badgeHtml = badge ? `<span class="profile-badge ${badge.cls}" title="${badge.title}">${badge.text}</span>` : '';

  let html = `
    <div style="display:flex;flex-direction:column;align-items:flex-start;margin-bottom:32px">
      <div class="avatar">
        ${safePfp ? `<img src="${esc(safePfp)}" loading="lazy" decoding="async" referrerpolicy="no-referrer" alt="">` : initials}
      </div>
      ${(profile.isPremium || profile.isAdmin) ? `<div class="badge-row">
        ${profile.isPremium ? '<span class="badge-premium">Premium member</span>' : ''}
        ${profile.isAdmin ? '<span class="badge-admin">Admin</span>' : ''}
      </div>` : ''}
      <div class="display-name ${profile.activeColor || ''}">${esc(profileName)}${badgeHtml}</div>
      ${(!window.PUBLIC_PROFILE && profile.email && profile.email.includes('@')) ? `<div class="email-line">${esc(profile.email || '')}</div>` : ''}
      ${profile.bio ? `<div class="bio">${esc(profile.bio)}</div>` : ''}
      ${safeWebsite ? `<div class="website"><a href="${esc(safeWebsite)}" target="_blank" rel="noopener noreferrer">${esc(safeWebsite)}</a></div>` : ''}
      
      <div class="stats-grid" style="width:100%">
        <div class="stat-card"><div class="stat-val">${stats.pixels || 0}</div><div class="stat-lbl">Pixels</div></div>
        <div class="stat-card"><div class="stat-val">${stats.chess_wins || 0}</div><div class="stat-lbl">Chess Wins</div></div>
        <div class="stat-card"><div class="stat-val">${stats.battleship_wins || 0}</div><div class="stat-lbl">Battleship Wins</div></div>
        <div class="stat-card"><div class="stat-val">${Fmt(stats.clicker_points || 0)}</div><div class="stat-lbl">Clicker Pts</div></div>
        <div class="stat-card"><div class="stat-val">${stats.typing_races || 0}</div><div class="stat-lbl">Keyboard Races</div></div>
        <div class="stat-card"><div class="stat-val">${stats.logic_puzzles || 0}</div><div class="stat-lbl">Logic Puzzles</div></div>
        <div class="stat-card"><div class="stat-val">${stats.casino_bets || 0}</div><div class="stat-lbl">Casino Bets</div></div>
        <div class="stat-card"><div class="stat-val">${stats.casino_wins || 0}</div><div class="stat-lbl">Casino Wins</div></div>
        <div class="stat-card"><div class="stat-val mitch-coin-amount">${(Number(stats.clicker_coins || 0) + Number(stats.typing_coins || 0) + Number(stats.logic_coins || 0)).toFixed(1)}</div><div class="stat-lbl">Game coins earned</div></div>
        <div class="stat-card"><div class="stat-val">${calculatePlaytime(stats)}</div><div class="stat-lbl">Time Spent</div></div>
      </div>
      
      <div class="achs">
        ${achs.map(a => `<span class="ach-badge">🏆 ${esc(a.replace(/_/g, ' '))}</span>`).join('')}
      </div>
    </div>`;

  if (isOwnProfile) {
    html += `
      <div class="divider"></div>
      <div class="edit-section">
        <h2>Manage Profile</h2>
        <p style="font-size: 12px; line-height: 1.6; color: var(--t-fg2, #888); margin-bottom: 16px;">Profile editing, account details, 2FA, and account deletion now live in Preferences.</p>
        <a class="save-btn" href="/preferences/#account" style="display:block;text-align:center;text-decoration:none;">Open Preferences</a>
      </div>`;
  }

  wrap.innerHTML = html;
}

function showNotFound(wrap) {
  wrap.innerHTML = '<div class="not-found"><h1>404</h1><p>Profile not found.</p><a href="/" style="color:var(--t-ac);font-size:12px;text-decoration:none;">← Home</a></div>';
}

load();
window.addEventListener('mitch-profile-updated', function () { load(true); });
// Hide the home button when the profile is embedded in the home page's
// frame — the parent already has its own navigation there.
try {
  if (window.top !== window.self) {
    var b = document.getElementById('profile-home-btn');
    if (b) b.style.display = 'none';
  }
} catch (e) {}
</script>
<script src="/cookie-consent.js" defer></script>
</body>
</html>
