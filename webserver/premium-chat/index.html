<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Premium Chat — mitch.pro</title>
<link rel="stylesheet" href="/app.css">
<script src="/api.js"></script>
<script src="/app-shell.js" defer></script>
<style>
  .page-head { margin-bottom: 1.35rem; max-width: 40rem; }
  .page-head h1 {
    margin: 0;
    font-size: clamp(1.75rem, 4vw, 2.4rem);
    letter-spacing: -0.03em;
  }
  .page-head h1 span { color: #f59e0b; }
  .page-sub {
    margin: 0.5rem 0 0;
    color: var(--t-fg2);
    font-size: 0.9rem;
    line-height: 1.5;
  }
  .chat-shell { max-width: 42rem; }
  .chat-box {
    height: min(28rem, 58vh);
    overflow-y: auto;
    background: color-mix(in srgb, var(--t-bg) 55%, transparent);
    border: 1px solid var(--t-bd);
    border-radius: var(--t-radius, 8px);
    padding: 1rem 1.1rem;
    margin-bottom: 0.9rem;
    display: flex;
    flex-direction: column;
    gap: 0.85rem;
    scrollbar-width: thin;
    scrollbar-color: rgba(245,158,11,0.35) transparent;
  }
  .msg { max-width: 88%; align-self: flex-start; }
  .msg.own { align-self: flex-end; text-align: right; }
  .msg .author {
    font-size: 0.7rem;
    font-weight: 700;
    color: #f59e0b;
    margin-bottom: 0.25rem;
    display: block;
    opacity: 0.9;
  }
  .msg .text {
    font-size: 0.88rem;
    background: var(--t-bg3);
    padding: 0.55rem 0.85rem;
    border-radius: calc(var(--t-radius, 8px) + 4px);
    border: 1px solid var(--t-bd);
    display: inline-block;
    word-break: break-word;
  }
  .msg.own .text {
    background: rgba(245,158,11,0.12);
    border-color: rgba(245,158,11,0.28);
    border-bottom-right-radius: 3px;
  }
  .msg:not(.own) .text { border-bottom-left-radius: 3px; }
  .msg.chat_shadow .text { box-shadow: 0 8px 18px rgba(0,0,0,.42), 0 1px 0 color-mix(in srgb, #fff 8%, transparent); }
  .msg.chat_terminal .text {
    background: rgba(0,20,8,.88);
    border-color: rgba(0,255,65,.35);
    color: #93f59d;
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
  }
  .msg.chat_prism .text {
    background: linear-gradient(90deg, rgba(255,0,128,.18), rgba(0,220,255,.18), rgba(255,210,0,.18));
    border-color: color-mix(in srgb, #fff 22%, var(--t-bd));
  }
  .msg.chat_sparkles .text::after { content: ' ✦'; color: #facc15; }
  .msg.chat_wave .text { animation: chatWave 1.8s ease-in-out infinite; }
  @keyframes chatWave { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-2px); } }
  .input-wrap { display: flex; gap: 0.65rem; }
  .input-wrap input {
    flex: 1;
    min-width: 0;
    background: var(--t-bg2);
    border: 1px solid var(--t-bd);
    border-radius: var(--t-radius, 8px);
    color: var(--t-fg);
    font-family: inherit;
    font-size: 0.92rem;
    padding: 0.7rem 0.9rem;
    outline: none;
    transition: border-color var(--t-motion, .15s), box-shadow var(--t-motion, .15s);
  }
  .input-wrap input:focus {
    border-color: #f59e0b;
    box-shadow: 0 0 0 3px rgba(245,158,11,0.18);
  }
  #sendBtn {
    background: #f59e0b;
    color: #0d0d0d;
    border: 1px solid transparent;
    border-radius: var(--t-radius, 8px);
    padding: 0 1.25rem;
    font-family: inherit;
    font-size: 0.9rem;
    font-weight: 700;
    cursor: pointer;
    transition: transform .12s, box-shadow var(--t-motion, .15s), filter .15s;
  }
  #sendBtn:hover:not(:disabled) {
    transform: translateY(-1px);
    box-shadow: 0 4px 16px rgba(245,158,11,0.28);
    filter: brightness(1.05);
  }
  #sendBtn:active { transform: translateY(0); }
  #sendBtn:disabled { opacity: 0.45; cursor: default; }
  .chat-locked {
    text-align: center;
    padding: 2.5rem 1rem;
    color: #f59e0b;
    font-style: italic;
  }
  .author.neon_purple { color: #d946ef !important; text-shadow: 0 0 10px rgba(217,70,239,0.5); }
  .author.electric_blue { color: #3b82f6 !important; text-shadow: 0 0 10px rgba(59,130,246,0.5); }
  .author.mint_flash { color: #c084fc !important; text-shadow: 0 0 10px rgba(192,132,252,0.45); }
  .author.rose_spark { color: #fb7185 !important; text-shadow: 0 0 10px rgba(251,113,133,0.45); }
  .author.ember_red { color: #ef4444 !important; text-shadow: 0 0 10px rgba(239,68,68,0.5); }
  .author.void_white { color: #f8fafc !important; text-shadow: 0 0 12px rgba(248,250,252,0.45); }
  .author.gold_glow { color: #f59e0b !important; text-shadow: 0 0 15px rgba(245,158,11,0.8); }
  .author.rainbow_name {
    background: linear-gradient(90deg, #ff0000, #ff7f00, #ffff00, #00ff00, #0000ff, #4b0082, #8b00ff);
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    background-size: 200% auto; animation: rainbow_move 3s linear infinite;
    font-weight: 800;
    display: inline-block;
  }
  @keyframes rainbow_move { to { background-position: 200% center; } }
  .chat-badge { font-size: 0.7rem; margin-left: 0.3rem; vertical-align: middle; }
  .badge-verified { color: #3b82f6; }
  .badge-og { color: #ef4444; border: 1px solid #ef4444; padding: 0 0.2rem; border-radius: 3px; font-weight: 800; text-transform: uppercase; font-size: 0.55rem; }
  .badge-shop { color: #f59e0b; border: 1px solid rgba(245,158,11,.5); padding: 0 0.2rem; border-radius: 3px; font-weight: 800; text-transform: uppercase; font-size: 0.55rem; }
  .mod-modal-card {
    background: var(--t-bg2);
    border: 1px solid color-mix(in srgb, #f59e0b 45%, var(--t-bd));
    border-radius: calc(var(--t-radius, 8px) + 4px);
    padding: 1.35rem;
    width: 90%;
    max-width: 25rem;
    color: var(--t-fg);
    box-shadow: 0 16px 40px rgba(0,0,0,0.45);
    font-family: inherit;
  }
  .mod-modal-card h3 {
    font-family: Outfit, system-ui, sans-serif;
    font-size: 1rem;
    color: #f59e0b;
    margin: 0;
  }
  .mod-modal-card .mod-actions { display: flex; flex-direction: column; gap: 0.55rem; }
  .mod-modal-card .mod-actions button {
    background: var(--t-bg3);
    color: var(--t-fg);
    border: 1px solid var(--t-bd);
    padding: 0.65rem 0.75rem;
    border-radius: var(--t-radius, 8px);
    cursor: pointer;
    text-align: left;
    font-size: 0.84rem;
    font-family: inherit;
  }
  .mod-modal-card .mod-actions button:hover { border-color: #f59e0b; }
  @media (max-width: 719px) {
    .chat-box { height: min(24rem, 52vh); padding: 0.85rem; }
    .input-wrap { flex-direction: column; }
    #sendBtn { min-height: 2.55rem; width: 100%; }
  }
</style>
</head>
<body>
<main class="app-main">
  <header class="page-head">
    <h1>Premium <span>Lounge</span></h1>
    <p class="page-sub">A private space for approved members.</p>
  </header>

  <section class="panel chat-shell">
    <div id="chatBox" class="chat-box"></div>
    <form id="chatForm" class="input-wrap">
        <input type="text" id="chatInput" placeholder="Type a message..." maxlength="1000" autocomplete="off">
        <button type="submit" id="sendBtn">Send</button>
    </form>
  </section>
</main>

<script>
    const chatBox = document.getElementById('chatBox');
    const chatForm = document.getElementById('chatForm');
    const chatInput = document.getElementById('chatInput');
    let myEmail = null;
    let isModOrAdmin = false;
    let lastTs = 0;

    async function loadMe() {
        const r = await fetch('/api/me');
        const d = await r.json();
        if (!d.email) location.href = '/enroll.html';
        myEmail = d.email;
        isModOrAdmin = d.isAdmin || d.isModerator;
    }

    async function fetchHistory() {
        try {
            const r = await fetch('/api/premium-chat/history');
            if (r.status === 403) {
                chatBox.innerHTML = '<div class="chat-locked">This sanctuary is reserved for Premium members.</div>';
                chatInput.disabled = true;
                document.getElementById('sendBtn').disabled = true;
                return;
            }
            const d = await r.json();
            if (d.messages) {
                if (d.messages.length > 0) {
                    const minTs = d.messages[0].ts;
                    const currentIds = new Set(d.messages.map(m => m.id).filter(Boolean));
                    chatBox.querySelectorAll('.msg').forEach(el => {
                        const mid = el.getAttribute('data-msg-id');
                        const mts = Number(el.getAttribute('data-msg-ts') || 0);
                        if (mid && mts >= minTs && !currentIds.has(mid)) {
                            el.remove();
                        }
                    });
                }

                const newMsgs = d.messages.filter(m => m.ts > lastTs);
                if (newMsgs.length > 0) {
                    newMsgs.forEach(renderMsg);
                    chatBox.scrollTop = chatBox.scrollHeight;
                    lastTs = d.messages[d.messages.length - 1].ts;
                }
            }
        } catch (e) {}
    }

    async function directDeleteMessage(msgId, room) {
        if (!(await customConfirm('Delete', "Delete this message?"))) return;
        const r = await fetch('/api/chat/delete-message', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({ room, msgId })
        });
        if (r.ok) {
            fetchHistory();
        } else {
            const d = await r.json();
            alert("Error: " + d.error);
        }
    }

    function renderMsg(m) {
        const div = document.createElement('div');
        const isOwn = m.email === myEmail;
        div.className = 'msg' + (isOwn ? ' own' : '');
        div.setAttribute('data-msg-id', m.id || '');
        div.setAttribute('data-msg-ts', m.ts || 0);
        div.setAttribute('data-email', m.email || '');
        
        const badgeLabels = {
    verified_badge: { text: '✔', cls: 'badge-verified' },
    og_badge: { text: '📜', cls: 'badge-og' },
    artist_badge: { text: '🎨', cls: 'badge-shop' },
    chess_badge: { text: '♟', cls: 'badge-shop' },
    builder_badge: { text: '🛠', cls: 'badge-shop' },
    lucky_badge: { text: '🍀', cls: 'badge-shop' },
    premium_star_badge: { text: '⭐', cls: 'badge-shop' },
    owner_fan_badge: { text: '👑', cls: 'badge-shop' },
  };
        const badge = badgeLabels[m.badge];
        let badgeHtml = badge ? `<span class="chat-badge ${badge.cls}" title="${badge.title}">${badge.text}</span>` : '';

        const colorClass = m.color || '';
        const effectClass = String(m.chatEffect || '').replace(/[^a-z0-9_-]/gi, '');
        if (effectClass) div.classList.add(effectClass);

        let modHtml = '';
        let deleteBtnHtml = '';
        if (isModOrAdmin) {
            modHtml = `<span class="mod-trigger" style="cursor:pointer; font-size:10px; margin-left:6px; opacity:0.6;" onclick="showModMenu('${m.id || ''}', '${escapeHtml(m.email || '')}', '${escapeHtml(m.name || '')}', 'premium')">🛡️</span>`;
            deleteBtnHtml = `<span class="delete-msg-x" style="cursor:pointer; font-weight:bold; color:#ef4444; margin-left:8px; opacity:0.5; transition:opacity 0.2s;" onmouseover="this.style.opacity='1'" onmouseout="this.style.opacity='0.5'" onclick="directDeleteMessage('${m.id || ''}', 'premium')">×</span>`;
        }

        div.innerHTML = `
            <span class="author ${colorClass}">${m.name}${badgeHtml}${modHtml}${deleteBtnHtml}</span>
            <span class="text">${escapeHtml(m.text)}</span>
        `;
        chatBox.appendChild(div);
    }

    function escapeHtml(t) {
        return t.replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
    }

    chatForm.onsubmit = async (e) => {
        e.preventDefault();
        const text = chatInput.value.trim();
        if (!text) return;
        
        let recaptcha_token = '';
        for (let i = 0; i < 50; i++) {
            if (window.getCaptchaToken && window.grecaptcha) break;
            await new Promise(r => setTimeout(r, 100));
        }
        if (window.getCaptchaToken) {
            recaptcha_token = await window.getCaptchaToken('premium_chat_send') || '';
        }
        
        chatInput.value = '';
        const r = await fetch('/api/premium-chat/send', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({ text, recaptcha_token })
        });
        if (!r.ok) {
            const err = await r.json();
            alert(err.error || "Failed to send message");
        }
        fetchHistory();
    };

    function showModMenu(msgId, email, name, room) {
        const existing = document.getElementById('mod-modal');
        if (existing) existing.remove();

        const modal = document.createElement('div');
        modal.id = 'mod-modal';
        modal.style.position = 'fixed';
        modal.style.inset = '0';
        modal.style.background = 'rgba(0,0,0,0.85)';
        modal.style.zIndex = '99999';
        modal.style.display = 'flex';
        modal.style.alignItems = 'center';
        modal.style.justifyContent = 'center';
        modal.style.backdropFilter = 'blur(8px)';

        modal.innerHTML = `
            <div class="mod-modal-card">
                <div style="display:flex; align-items:center; margin-bottom:1rem;">
                    <h3>Moderator</h3>
                    <span id="close-mod-modal" style="cursor:pointer; opacity:0.6; font-weight:800; font-size:1.1rem; margin-left:auto;">&times;</span>
                </div>
                <div style="font-size:0.78rem; color:var(--t-fg2); margin-bottom:1.1rem; word-break:break-all;">
                    Target: <strong style="color:var(--t-fg)">${escapeHtml(name)}</strong> (${escapeHtml(email)})<br>
                    Room: <strong style="color:var(--t-fg)">${room.toUpperCase()}</strong>
                </div>
                <div class="mod-actions">
                    <button id="mod-action-del-msg" type="button">Delete Message</button>
                    <button id="mod-action-del-user" type="button">Delete All Messages from User</button>
                    <button id="mod-action-timeout" type="button">Timeout User (Mute)</button>
                    <button id="mod-action-ban" type="button">Ban from Chatroom (toggle)</button>
                    <button id="mod-action-warn" type="button">Send Warning</button>
                </div>
            </div>
        `;

        document.body.appendChild(modal);

        const closeBtn = document.getElementById('close-mod-modal');
        closeBtn.onclick = () => modal.remove();
        modal.onclick = (e) => { if (e.target === modal) modal.remove(); };

        document.getElementById('mod-action-del-msg').onclick = async () => {
            if (!(await customConfirm('Delete', "Delete this message?"))) return;
            const r = await fetch('/api/chat/delete-message', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ room, msgId })
            });
            if (r.ok) {
                modal.remove();
                fetchHistory();
            } else {
                const d = await r.json();
                alert("Error: " + d.error);
            }
        };

        document.getElementById('mod-action-del-user').onclick = async () => {
            if (!(await customConfirm('Delete All', `Delete all messages from ${name} in ${room} chat?`))) return;
            const r = await fetch('/api/chat/delete-user-messages', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ room, userEmail: email })
            });
            if (r.ok) {
                modal.remove();
                fetchHistory();
            } else {
                const d = await r.json();
                alert("Error: " + d.error);
            }
        };

        document.getElementById('mod-action-timeout').onclick = async () => {
            const minutes = await customPrompt('Timeout', "Timeout duration in minutes (e.g. 10):", "10");
            if (!minutes) return;
            const secs = Number(minutes) * 60;
            if (isNaN(secs) || secs <= 0) return alert("Invalid duration");
            const r = await fetch('/api/chat/timeout-user', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ room, userEmail: email, durationSeconds: secs })
            });
            if (r.ok) {
                modal.remove();
                alert(`User muted for ${minutes} minutes in this chatroom.`);
            } else {
                const d = await r.json();
                alert("Error: " + d.error);
            }
        };

        document.getElementById('mod-action-ban').onclick = async () => {
            const isBanned = await customConfirm('Room Ban', `Do you want to ban ${name} from this chatroom? (Cancel to unban/toggle off)`);
            const r = await fetch('/api/chat/ban-user', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ room, userEmail: email, ban: isBanned })
            });
            if (r.ok) {
                modal.remove();
                alert(`Ban status updated to: ${isBanned ? 'Banned' : 'Not Banned'}`);
            } else {
                const d = await r.json();
                alert("Error: " + d.error);
            }
        };

        document.getElementById('mod-action-warn').onclick = async () => {
            const message = await customPrompt('Warn', `Enter warning text for ${name}:`);
            if (!message) return;
            const r = await fetch('/api/chat/warn-user', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ userEmail: email, message })
            });
            if (r.ok) {
                modal.remove();
                alert("Warning sent to user!");
            } else {
                const d = await r.json();
                alert("Error: " + d.error);
            }
        };
    }

    loadMe().then(() => {
        fetchHistory();
        setInterval(fetchHistory, 3000);
    });
</script>
<script src="/cookie-consent.js" defer></script>
</body>
</html>
