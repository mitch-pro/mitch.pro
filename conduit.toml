[global]
server_name = "mitch.pro"
log = "trace"
database_backend = "rocksdb"
database_path = "/var/lib/matrix-conduit"
port = 6167
address = "0.0.0.0"
max_request_size = 20_000_000
allow_registration = true
allow_encryption = true
# Federation is off. Conduit cannot allow only outgoing federation, so turning it
# on would let accounts from other servers (matrix.org etc.) join our rooms.
allow_federation = false
trusted_servers = []
