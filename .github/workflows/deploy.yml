name: Deploy to Production

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  test:
    name: Unit tests
    runs-on: ubuntu-latest
    outputs:
      only_static: ${{ steps.diff_check.outputs.only_static }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Check for non-static changes
        id: diff_check
        run: |
          if [ "${{ github.event_name }}" = "push" ] && [ "${{ github.event.before }}" != "" ] && [ "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ]; then
            git fetch origin ${{ github.event.before }} --depth=1 2>/dev/null || true
            CHANGED=$(git diff --name-only ${{ github.event.before }} ${{ github.sha }} 2>/dev/null || git diff --name-only HEAD~1 HEAD 2>/dev/null || echo "")
          else
            CHANGED=$(git diff --name-only HEAD~1 HEAD 2>/dev/null || echo "")
          fi

          echo "Changed files:"
          echo "$CHANGED"

          ONLY_STATIC=true
          if [ -z "$CHANGED" ]; then
            ONLY_STATIC=false
          else
            while IFS= read -r file; do
              [ -z "$file" ] && continue
              case "$file" in
                webserver/*|docs/*|*.md|.gitignore|LICENSE|*.txt)
                  ;;
                *)
                  ONLY_STATIC=false
                  break
                  ;;
              esac
            done <<< "$CHANGED"
          fi

          echo "only_static=$ONLY_STATIC" >> "$GITHUB_OUTPUT"
          echo "Is only static changes: $ONLY_STATIC"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust

      - name: Run unit tests
        # Browser regressions run against isolated local fixtures in rust-ci;
        # that entire workflow must pass before the production job can start.
        run: cargo test --manifest-path rust/Cargo.toml --workspace

      - name: Require successful CI for this revision
        if: github.event_name == 'push'
        timeout-minutes: 20
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for attempt in $(seq 1 60); do
            RUN=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/rust-ci.yml/runs?head_sha=$GITHUB_SHA&event=push&per_page=5" --jq '.workflow_runs | sort_by(.run_number) | last | [.status, .conclusion] | @tsv')
            read -r STATUS CONCLUSION <<< "$RUN"
            if [ "$STATUS" = "completed" ]; then
              if [ "$CONCLUSION" = "success" ]; then
                echo "CI passed for $GITHUB_SHA"
                exit 0
              fi
              echo "::error::CI finished with $CONCLUSION. Production deployment is blocked."
              exit 1
            fi
            sleep 20
          done
          echo "::error::Timed out waiting for CI. Production deployment is blocked."
          exit 1

      - name: Check deployment authorization
        if: github.event_name == 'push' && github.actor != 'Mitch-Fogler' && github.actor != 'tylerthompson3725'
        run: |
          echo "::notice title=Deployment Guard::Push to master by ${{ github.actor }} detected. Automatic server deployment is skipped pending review by an authorized deployer."

  deploy:
    name: Build & Blue-Green Deploy
    runs-on: ubuntu-latest
    needs: test
    if: github.actor == 'Mitch-Fogler' || github.actor == 'tylerthompson3725'

    steps:
      - name: Trigger Remote Deployment
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 38222
          timeout: 30m
          command_timeout: 30m
          script: |
            set -e
            # Pre-flight: safeguard untracked admins.json so git pull never deletes it on server
            if [ -f /home/mitch/server/bun/data/admins.json ]; then
              cp -p /home/mitch/server/bun/data/admins.json /tmp/admins.json.ci.bak
              mkdir -p /home/mitch/server/bun/data_backup
              cp -p /home/mitch/server/bun/data/admins.json /home/mitch/server/bun/data_backup/admins.json
            fi

            restore_admins_guard() {
              if [ ! -f /home/mitch/server/bun/data/admins.json ]; then
                if [ -f /tmp/admins.json.ci.bak ]; then
                  echo "[deploy-ci] Restoring untracked data/admins.json from /tmp backup..."
                  cp -p /tmp/admins.json.ci.bak /home/mitch/server/bun/data/admins.json
                elif [ -f /home/mitch/server/bun/data_backup/admins.json ]; then
                  echo "[deploy-ci] Restoring untracked data/admins.json from data_backup..."
                  cp -p /home/mitch/server/bun/data_backup/admins.json /home/mitch/server/bun/data/admins.json
                elif [ -f /home/mitch/server/bun/data/admins.json.example ]; then
                  echo "[deploy-ci] Initializing data/admins.json from example template..."
                  cp -p /home/mitch/server/bun/data/admins.json.example /home/mitch/server/bun/data/admins.json
                fi
              fi
            }

            # deploy.sh holds the deployment lock, detects the live slot before
            # pulling, and refreshes static updates without rebuilding services.
            echo "[deploy-ci] Running deployment script..."
            if [ "${{ contains(github.event.head_commit.message, '[quiet]') }}" = "true" ]; then
              DEPLOY_SCRIPT=$(mktemp /tmp/mitch-deploy.XXXXXX)
              trap 'rm -f "$DEPLOY_SCRIPT"' EXIT
              curl --fail --silent --show-error --location \
                "https://raw.githubusercontent.com/mitch-pro/mitch.pro/${{ github.sha }}/tools/deploy.sh" \
                --output "$DEPLOY_SCRIPT"
              sudo env MITCH_DEPLOY_QUIET=1 bash "$DEPLOY_SCRIPT"
            else
              sudo /usr/local/bin/deploy.sh
            fi
            restore_admins_guard
