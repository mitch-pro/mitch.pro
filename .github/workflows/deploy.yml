name: Deploy to Production

on:
  push:
    branches:
      - master
      - dev
  workflow_dispatch:

# One deploy at a time per branch: dev and production deploys don't block
# each other, but two pushes to the same branch still run in order.
concurrency:
  group: deploy-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  test:
    name: Unit tests
    runs-on: ubuntu-latest
    outputs:
      only_static: ${{ steps.diff_check.outputs.only_static }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Check for non-static changes
        id: diff_check
        run: |
          if [ "${{ github.event_name }}" = "push" ] && [ "${{ github.event.before }}" != "" ] && [ "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ]; then
            git fetch origin ${{ github.event.before }} --depth=1 2>/dev/null || true
            CHANGED=$(git diff --name-only ${{ github.event.before }} ${{ github.sha }} 2>/dev/null || git diff --name-only HEAD~1 HEAD 2>/dev/null || echo "")
          else
            CHANGED=$(git diff --name-only HEAD~1 HEAD 2>/dev/null || echo "")
          fi

          echo "Changed files:"
          echo "$CHANGED"

          ONLY_STATIC=true
          if [ -z "$CHANGED" ]; then
            ONLY_STATIC=false
          else
            while IFS= read -r file; do
              [ -z "$file" ] && continue
              case "$file" in
                webserver/*|docs/*|*.md|.gitignore|LICENSE|*.txt)
                  ;;
                *)
                  ONLY_STATIC=false
                  break
                  ;;
              esac
            done <<< "$CHANGED"
          fi

          echo "only_static=$ONLY_STATIC" >> "$GITHUB_OUTPUT"
          echo "Is only static changes: $ONLY_STATIC"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust

      - name: Run unit tests
        # Integration tests are skipped here because they need a clean data/
        # and SSH into the live environment. They are run from the VPS via
        # tools/deploy.sh before the blue/green swap.
        run: cargo test --manifest-path rust/Cargo.toml --workspace

      - name: Check deployment authorization
        if: github.event_name == 'push' && github.actor != 'urashil' && github.actor != 'tylerthompson3725'
        run: |
          echo "::notice title=Deployment Guard::Push to master by ${{ github.actor }} detected. Automatic server deployment is skipped pending review by an authorized deployer."

  deploy:
    name: Build & Blue-Green Deploy
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/master' && (github.actor == 'urashil' || github.actor == 'tylerthompson3725')

    steps:
      - name: Trigger Remote Deployment
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 38222
          timeout: 30m
          command_timeout: 30m
          script: |
            set -e
            # Pre-flight: safeguard untracked admins.json so git pull never deletes it on server
            if [ -f /home/mitch/server/bun/data/admins.json ]; then
              cp -p /home/mitch/server/bun/data/admins.json /tmp/admins.json.ci.bak
              mkdir -p /home/mitch/server/bun/data_backup
              cp -p /home/mitch/server/bun/data/admins.json /home/mitch/server/bun/data_backup/admins.json
            fi

            restore_admins_guard() {
              if [ ! -f /home/mitch/server/bun/data/admins.json ]; then
                if [ -f /tmp/admins.json.ci.bak ]; then
                  echo "[deploy-ci] Restoring untracked data/admins.json from /tmp backup..."
                  cp -p /tmp/admins.json.ci.bak /home/mitch/server/bun/data/admins.json
                elif [ -f /home/mitch/server/bun/data_backup/admins.json ]; then
                  echo "[deploy-ci] Restoring untracked data/admins.json from data_backup..."
                  cp -p /home/mitch/server/bun/data_backup/admins.json /home/mitch/server/bun/data/admins.json
                elif [ -f /home/mitch/server/bun/data/admins.json.example ]; then
                  echo "[deploy-ci] Initializing data/admins.json from example template..."
                  cp -p /home/mitch/server/bun/data/admins.json.example /home/mitch/server/bun/data/admins.json
                fi
              fi
            }

            # deploy.sh holds the deployment lock, detects the live slot before
            # pulling, and refreshes static updates without rebuilding services.
            echo "[deploy-ci] Running deployment script..."
            sudo /usr/local/bin/deploy.sh
            restore_admins_guard

  deploy-dev:
    name: Build & Deploy (dev)
    runs-on: ubuntu-latest
    needs: test
    # The dev server (port 37222) has `dev` checked out; deploy.sh pulls the
    # checked-out branch, so this only deploys what is pushed to dev.
    if: github.ref == 'refs/heads/dev' && (github.actor == 'urashil' || github.actor == 'tylerthompson3725')

    steps:
      - name: Trigger Remote Deployment (dev)
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 37222
          timeout: 30m
          command_timeout: 30m
          script: |
            set -e
            # Pre-flight: safeguard untracked admins.json so git pull never deletes it on server
            if [ -f /home/mitch/server/bun/data/admins.json ]; then
              cp -p /home/mitch/server/bun/data/admins.json /tmp/admins.json.ci.bak
              mkdir -p /home/mitch/server/bun/data_backup
              cp -p /home/mitch/server/bun/data/admins.json /home/mitch/server/bun/data_backup/admins.json
            fi

            restore_admins_guard() {
              if [ ! -f /home/mitch/server/bun/data/admins.json ]; then
                if [ -f /tmp/admins.json.ci.bak ]; then
                  echo "[deploy-ci] Restoring untracked data/admins.json from /tmp backup..."
                  cp -p /tmp/admins.json.ci.bak /home/mitch/server/bun/data/admins.json
                elif [ -f /home/mitch/server/bun/data_backup/admins.json ]; then
                  echo "[deploy-ci] Restoring untracked data/admins.json from data_backup..."
                  cp -p /home/mitch/server/bun/data_backup/admins.json /home/mitch/server/bun/data/admins.json
                elif [ -f /home/mitch/server/bun/data/admins.json.example ]; then
                  echo "[deploy-ci] Initializing data/admins.json from example template..."
                  cp -p /home/mitch/server/bun/data/admins.json.example /home/mitch/server/bun/data/admins.json
                fi
              fi
            }

            # deploy.sh holds the deployment lock, detects the live slot before
            # pulling, and refreshes static updates without rebuilding services.
            echo "[deploy-ci] Running deployment script..."
            sudo /usr/local/bin/deploy.sh
            restore_admins_guard
