name: Tyler Push Limit

# GitHub can't block a push before it lands - repo admins bypass branch
# protection by design, and Tyler has admin. So this reacts after the
# fact: on his 4th direct push to master within a trailing 60-minute
# window, it drops his role from admin back to push-only, which makes
# him subject to the required-PR-review rule again until Mitch
# restores admin manually. Every one of his pushes also gets an ntfy
# ping with the running count, win or lose.

on:
  push:
    branches: [master]

concurrency:
  group: tyler-push-limit
  cancel-in-progress: false

jobs:
  check-limit:
    name: Count recent pushes and enforce the limit
    runs-on: ubuntu-latest
    if: github.actor == 'tylerthompson3725'
    permissions:
      contents: read
      actions: read
      administration: write
    steps:
      - name: Count this actor's pushes to master in the last hour
        id: count
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          SINCE=$(date -u -d '-60 minutes' '+%Y-%m-%dT%H:%M:%SZ')
          COUNT=$(gh run list \
            --repo "${{ github.repository }}" \
            --workflow tyler-push-limit.yml \
            --branch master \
            --json createdAt,actor,event \
            --jq "[.[] | select(.event==\"push\" and .actor.login==\"tylerthompson3725\" and .createdAt >= \"$SINCE\")] | length")
          echo "count=$COUNT" >> "$GITHUB_OUTPUT"
          echo "Pushes by tylerthompson3725 to master in the last 60 minutes (including this one): $COUNT"

      - name: Downgrade admin back to push-only over the limit
        if: fromJSON(steps.count.outputs.count) >= 4
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api -X PUT "repos/${{ github.repository }}/collaborators/tylerthompson3725" -f permission=push
          echo "::notice title=Tyler Push Limit::Downgraded tylerthompson3725 from admin to push-only after ${{ steps.count.outputs.count }} pushes in the trailing hour. Branch protection (required PR + review) now applies to his pushes again until an owner restores admin."

      - name: Notify via ntfy
        if: always()
        continue-on-error: true
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          NTFY_USER: ${{ secrets.NTFY_USER }}
          NTFY_PASS: ${{ secrets.NTFY_PASS }}
          COUNT: ${{ steps.count.outputs.count }}
          COMMIT_URL: ${{ github.event.compare }}
        run: |
          set -euo pipefail
          if [ -z "${NTFY_TOPIC:-}" ]; then
            echo "NTFY_TOPIC secret not set, skipping push notification."
            exit 0
          fi
          case "$NTFY_TOPIC" in
            http://*|https://*) URL="$NTFY_TOPIC" ;;
            *) URL="https://ntfy.sh/${NTFY_TOPIC#/}" ;;
          esac

          SAFE_COMPARE_URL=$(printf '%s' "$COMMIT_URL" | tr -d '\r\n' | cut -c1-500)

          if [ "${COUNT:-0}" -ge 4 ]; then
            TITLE="Tyler push #$COUNT this hour - access downgraded"
            BODY="Over the 3/hour limit. His role was dropped from admin to push-only; he needs a PR again until you restore it."
            PRIORITY="urgent"
          else
            TITLE="Tyler push #$COUNT this hour"
            BODY="Within the 3/hour limit."
            PRIORITY="default"
          fi

          curl -sS -o /dev/null -w 'ntfy response: %{http_code}\n' \
            -u "${NTFY_USER}:${NTFY_PASS}" \
            -H "Title: ${TITLE}" \
            -H "Priority: ${PRIORITY}" \
            -H "Click: ${SAFE_COMPARE_URL}" \
            --data-raw "$BODY" \
            "$URL"
