name: rust-ci

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy (warnings are errors)
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Tests
        run: cargo test --workspace
      - name: Build local server for email browser checks
        run: cargo build -p mitch-server
      - uses: actions/setup-node@v4
        with:
          node-version: '26'
          cache: npm
      - name: Install browser test dependencies
        working-directory: .
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Install Chromium
        working-directory: .
        run: npx playwright install --with-deps chromium
      - name: Shared UI and notification regressions
        working-directory: .
        run: |
          node tests/test_leaderboard_ui.mjs
          node tests/test_service_worker_unit.js
          node tests/test_notifications.mjs
      - name: Admin, VM, and presence browser regressions
        working-directory: .
        run: |
          node tests/test_admin_modernization.mjs
          node tests/test_presence_browser.mjs
      - name: Newsletter editor and delivery regressions
        working-directory: .
        run: node tests/test_admin_email_browser.mjs
  blooket:
    name: Blooket controller regressions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '26'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - run: npm run test:blooket
